// Promotion play-offs: at each tier boundary the top 2 of the lower division go up
// automatically, and clubs finishing 3rd–6th fight a knockout (semis 3v6 & 4v5,
// then a one-off final) for the last promotion spot. Run at season end (squads +
// stats still live). Winners are applied in startNextSeason's promotion block.
function playPromoTie(G, home, away){
  ensureXI(home, G.players); ensureXI(away, G.players);
  const box = simMatch(home, away, G.players, { cup:true, mustDecide:true, neutral:false, G });
  recordUserBox(G, box, "Play-off");
  const w = box.pens ? (box.pens.winner==="H"?home:away) : (box.hs>=box.as?home:away);
  return { home:home.abbr, away:away.abbr, hs:box.hs, as:box.as, pens:box.pens?`${box.pens.h}-${box.pens.a}`:null, aet:!!box.extraTime, winId:w.id, winAbbr:w.abbr };
}
function playPromoPlayoff(G, ci, lowerDiv){
  const t = tableFor(G, lowerDiv, ci);
  const s = [t[2], t[3], t[4], t[5]];   // 3rd, 4th, 5th, 6th
  if(s.some(x=>!x)) return null;
  const sf1 = playPromoTie(G, s[0], s[3]);   // 3 v 6
  const sf2 = playPromoTie(G, s[1], s[2]);   // 4 v 5
  const fin = playPromoTie(G, G.clubs[sf1.winId], G.clubs[sf2.winId]);
  return { country:ci, lowerDiv, semis:[sf1, sf2], final:fin, promotedId:fin.winId, promotedAbbr:fin.winAbbr };
}
function runPromotionPlayoffs(G){
  const results = [];
  COUNTRIES.forEach((C,ci)=>{
    for(let lowerDiv=1; lowerDiv<NUM_DIVS; lowerDiv++){
      const r = playPromoPlayoff(G, ci, lowerDiv);
      if(r) results.push(r);
    }
  });
  G.playoffs = { season:G.season, results };
  const user = G.clubs[G.userTeamId];
  results.forEach(r=>{
    if(!user) return;
    const involvedUser = r.semis.concat([r.final]).some(m=>m && (G.clubs[r.promotedId], [r.final.home,r.final.away,r.semis[0].home,r.semis[0].away,r.semis[1].home,r.semis[1].away].includes(user.abbr)));
    if(r.promotedId===user.id) logNews(G,"promo",`🎉 ${user.name} win the promotion play-off — up to the ${divName(user.country||0,r.lowerDiv-1)}!`, user.id);
    else if(involvedUser && (user.country||0)===r.country && user.div===r.lowerDiv) logNews(G,"promo",`😔 ${user.name}'s promotion play-off ends in heartbreak.`, user.id);
  });
}
// End-of-season verdict: did the manager meet the owner's expectation? Adjust
// confidence sharply, then sack an underperformer or field a poaching approach.
function evaluateBoardSeasonEnd(G){
  const user = G.clubs[G.userTeamId];
  const pos = leaguePos(G, user) || 12;
  // ---- grade the season's objectives (met/missed) + fan mood ----
  {
    const uid2 = G.userTeamId;
    const cup = (G.cups||[]).find(x=>x.country===(user.country||0));
    const cupRun = clubCupRun(G, cup, uid2);
    const contRun = clubContRun(G, G.contCup, uid2);
    const roundIdx = r => ["PR","R64","R32","R16","QF","SF","Final","W"].indexOf(r);
    const wonTrophy = (user.honours||[]).some(h=>h.season===G.season && ["league","cup","continental"].includes(h.type));
    const pn = user.lastPnl||{};
    const income = (pn.tv||0)+(pn.prize||0)+(pn.gate||0)+(pn.conc||0)+(pn.boxes||0)+(pn.merch||0)+(pn.shirt||0)+(pn.sleeve||0)+(pn.sponsor||0)+(pn.cup||0)+(pn.naming||0);
    const spend = (pn.wages||0)+(pn.overhead||0);
    let metCount=0, total=0;
    (G.objectives||[]).forEach(o=>{
      total++;
      if(o.kind==="league"){ o.met = pos <= expTargetPos(G); }
      else if(o.kind==="cup"){ o.met = !!cupRun && roundIdx(cupRun.round) >= roundIdx(o.target); }
      else if(o.kind==="cont"){ o.met = !!contRun && contRun.round!=="Group"; }
      else if(o.kind==="finance"){ o.met = income>=spend || user.budget>0; }
      if(o.met) metCount++;
    });
    G.lastObjectives = { season:G.season, objectives:(G.objectives||[]).map(o=>({kind:o.kind,text:o.text,met:!!o.met})), met:metCount, total };
    // fans: exceeding/missing the brief + trophies + relegation + ticket pricing
    const relegatedF = user.div < NUM_DIVS-1 && pos > (tableFor(G,user.div,user.country||0).length - 3);
    let fanDelta = (metCount - (total-metCount))*2.5;
    if(wonTrophy) fanDelta += 12;
    if(relegatedF) fanDelta -= 18;
    const tt = user.ticketTier!=null?user.ticketTier:1;   // 0 cheapest .. 3 dearest
    fanDelta += (1 - tt) * 1.5;                            // cheap tickets please fans, dear ones don't
    G.fanConfidence = clamp((G.fanConfidence==null?65:G.fanConfidence) + fanDelta, 0, 100);
  }
  if(!jobSecurityOn(G) || G.pendingSack) return;
  const target = expTargetPos(G);
  if(G.boardConfidence==null) G.boardConfidence=60;
  const beat = target - pos;   // >0 = exceeded expectation
  // secondary objectives (cup / continental / finance) nudge board confidence too
  const secMet = (G.objectives||[]).filter(o=>o.kind!=="league" && o.met).length;
  const secMiss = (G.objectives||[]).filter(o=>o.kind!=="league" && o.met===false).length;
  G.boardConfidence = clamp(G.boardConfidence + beat*5 + secMet*3 - secMiss*3, 0, 100);
  const div0 = user.div===0;
  const relegated = user.div < NUM_DIVS-1 && pos > (tableFor(G,user.div,user.country||0).length - 3);
  if((relegated && G.boardConfidence<45) || G.boardConfidence<=12){
    G.pendingSack = true;
    G.jobOffers = generateJobOffers(G, "sack");
    logNews(G, "job", `❗ The ${user.name} board has parted ways with you after the season.`, user.id);
  } else if(beat>=4 && G.boardConfidence>=70){
    // overperformed — a bigger club may come calling (optional move)
    const offers = generateJobOffers(G, "approach");
    if(offers.length){ G.jobOffers = offers; logNews(G, "job", `📈 Your work has attracted interest from bigger clubs.`, user.id); }
  }
}
function computeAwards(G){
  // a per-country award set (top flight only)
  G.awardHistory = G.awardHistory || [];
  const entry = { season:G.season, countries: [] };
  COUNTRIES.forEach((C,ci)=>{
    const all = Object.values(G.players).filter(p=>p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].country===ci && G.clubs[p.teamId].div===0 && p.stats.App>=10);
    if(!all.length){ entry.countries.push({ country:ci, pots:null, boot:null, glove:null, young:null }); return; }
    const boot = all.slice().sort((a,b)=>b.stats.G-a.stats.G)[0];
    const glove = all.filter(p=>p.pos==="GK").sort((a,b)=>b.stats.CS-a.stats.CS)[0];
    const pots = all.slice().sort((a,b)=>(avgRating(b.stats)+b.stats.G*0.03+b.stats.A*0.02)-(avgRating(a.stats)+a.stats.G*0.03+a.stats.A*0.02))[0];
    const yng = all.filter(p=>p.age<=21).sort((a,b)=>avgRating(b.stats)-avgRating(a.stats))[0];
    // Team of the Season: best-rated XI in a 1-4-3-3 (GK + 4 DF + 3 MF + 3 FW)
    const byR = arr => arr.slice().sort((a,b)=>avgRating(b.stats)-avgRating(a.stats));
    const tots = byR(all.filter(p=>p.pos==="GK")).slice(0,1)
      .concat(byR(all.filter(p=>GROUP(p.pos)==="DEF")).slice(0,4))
      .concat(byR(all.filter(p=>GROUP(p.pos)==="MID")).slice(0,3))
      .concat(byR(all.filter(p=>GROUP(p.pos)==="ATT")).slice(0,3));
    tots.forEach(p=>{ p.tots=(p.tots||0)+1; });
    entry.countries.push({ country:ci,
      pots: pots?{id:pots.id,name:pots.name,team:G.clubs[pots.teamId].abbr,r:+avgRating(pots.stats).toFixed(2)}:null,
      boot: boot?{id:boot.id,name:boot.name,team:G.clubs[boot.teamId].abbr,g:boot.stats.G}:null,
      glove: glove?{id:glove.id,name:glove.name,team:G.clubs[glove.teamId].abbr,cs:glove.stats.CS}:null,
      young: yng?{id:yng.id,name:yng.name,team:G.clubs[yng.teamId].abbr,r:+avgRating(yng.stats).toFixed(2)}:null,
      tots: tots.map(p=>({id:p.id,name:p.name,pos:p.pos,team:G.clubs[p.teamId].abbr,r:+avgRating(p.stats).toFixed(2),g:p.stats.G,a:p.stats.A})) });
    if(pots){ pots.awards=(pots.awards||0)+1; }
    if(boot){ boot.golden=(boot.golden||0)+1; }
    const userTots = tots.filter(p=>p.teamId===G.userTeamId);
    if(userTots.length) logNews(G,"award",`🏅 ${userTots.map(p=>p.name).join(", ")} named in the ${divName(ci,0)} Team of the Season!`, G.userTeamId);
  });
  // Ballon d'Or: world's best player across all leagues, weighted by league prestige
  // (top-flight scores higher) + goals + assists + caps + intl goals + club honours
  const candidates = Object.values(G.players).filter(p=>p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].div===0 && p.stats.App>=10);
  const ballon = candidates.slice().sort((a,b)=>{
    const score = p => {
      const r = avgRating(p.stats), ca = p.career||{};
      return r*2.5 + (p.stats.G||0)*0.35 + (p.stats.A||0)*0.18 + (p.caps||0)*0.04 + (p.intlG||0)*0.08
           + (p.awards||0)*0.3 + (p.golden||0)*0.25 + ((ca.App||0)/300);
    };
    return score(b)-score(a);
  })[0];
  if(ballon){
    ballon.ballonDor = (ballon.ballonDor||0)+1;
    const club = G.clubs[ballon.teamId];
    entry.ballonDor = { id:ballon.id, name:ballon.name, pos:ballon.pos, team:club?club.abbr:"—", r:+avgRating(ballon.stats).toFixed(2), g:ballon.stats.G||0 };
    logNews(G,"award",`🌟 ${ballon.name} wins the Ballon d'Or (${ballon.stats.G}g, ${avgRating(ballon.stats).toFixed(2)} avg)`, ballon.teamId);
  }
  G.awardHistory.unshift(entry);
}
// Roll the franchise into the next season: archive stats, age & develop players, expire
// contracts, promotion/relegation, youth intake, finances, fresh fixtures + cup.
function startNextSeason(G){
  ensureCareer(G); G.career.seasonsManaged++;
  // finish the World Cup if the user never pressed play on the knockout stage
  if(intlOn(G) && (!G.intl || G.intl.lastPlayed !== G.season)) playIntlTournament(G);
  returnLoans(G);   // loanees go back to their owners before aging/contracts
  // archive each player's season into history + career, then reset season stats
  Object.values(G.players).forEach(p=>{
    if(p.stats.App>0){
      p.history = p.history || [];
      // if he spent this season on loan, archive it under the loan club (marked)
      const loanClub = p._loanArchiveTeam!=null && G.clubs[p._loanArchiveTeam] ? G.clubs[p._loanArchiveTeam] : null;
      const club = loanClub || (p.teamId!=null && G.clubs[p.teamId] ? G.clubs[p.teamId] : null);
      if(p.debutSeason==null) p.debutSeason = G.season;
      // Full season record: every stat field + league/club context so it can be
      // sliced by competition later. ratingSum/ratingN are kept so per-league
      // averages and rating-value can be recomputed from any subset of seasons.
      p.history.push({ season:G.season,
        team: club ? club.abbr : "—", teamId: club ? club.id : p.teamId,
        country: club ? club.country : null, div: club ? club.div : null,
        league: club ? divName(club.country, club.div) : "—",
        loan: !!loanClub,
        age: p.age, ovr: p.ovr,
        ...p.stats, r:+avgRating(p.stats).toFixed(2) });
      // Keep a long history for players the user cares about; trim the AI filler
      // to a few recent seasons so saves stay small over many decades.
      const notable = (club && club.userControlled) || (p.peakOvr||0)>=80 || (p.caps||0)>0 || (p.career.G||0)>=40;
      const capH = notable ? 22 : 3;
      if(p.history.length>capH) p.history = p.history.slice(-capH);
      for(const k in p.stats) p.career[k] = (p.career[k]||0) + p.stats[k];
      // accumulate per-competition career totals (League / Cup / Champs Cup) so
      // all-time stats can be sliced by competition just like the season view
      p.careerComp = p.careerComp || {};
      for(const ck in (p.compStats||{})){
        if(!p.careerComp[ck]) p.careerComp[ck] = emptyStats();
        const src = p.compStats[ck];
        for(const k in src) p.careerComp[ck][k] = (p.careerComp[ck][k]||0) + src[k];
      }
    }
    p.stats = emptyStats(); p.compStats = {}; p._loanArchiveTeam = null;
    p.susp = 0; p.ycCount = 0; p.fitness = 100; p.seasonDev = 0; p.injury = null;   // bans/yellows clear; preseason rest heals everyone; reset in-season growth tally
  });
  // record club season history + reset table. Cup / continental runs are captured
  // here too (G.cups / G.contCup still hold the finished season at this point).
  // Clubs the user has ever managed keep their FULL season history (so the club's
  // season-by-season goes back to the very first year); AI clubs stay capped at 40
  // to keep the 640-club save bounded.
  const _managedIds = new Set(((G.career&&G.career.clubsManaged)||[]).map(s=>s.id));
  G.clubs.forEach(c=>{
    c.history = c.history || [];
    if(c.pld>0){   // a club that never kicked a ball (e.g. added by a world expansion) records nothing
      const cup = (G.cups||[]).find(x=>x.country===(c.country||0));
      c.history.push({ season:G.season, div:c.div, pos:leaguePos(G,c), w:c.w, d:c.d, l:c.l, gf:c.gf, ga:c.ga, pts:c.pts,
        cup: clubCupRun(G, cup, c.id), cont: clubContRun(G, G.contCup, c.id) });
    }
    const histCap = (c.userControlled || _managedIds.has(c.id)) ? 400 : 40;
    if(c.history.length>histCap) c.history = c.history.slice(-histCap);
  });
  // the manager's own season log (mirrors the club history row he just produced)
  {
    const uc = G.clubs[G.userTeamId];
    if(uc){
      const uh = uc.history[uc.history.length-1];
      G.career.seasons = G.career.seasons || [];
      G.career.seasons.unshift({ season:G.season, club:uc.abbr, name:uc.name, country:uc.country||0, div:uh.div, pos:uh.pos, pts:uh.pts, w:uh.w, d:uh.d, l:uh.l,
        cup:uh.cup?uh.cup.round:null, cont:uh.cont?uh.cont.round:null,
        trophies:(uc.honours||[]).filter(x=>x.season===G.season && ["league","cup","continental"].includes(x.type)).length });
      if(G.career.seasons.length>1000) G.career.seasons.length = 1000;   // effectively every season you've managed
    }
  }
  // age + develop everyone exactly ONCE. Free agents live in BOTH G.players
  // (teamId=null) and G.freeAgents — developing both lists aged every FA twice
  // per season (the "free agents age twice as fast" bug), so only develop a
  // freeAgents entry if it is NOT already in G.players.
  Object.values(G.players).forEach(p=>developPlayer(p, trainMultOf(G, p)));
  (G.freeAgents||[]).forEach(p=>{ if(!G.players[p.id]) developPlayer(p); });
  // Academy players auto-graduate to the senior squad once they're 20+ (they've
  // aged out of youth football) so prospects never get stuck in the academy.
  Object.values(G.players).forEach(p=>{
    if(!p.youth) return;
    const club = p.teamId!=null ? G.clubs[p.teamId] : null;
    // The user can set an OVR gate on their own academy (club.academyMinOvr): prospects
    // then stay in the academy developing until they reach that rating, instead of the
    // default auto-graduation at age 20. AI clubs (and an auto-managed user club) keep
    // the default: everyone graduates at 20, plus fast-track for standout teens.
    const userGate = (club && club.userControlled && !AUTO_MANAGE) ? (club.academyMinOvr||0) : 0;
    const aiFastTrack = club && aiManaged(club) && p.age>=17 && (p.ovr>=62 || (p.pot||0)>=78);
    const graduate = userGate>0 ? (p.ovr>=userGate) : (p.age>=20 || aiFastTrack);
    if(graduate){
      p.youth = false;
      if(club && club.userControlled && !AUTO_MANAGE){
        logNews(G,"youth",`🎓 ${p.name} (${p.pos} ${p.ovr}) graduates from the academy to the senior squad`, p.teamId);
      }
    }
  });
  hallOfFameCheck(G);
  updateRecords(G);   // snapshot careers into the persistent all-time records (before retirements delete anyone)
  // contracts: decrement, expiries become free agents
  G.freeAgents = G.freeAgents || [];
  // one-pass wage bills for the AI re-sign decisions below (a live wageBill()
  // world-scan per expiring player is O(world²) at 640 clubs). Kept roughly

  for(let i=0;i<n;i++){
    const pos = pick(ALL_POS);
    const p = makePlayer(pos, [16,18], -10 + lvl*1.5, club.country||0);
    // give academy prospects real headroom (better academies -> higher ceilings)
    p.pot = clamp(Math.max(p.pot, p.ovr + rint(8, 14+lvl*3)), p.ovr, 99);
    p.teamId = club.id; p.salary = Math.min(p.salary, 0.4); p.years = rint(2,4); p.youth = true;
    G.players[p.id] = p; intake.push(p);
    if(TEAM_IDX) (TEAM_IDX[club.id]=TEAM_IDX[club.id]||[]).push(p);
  }
  if(club.userControlled && !AUTO_MANAGE){
    G.youthIntake = intake.map(p=>({ id:p.id, name:p.name, pos:p.pos, ovr:p.ovr, pot:p.pot }));
    if(intake.length) logNews(G,"youth",`🎓 Youth intake: ${intake.map(p=>p.name+" ("+p.pos+" "+p.ovr+"→"+p.pot+")").join(", ")}`, club.id);
  }
}
// Refill a thin squad, targeting positional NEEDS (so every club keeps enough
// keepers, defenders, midfielders and forwards to field its formation naturally).
function refillSquad(G, club){
  let squad = teamPlayersOf(G.players, club.id).filter(p=>!p.youth);
  const adj = [-2,-8,-15,-21][club.div] || -8;
  const add = pos => { const p=makePlayer(pos,[18,29],adj,club.country||0); p.teamId=club.id; p.years=rint(1,3); p.salary=aiWageFor(p, club.div); G.players[p.id]=p; squad.push(p);
    if(TEAM_IDX) (TEAM_IDX[club.id]=TEAM_IDX[club.id]||[]).push(p); };   // keep the fast index truthful for the autoPickXI below
  const has = arr => squad.filter(p=>arr.includes(p.pos)).length;
  const DEF=["RB","LB","CB","RWB","LWB"], MID=["CDM","CM","CAM","RM","LM"], ATT=["RW","LW","ST"];
  let guard=0;
  while(has(["GK"])<3 && guard++<40) add("GK");
  guard=0; while(has(DEF)<7 && guard++<40) add(pick(["CB","CB","RB","LB"]));
  guard=0; while(has(MID)<7 && guard++<40) add(pick(["CM","CM","CDM","CAM"]));
  guard=0; while(has(ATT)<5 && guard++<40) add(pick(["ST","RW","LW"]));
  guard=0; while(squad.length<23 && guard++<40) add(pick(ALL_POS));
  autoPickXI(club, G.players);
}

/* ----------------------------- youth (5v5) ----------------------------- */
// A lightweight youth setup: every club fields a small-sided youth side of its
// academy prospects (age <= 19). Game time accrues (youthApps) and accelerates
// their development at the season rollover. The user's youth game is simmed in
// detail each matchday for flavour; AI clubs just bank the game time.
// Academy membership is the p.youth flag (NOT age) so a player is only ever in
// the youth squad OR the senior squad, never both.
function youthProspects(G, clubId){
  return teamPlayersOf(G.players, clubId).filter(p=>p.youth)
    .sort((a,b)=> b.pot-a.pot || b.ovr-a.ovr);
}
// The 5-a-side youth XI: best keeper + four best outfielders.
function youthFive(G, clubId){
  const pros = youthProspects(G, clubId);
  const gk = pros.find(p=>p.pos==="GK");
  const out = pros.filter(p=>p.pos!=="GK").slice(0, gk?4:5);
  return (gk?[gk]:[]).concat(out);
}
function youthStrength(G, clubId){
  const five = youthFive(G, clubId);
  if(!five.length) return 45;
  return five.reduce((s,p)=>s+p.ovr,0)/five.length;
}
function simYouthMatch(G, home, away){
  const sh = youthStrength(G, home.id), sa = youthStrength(G, away.id);
  const xgH = clamp(1.5*Math.exp(0.045*(sh-sa)), 0.3, 4.5), xgA = clamp(1.5*Math.exp(0.045*(sa-sh)), 0.3, 4.5);
  const hs = poisson(xgH), as = poisson(xgA);
  const attackers = youthFive(G, home.id).filter(p=>p.pos!=="GK");
  const scorers = [];
  for(let i=0;i<hs;i++){ const sc = attackers.length?pick(attackers):youthFive(G,home.id)[0]; if(sc){ sc.youthG=(sc.youthG||0)+1; scorers.push(sc.name); } }
  return { opp: away.abbr, oppName: away.name, hs, as, scorers, day: G.day+1 };
}
function accrueYouth(G){
  // bank a youth appearance for each club's playing prospects
  G.clubs.forEach(c=>{ youthFive(G, c.id).forEach(p=>{ p.youthApps=(p.youthApps||0)+1; }); });
  // detailed youth fixture for the user's club
  const u = G.clubs[G.userTeamId];
  const pool = G.clubs.filter(c=>c.id!==u.id && c.country===u.country);
  if(pool.length) G.youthLast = simYouthMatch(G, u, pick(pool));
}

/* ----------------------------- hall of fame ---------------------------- */
function hallOfFameCheck(G){
  G.hof = G.hof || [];
  Object.values(G.players).forEach(p=>{
    if(p.age>=34 && (p.career.G>=120 || (p.peakOvr>=88 && p.career.App>=250) || (p.awards||0)>=2)){
      if(!p.hof){ p.hof=true; G.hof.unshift({ id:p.id, name:p.name, pos:p.pos, nat:p.nat, G:p.career.G, A:p.career.A, App:p.career.App, peak:p.peakOvr, season:G.season,
        // self-contained snapshot so the HOF profile can show season-by-season +
        // per-competition splits forever, even if the player is purged later
        hist:(p.history||[]).slice(-22), cc:p.careerComp||null }); }
    }
  });
  if(G.hof.length>120) G.hof.length=120;
}
// Refresh a Hall of Famer's snapshot with his FINAL history (induction happens
// while he's still playing, so seasons after induction would otherwise be missing).
function refreshHofEntry(G, p){
  if(!p || !p.hof || !Array.isArray(G.hof)) return;
  const e = G.hof.find(h=>h.id===p.id);
  if(!e) return;
  if(Array.isArray(p.history) && p.history.length) e.hist = p.history.slice(-22);
  if(p.careerComp && Object.keys(p.careerComp).length) e.cc = p.careerComp;
  if(e.nat==null && p.nat!=null) e.nat = p.nat;
}

/* ----------------------------- internationals -------------------------- */
// A compact 4-nation tournament played in the international break (offseason).
// National teams are picked from every player by nationality (nat), independent
// of club. Caps & international goals persist on players. Toggle: internationals.
function intlOn(G){ return !G.settings || G.settings.internationals!==false; }
function eligibleNationals(G, country){
  return Object.values(G.players).filter(p=>p.nat===country && p.teamId!=null).sort((a,b)=>b.ovr-a.ovr);
}
// Pick a best XI ([{p,slot}]) from an explicit squad for a formation.
function pickXIFrom(squad, formation){
  const slots = FORMATIONS[formation] || FORMATIONS["4-3-3"];
  const used = new Set(); const out = new Array(slots.length).fill(null);
  const isKeeper = p => p.pos==="GK" || (p.positions||[]).includes("GK");
  const canPlay = (p,slot) => (p.positions||[p.pos]).includes(slot);
  const avail = () => squad.filter(p=>!used.has(p.id));
  slots.forEach((slot,i)=>{ if(slot!=="GK") return;
    const ks = avail().filter(isKeeper).sort((a,b)=>b.gk-a.gk);
    const pk = ks[0] || avail().sort((a,b)=>effRating(b,slot)-effRating(a,slot))[0];
    if(pk){ used.add(pk.id); out[i]={p:pk,slot}; } });
  const naturalCount = i => avail().filter(p=>canPlay(p,slots[i])).length;
  const outIdx = slots.map((s,i)=>i).filter(i=>slots[i]!=="GK").sort((a,b)=>naturalCount(a)-naturalCount(b));
  outIdx.forEach(i=>{ const slot=slots[i], pool=avail().filter(p=>!isKeeper(p));   // a keeper is never fielded outfield
    const nat = pool.filter(p=>canPlay(p,slot));
    const pk = nat.length ? nat.sort((a,b)=>b.ovr-a.ovr)[0] : pool.sort((a,b)=>effRating(b,slot)-effRating(a,slot))[0];
    if(pk){ used.add(pk.id); out[i]={p:pk,slot}; } });
  return out.filter(Boolean);
}
function unitFromLineup(lineup){
  let dS=0,dN=0,mS=0,mN=0,aS=0,aN=0,gk=50;
  lineup.forEach(({p,slot})=>{ const er=effRating(p,slot), b=BAND[slot];
    if(slot==="GK"){ gk=p.gk; return; }
    if(b<=2){ dS+=er; dN++; } else if(b===3){ mS+=er; mN++; } else { aS+=er; aN++; }
    if(b===2){ mS+=er*0.5; mN+=0.5; } });
  return { DEF:(dN?dS/dN:50)*0.7+gk*0.3, MID:mN?mS/mN:50, ATT:aN?aS/aN:50, gk };
}
// Sim one national-team match between two {ci,name,flag,xi} sides. Credits caps to
// everyone who played and international goals to scorers. Returns the result + scorers.
function simNationMatch(A, B, opts={}){
  MORALE_ON = false;   // internationals ignore club morale/form for a neutral feel
  const uA=unitFromLineup(A.xi), uB=unitFromLineup(B.xi);
  const aAtt=(0.55*n01(uA.ATT)+0.30*n01(uA.MID)+0.15*n01(uA.DEF));
  const aDef=(0.55*n01(uA.DEF)+0.30*n01(uA.MID)+0.15*n01(uA.ATT));
  const bAtt=(0.55*n01(uB.ATT)+0.30*n01(uB.MID)+0.15*n01(uB.DEF));
  const bDef=(0.55*n01(uB.DEF)+0.30*n01(uB.MID)+0.15*n01(uB.ATT));
  const xgA=clamp(1.32*Math.exp(1.7*(aAtt-bDef))*(opts.neutral?1:1.06),0.15,5.5);
  const xgB=clamp(1.32*Math.exp(1.7*(bAtt-aDef))*(opts.neutral?1:0.96),0.15,5.5);
  let hs=poisson(xgA), as=poisson(xgB);
  if(opts.mustDecide && hs===as){ if(chance(clamp(0.5+(uA.ATT-uB.ATT)/40,0.1,0.9))) hs++; else as++; }
  A.xi.concat(B.xi).forEach(({p})=>{ p.caps=(p.caps||0)+1; });
  const scorersOf=(side,n)=>{ const out=[]; for(let i=0;i<n;i++){ const sc=wpick(side,o=>(SCORE_W[o.slot]||0)*(0.5+n01(o.p.sho))*(hasTrait(o.p,"poacher")?1.5:1)); if(sc){ sc.p.intlG=(sc.p.intlG||0)+1; out.push(sc.p.name); } } return out; };
  return { hs, as, aScorers:scorersOf(A.xi,hs), bScorers:scorersOf(B.xi,as) };
}
// WORLD CUP: 8 nations → 2 groups of 4 → semi-finals (A1-B2, B1-A2) → final.
// The group round-robin (3 rounds) is spread over the season: round 1 in intl
// break 1, round 2 in break 2, round 3 + semis + final in the offseason.
// Caps + intl goals accrue each time.
function groupRounds(ids){
  return [ [[ids[0],ids[1]],[ids[2],ids[3]]],
           [[ids[0],ids[2]],[ids[1],ids[3]]],
           [[ids[0],ids[3]],[ids[1],ids[2]]] ];
}
function ensureIntlCycle(G){
  if(!G.intlCycle || G.intlCycle.season!==G.season || !Array.isArray(G.intlCycle.groups)){
    // fresh draw each season: the 8 nations split into two groups of 4
    const perm = COUNTRIES.map((_,i)=>i);
    for(let i=perm.length-1;i>0;i--){ const j=Math.floor(_rng()*(i+1)); [perm[i],perm[j]]=[perm[j],perm[i]]; }
    G.intlCycle = {
      season: G.season,
      groups: [perm.slice(0,4), perm.slice(4,8)],
      nations: COUNTRIES.map((_,ci)=>({ ci, pld:0,w:0,d:0,l:0,gf:0,ga:0,pts:0, results:[] })),
      breaksPlayed: 0
    };
  }
  return G.intlCycle;
}
// Play one group-stage round (both groups) and record it on the cycle.
function playIntlGroupRound(G, cycle, roundIdx, label){
  const userCountry = (G.clubs[G.userTeamId]||{}).country||0;
  cycle.groups.forEach(gids=>{
    (groupRounds(gids)[roundIdx]||[]).forEach(([ai,bi])=>{
      const a = { ci:ai, xi: pickXIFrom(eligibleNationals(G,ai).slice(0,23),"4-3-3") };
      const b = { ci:bi, xi: pickXIFrom(eligibleNationals(G,bi).slice(0,23),"4-3-3") };
      const r = simNationMatch(a, b, {});
      const ta=cycle.nations[ai], tb=cycle.nations[bi];
      ta.pld++; tb.pld++; ta.gf+=r.hs; ta.ga+=r.as; tb.gf+=r.as; tb.ga+=r.hs;
      if(r.hs>r.as){ta.w++;ta.pts+=3;tb.l++;}else if(r.hs<r.as){tb.w++;tb.pts+=3;ta.l++;}else{ta.d++;tb.d++;ta.pts++;tb.pts++;}
      ta.results.push({vs:bi,hs:r.hs,as:r.as}); tb.results.push({vs:ai,hs:r.as,as:r.hs});
      const aC=COUNTRIES[ai], bC=COUNTRIES[bi];
      if(ai===userCountry||bi===userCountry){
        const m={season:G.season,comp:label,homeName:aC.flag+" "+aC.name,awayName:bC.flag+" "+bC.name,
                 home:aC.flag+aC.name.slice(0,3),away:bC.flag+bC.name.slice(0,3),
                 hs:r.hs,as:r.as,hScorers:[],aScorers:[],motm:null,stat:null,timeline:[]};
        if(G._lmDay!==G.day){G.lastMatches=[];G._lmDay=G.day;}
        G.lastMatches.push(m); G.lastMatch=m;
      }
      logNews(G,"intl",`🌐 ${label}: ${aC.flag} ${aC.name} ${r.hs}-${r.as} ${bC.flag} ${bC.name}`,null);
    });
  });
}
function playIntlBreak(G){
  const cycle = ensureIntlCycle(G);
  if(cycle.breaksPlayed>=2) return;
  playIntlGroupRound(G, cycle, cycle.breaksPlayed, cycle.breaksPlayed===0?"World Cup Grp R1":"World Cup Grp R2");
  cycle.breaksPlayed++;
  G.intlCycle = cycle;
}
// Offseason: finish the groups, then knockout — semis (A1-B2, B1-A2) and final.
function playIntlTournament(G){
  const cycle = ensureIntlCycle(G);
  while(cycle.breaksPlayed < 2) playIntlBreak(G);
  playIntlGroupRound(G, cycle, 2, "World Cup Grp R3");
  const rankGroup = gids => gids.slice().sort((x,y)=>{ const A=cycle.nations[x], B=cycle.nations[y];
    return B.pts-A.pts || (B.gf-B.ga)-(A.gf-A.ga) || B.gf-A.gf; });
  const [ra, rb] = cycle.groups.map(rankGroup);
  const mk = ci => ({ ci, xi: pickXIFrom(eligibleNationals(G,ci).slice(0,23),"4-3-3") });
  const sf = []; const finalists = [];
  [[ra[0],rb[1]],[rb[0],ra[1]]].forEach(([x,y])=>{
    const r = simNationMatch(mk(x), mk(y), { mustDecide:true, neutral:true });
    sf.push({ a:x, b:y, hs:r.hs, as:r.as });
    finalists.push(r.hs>r.as ? x : y);
    logNews(G,"intl",`🌐 World Cup semi-final: ${COUNTRIES[x].flag} ${COUNTRIES[x].name} ${r.hs}-${r.as} ${COUNTRIES[y].flag} ${COUNTRIES[y].name}`,null);
  });
  const fr = simNationMatch(mk(finalists[0]), mk(finalists[1]), { mustDecide:true, neutral:true });
  const champ = fr.hs>fr.as ? finalists[0] : finalists[1];
  const runner = champ===finalists[0] ? finalists[1] : finalists[0];
  G.intl = G.intl || { history:[], lastPlayed:null };
  const tableOf = gids => rankGroup(gids).map(ci=>{ const n=cycle.nations[ci];
    return { ci, pld:n.pld, w:n.w, d:n.d, l:n.l, gf:n.gf, ga:n.ga, pts:n.pts }; });
  const entry = { season:G.season, champ, runnerUp:runner,
    groups: cycle.groups.map((gids,gi)=>({ name:gi===0?"A":"B", table: tableOf(gids) })),
    table: tableOf(cycle.groups[0]).concat(tableOf(cycle.groups[1])),   // legacy flat view
    sf, final:{ a:finalists[0], b:finalists[1], hs:fr.hs, as:fr.as, aScorers:fr.aScorers, bScorers:fr.bScorers } };
  G.intl.history.unshift(entry);
  if(G.intl.history.length>60) G.intl.history.length=60;
  G.intl.lastPlayed = G.season;
  G.intlCycle = null;   // reset for the next season's breaks
  const userCountry = (G.clubs[G.userTeamId]||{}).country||0;
  logNews(G, "intl", `🏆🌐 ${COUNTRIES[champ].flag} ${COUNTRIES[champ].name} win the World Cup!`, null);
  if(champ===userCountry) logNews(G, "intl", `🎉 Your nation are champions of the world!`, G.userTeamId);
  return entry;
}

/* ----------------------------- preseason ------------------------------- */
// Optional preseason tour played in the offseason: four friendlies for flavour,
// tour income, and a small morale/form lift heading into the new campaign.
// Friendlies don't touch league tables or season stats.
function playPreseason(G){
  const user = G.clubs[G.userTeamId];
  const opps = G.clubs.filter(c=>c.id!==user.id).slice().sort(()=>_rng()-0.5).slice(0,4);
  const results = opps.map(o=>{
    const sh=clubStrength(user,G.players), sa=clubStrength(o,G.players);
    const xgH=clamp(1.4*Math.exp(0.05*(sh-sa)),0.3,4.5), xgA=clamp(1.4*Math.exp(0.05*(sa-sh)),0.3,4.5);
    return { opp:o.abbr, oppName:o.name, hs:poisson(xgH), as:poisson(xgA) };
  });
  const income = round(stadiumCapacity(user)/1000 * ([0.9,0.5,0.3,0.18][user.div]||0.18) *10)/10;
  user.budget = round((user.budget + income)*10)/10;
  Object.values(G.players).filter(p=>p.teamId===user.id).forEach(p=>{
    p.morale = clamp((p.morale==null?70:p.morale)+5, 0, 100);
    p.form = clamp((p.form==null?6.7:p.form)+0.3, 4, 10);
  });
  G.preseason = { season:G.season, results, income };
  logNews(G, "finance", `🏝️ Preseason tour earned ${money(income)} and sharpened the squad.`, user.id);
  return G.preseason;
}

/* ----------------------------- transfers ------------------------------- */
// Buy a player from another club: pay the fee from your budget; he joins your squad.
// Paid transfers (buy/sell) + AI bids only happen in the summer or January window.
// Free agents (out-of-contract) can still be signed any time, as in real football.
// Career transfer log: every move a player makes, kept on the player (and in the
// retired archive) so his profile can show what he sold for at each step.
// type: "buy" (fee move) | "free" (free agent signing) | "rel" (released/left on a
// free) | "loan" | "loanret" | "unret" (out of retirement)
function logMove(G, p, type, fromId, toId, fee){
  if(!p) return;
  if(!Array.isArray(p.transfers)) p.transfers = [];
  const ab = id => (id!=null && G.clubs[id]) ? G.clubs[id].abbr : null;
  const f = (fee!=null&&fee>0)?round(fee*10)/10:null;
  p.transfers.push({ s:G.season, t:type, from:ab(fromId), to:ab(toId), fee:f });
  if(p.transfers.length>30) p.transfers = p.transfers.slice(-30);
  // per-club record signing / sale (fee moves only)
  if(type==="buy" && f){
    const buyer=G.clubs[toId], seller=G.clubs[fromId];
    if(buyer){ const r=ensureClubRecords(buyer); if(!r.recordBuy || f>r.recordBuy.fee) r.recordBuy={fee:f, name:p.name, pos:p.pos, from:ab(fromId), season:G.season}; }
    if(seller){ const r=ensureClubRecords(seller); if(!r.recordSale || f>r.recordSale.fee) r.recordSale={fee:f, name:p.name, pos:p.pos, to:ab(toId), season:G.season}; }
  }
}
function transferWindowOpen(G){
  if(G.phase==="offseason") return true;
  if(G.phase!=="regular") return false;
  return G.day<=2 || (G.day>=18 && G.day<=21);   // summer tail + January
}
function transferWindowLabel(G){
  if(G.phase==="offseason") return "🟢 Summer transfer window open";
  if(transferWindowOpen(G)) return G.day<=2 ? "🟢 Summer window — closes after matchday 3" : "🟢 January window — closes after matchday 22";
  if(G.day<18) return `🔴 Window closed — January opens at matchday 19 (in ${19-G.day})`;
  return "🔴 Window closed — reopens in the summer";
}
function buyPlayer(G, p, fee, opts={}){
  const buyer = G.clubs[G.userTeamId];
  if(!transferWindowOpen(G)) return { ok:false, msg:"The transfer window is closed." };
  if(buyer.budget < fee) return { ok:false, msg:"Not enough budget for that fee." };
  const seller = p.teamId!=null ? G.clubs[p.teamId] : null;
  buyer.budget = round((buyer.budget - fee)*10)/10;
  if(seller){ seller.budget = round((seller.budget + fee)*10)/10; }
  // a sell-on agreed with the selling club is owed on our NEXT sale of this player
  p.sellOn = (opts.sellOnPct && seller) ? { pct:opts.sellOnPct, toClubId:seller.id } : null;
  logMove(G, p, "buy", seller?seller.id:null, buyer.id, fee);
  p.teamId = buyer.id; p.years = Math.max(p.years||0, rint(2,4)); p.salary = wageFor(p);
  p.release = opts.release!=null ? opts.release : round(playerValue(p)*2*10)/10;   // new deal carries a fresh release clause
  autoPickXI(buyer, G.players);
  logNews(G,"transfer",`➡️ Signed ${p.pos} ${p.name} (${p.ovr}) for ${money(fee)}${opts.via==="release"?" (release clause)":""}`, buyer.id);
  ensureCareer(G); G.career.transferSpend = round((G.career.transferSpend+fee)*10)/10;
  // fans love a marquee signing
  if(p.ovr>=80 || fee>=60) bumpFans(G, 5, `The fans are buzzing about the signing of ${p.name}!`);
  else if(p.ovr>=74 || fee>=25) bumpFans(G, 2);
  return { ok:true };
}
// Sell one of your players to an AI club for a fee. Honors any sell-on owed to a former club.
function sellPlayer(G, p, fee, toClubId){
  if(!transferWindowOpen(G)) return false;
  const seller = G.clubs[G.userTeamId];
  const buyer = toClubId!=null ? G.clubs[toClubId] : null;
  let proceeds = fee;
  if(p.sellOn && G.clubs[p.sellOn.toClubId] && p.sellOn.toClubId!==seller.id){
    const cut = round(fee*(p.sellOn.pct/100)*10)/10;
    proceeds = round((fee-cut)*10)/10;
    G.clubs[p.sellOn.toClubId].budget = round((G.clubs[p.sellOn.toClubId].budget+cut)*10)/10;
    logNews(G,"transfer",`💸 ${money(cut)} of the ${p.name} fee went to ${G.clubs[p.sellOn.toClubId].abbr} (sell-on)`, seller.id);
  }
  seller.budget = round((seller.budget + proceeds)*10)/10;
  p.sellOn = null;
  logMove(G, p, "buy", seller.id, buyer?buyer.id:null, fee);
  if(buyer){ buyer.budget = round(Math.max(0, buyer.budget - fee)*10)/10; p.teamId = buyer.id; autoPickXI(buyer, G.players); }
  else { p.teamId = null; G.freeAgents=G.freeAgents||[]; G.freeAgents.push(p); }
  autoPickXI(seller, G.players);
  logNews(G,"transfer",`⬅️ Sold ${p.pos} ${p.name} (${p.ovr}) for ${money(fee)}`, seller.id);
  ensureCareer(G); G.career.transferIncome = round((G.career.transferIncome+proceeds)*10)/10;
  // selling a star upsets the fans (unless he wanted out)
  const wasStar = p.ovr>=80;
  if(wasStar && !p.wantsOut) bumpFans(G, -6, `Fans are unhappy at selling star ${p.name}.`);
  else if(p.ovr>=76 && !p.wantsOut) bumpFans(G, -2);
}
// The OFFSEASON TRANSFER MARKET between AI clubs. Without this, money never
// converted into squad strength (AI squads only changed via youth + fire sales),
// so every league regressed to near-total parity. Now wealthy, successful clubs
// spend their prize money on real upgrades — success compounds and strong sides
// can sustain a run — while selling clubs bank the fee and rebuild. Bounded so
// it's dynasty-FRIENDLY, not dynasty-guaranteed: rich sellers usually keep their
// star, fees scale with the seller's leverage, and squad caps still apply.
// Build a lightweight "who's buying" context once per offseason so the shed
// helpers below can broker fee sales without an O(world²) rescan each call.
function buildSellContext(G){
  const size={}, ratings={};
  Object.values(G.players).forEach(p=>{ if(p.teamId!=null && !p.youth){ size[p.teamId]=(size[p.teamId]||0)+1; (ratings[p.teamId]=ratings[p.teamId]||[]).push(p.ovr); } });
  const xiAvg={};
  G.clubs.forEach(c=>{ const a=(ratings[c.id]||[]).sort((x,y)=>y-x); xiAvg[c.id]=a.length?a.slice(0,11).reduce((s,v)=>s+v,0)/Math.min(11,a.length):50; });
  return { size, xiAvg, buyers: G.clubs.filter(aiManaged) };
}
// Try to SELL a good player to a solvent club that could use him — for a FEE —
// instead of dumping him into free agency. This is what stops good players from
// endlessly bouncing club-to-club on frees: clubs shedding quality get paid, the
// player lands at ONE club that wanted him, and money actually circulates.
// Returns true if a sale happened.
function trySellPlayer(G, p, ctx){
  if(!p || p.teamId==null || p.age>35) return false;
  // Value a player by his PROJECTED ability, so a young wonderkid is worth selling
  // for a fee well before he's a finished player (not lost on a free). Genuine
  // filler (low current + low ceiling) still gets released free below.
  const yw = clamp((26 - p.age)/10, 0, 1);
  const proj = p.ovr + Math.max(0, (p.pot||p.ovr) - p.ovr) * yw;
  if(proj < 60) return false;
  // he stays put if he already moved this season (no same-window flip) or was
  // bought last season (no back-to-back sales) — a good player shouldn't bounce
  if((p.transfers||[]).some(t=>t.s===G.season || (t.t==="buy" && t.s===G.season-1))) return false;
  const seller = G.clubs[p.teamId];
  const val = playerValue(p);
  const prospect = p.age<=21 && (p.pot||0) >= p.ovr+7;   // bought for the future, not to start now
  let best=null, bestScore=-1;
  for(const c of ctx.buyers){
    if(c.id===seller.id) continue;
    if((ctx.size[c.id]||0) >= 26) continue;
    if(c.budget < val*0.5 + 2) continue;
    // he'd get a game — relaxed for prospects (big clubs stockpile young talent)
    if(!prospect && p.ovr < (ctx.xiAvg[c.id]||50) - 6) continue;
    // prefer clubs where he'd be an upgrade, with money to spend
    const score = (proj - (ctx.xiAvg[c.id]||50)) + c.budget/200 + (prospect?3:0) + _rng()*2;
    if(score>bestScore){ bestScore=score; best=c; }
  }
  if(!best) return false;
  const fee = round(val*(0.55+_rng()*0.35)*10)/10;   // a real but motivated-sale fee
  best.budget = round((best.budget - fee)*10)/10;
  if(seller) seller.budget = round((seller.budget + fee)*10)/10;
  logMove(G, p, "buy", seller.id, best.id, fee);
  ctx.size[best.id] = (ctx.size[best.id]||0)+1;
  ctx.size[seller.id] = Math.max(0,(ctx.size[seller.id]||1)-1);
  p.teamId = best.id; p.years = rint(2,4); p.salary = aiWageFor(p, best.div);
  p.unhappy=false; p.expiredSince=null; p.wantsOut=false; p.listed=false;
  return true;
}
// Shed a player the club no longer wants: sell him for a fee if he's good enough
// to have a market, otherwise release him free.
function shedPlayer(G, p, ctx){
  if(ctx && trySellPlayer(G, p, ctx)) return;
  // A genuinely good player who couldn't be sold this window is NOT dumped on a
  // free (unrealistic for quality) — the club keeps him one more year on a short
  // deal. Only filler and end-of-career players actually hit free agency.
  if(p.ovr>=67 && p.age<34 && p.teamId!=null){ p.years=Math.max(p.years||0,1); p.unhappy=false; p.expiredSince=null; return; }
  releaseToFA(G, p);
}
function aiTransferWindow(G){
  const deals = [];
  const dealt = new Set();   // a player only moves once per window (no same-window flips)
  // One pass over the (large) world builds everything the market needs:
  // per-club rosters and a per-position bucket of sellable players (best first).
  const byTeam = {};
  const buckets = {};
  Object.values(G.players).forEach(p=>{
    if(p.teamId==null) return;
    (byTeam[p.teamId]=byTeam[p.teamId]||[]).push(p);
    if(p.teamId===G.userTeamId || p.youth || isLoaned(p) || p.age>31) return;
    // settled window: a player bought in the last window doesn't move again already
    if((p.transfers||[]).some(t=>t.t==="buy" && t.s>=G.season-1)) return;
    (p.positions||[p.pos]).forEach(pos=>{ (buckets[pos]=buckets[pos]||[]).push(p); });
  });
  for(const k in buckets) buckets[k].sort((a,b)=>b.ovr-a.ovr);
  const seniors = id => (byTeam[id]||[]).filter(p=>!p.youth);
  const buyers = G.clubs.filter(aiManaged).sort((a,b)=>b.budget-a.budget);
  buyers.forEach(c=>{
    const nBuys = c.budget>250 ? rint(1,3) : c.budget>120 ? rint(0,2) : (chance(0.3)?1:0);
    for(let i=0;i<nBuys;i++){
      if(seniors(c.id).length>=28) break;
      ensureXI(c, G.players);
      const xi=(c.xi||[]).map(id=>G.players[id]).filter(Boolean);
      const weak=xi.filter(p=>p.pos!=="GK").sort((a,b)=>a.ovr-b.ovr)[0];
      if(!weak) break;
      const cands = [];
      for(const p of (buckets[weak.pos]||[])){
        if(p.ovr < weak.ovr+3) break;   // bucket is sorted by OVR — nothing better below
        if(dealt.has(p.id) || p.teamId==null || p.teamId===c.id || p.teamId===G.userTeamId) continue;
        if((p.value*1.1) > c.budget*0.45) continue;
        cands.push(p);
        if(cands.length>=8) break;
      }
      if(!cands.length) continue;
      const target = cands[rint(0, Math.min(4, cands.length-1))];
      const seller = G.clubs[target.teamId];
      if(seniors(seller.id).length<=17) continue;                    // seller too thin to sell
      const sellerBest = seniors(seller.id).slice().sort((a,b)=>b.ovr-a.ovr)[0];
      const isStar = sellerBest && sellerBest.id===target.id;
      if(isStar && seller.budget>150 && chance(0.6)) continue;       // rich clubs usually keep their star
      const fee = round(target.value*(isStar?1.45:1.1)*10)/10;
      if(fee>c.budget*0.45) continue;
      c.budget = round((c.budget-fee)*10)/10;
      seller.budget = round((seller.budget+fee)*10)/10;
      logMove(G, target, "buy", seller.id, c.id, fee);
      dealt.add(target.id);
      byTeam[seller.id] = (byTeam[seller.id]||[]).filter(p=>p!==target);
      (byTeam[c.id]=byTeam[c.id]||[]).push(target);
      target.teamId = c.id; target.years = rint(2,4); target.salary = aiWageFor(target, c.div);
      target.wantsOut = false; target.listed = false; target.expiredSince = null;
      autoPickXI(c, G.players); autoPickXI(seller, G.players);
      deals.push({ fee, name:target.name, pos:target.pos, ovr:target.ovr, from:seller.abbr, to:c.abbr, country:c.country });
    }
  });
  // transfer-window headlines: the biggest moves worldwide + the biggest in the user's country
  deals.sort((a,b)=>b.fee-a.fee);
  const uc = (G.clubs[G.userTeamId]||{}).country||0;
  const shown = new Set();
  deals.slice(0,3).forEach(d=>{ shown.add(d); });
  const localBig = deals.find(d=>d.country===uc && !shown.has(d));
  if(localBig) shown.add(localBig);
  [...shown].forEach(d=>logNews(G,"transfer",`💰 Transfer window: ${d.pos} ${d.name} (${d.ovr}) joins ${d.to} from ${d.from} for ${money(d.fee)}`, G.userTeamId));
  return deals.length;
}
// AI clubs occasionally bid for your best/surplus players.
function generateTransferOffers(G){
  G.transferOffers = G.transferOffers || [];
  if(!transferWindowOpen(G)) return;
  if(G.transferOffers.length>=4) return;
  const squad = Object.values(G.players).filter(p=>p.teamId===G.userTeamId && !p.youth);
  if(squad.length<=18) return;
  // unsettled or transfer-listed players attract far more interest
  const target = wpick(squad, p=>p.value * (p.wantsOut?6:1) * (p.listed?4:1));
  if(!target) return;
  const suitors = G.clubs.filter(c=>c.id!==G.userTeamId && c.budget>target.value*1.1);
  if(!suitors.length) return;
  const by = pick(suitors);
  // if the player has a release clause a suitor can afford, they'll often just meet it
  const clauseMet = target.release!=null && by.budget>=target.release && chance(0.6);
  const fee = clauseMet ? target.release : round(target.value * ((target.wantsOut||target.listed?0.8:0.9) + _rng()*0.6) *10)/10;
  G.transferOffers.push({ id:"of"+Date.now()+Math.floor(_rng()*999), playerId:target.id, by:by.id, fee, release:clauseMet });
  logNews(G,"offer",`💬 ${by.name} ${clauseMet?"triggered the release clause for":"bid "+money(fee)+" for"} ${target.name}`, G.userTeamId);
}
// AI clubs shop the free-agent market every offseason, so good out-of-contract
// players actually find clubs instead of rotting in the pool. A player signs
// roughly at his level (a club whose squad he fits or improves), better players
// almost always get picked up, and old/weak ones mostly stay available.
function aiSignFreeAgents(G){
  const fas = (G.freeAgents||[]).slice().sort((a,b)=>b.ovr-a.ovr);
  if(!fas.length) return;
  // one pass: senior squad size + BEST-XI average per club (a whole-squad average
  // sits ~10 below the first team and would block every elite free agent)
  const byTeam = {};
  Object.values(G.players).forEach(p=>{ if(p.teamId!=null && !p.youth){ (byTeam[p.teamId]=byTeam[p.teamId]||[]).push(p.ovr); } });
  const size={}, xiAvg={};
  G.clubs.forEach(c=>{
    const arr=(byTeam[c.id]||[]).sort((a,b)=>b-a);
    size[c.id]=arr.length;
    xiAvg[c.id]=arr.length ? arr.slice(0,11).reduce((s,v)=>s+v,0)/Math.min(11,arr.length) : 50;
  });
  const aiClubs = G.clubs.filter(aiManaged);
  const signed = new Set();
  const headlines = [];
  fas.forEach(p=>{
    if(p.retired) return;
    // desire: the better (and younger) the player, the more surely he's snapped up
    let want = clamp(0.30 + (p.ovr-50)*0.025, 0.10, 0.96);
    if(p.age>=34) want *= 0.45; else if(p.age>=31) want *= 0.75;
    else if(p.age<=23 && p.ovr>=65) want = Math.max(want, 0.93);   // a young talent without a club never lasts long
    if(!chance(want)) return;
    const fits = aiClubs.filter(c=>{
      if((size[c.id]||0)>=26 || c.budget<=-10) return false;
      return p.ovr >= xiAvg[c.id]-9 && p.ovr <= xiAvg[c.id]+9;   // he'd get a game, and they'd want him
    });
    let club = fits.length ? pick(fits) : null;
    if(!club && p.ovr>=70){   // a star above everyone's level: the biggest clubs make room
      const top = aiClubs.filter(c=>(size[c.id]||0)<27 && c.budget>0).sort((a,b)=>xiAvg[b.id]-xiAvg[a.id]).slice(0,8);
      if(top.length) club = pick(top);
    }
    if(!club) return;
    logMove(G, p, "free", null, club.id, null);
    p.teamId = club.id; p.years = rint(1,3);
    p.salary = clamp(round(wageDemand(p)*0.9*divWageMult(club.div)*10)/10, 0.1, 30);
    p.unhappy = false; p.expiredSince = null; p.wantsOut = false; p.listed = false;
    if(p.youth && p.age>=17) p.youth = false;   // signed off the street = straight into the senior squad
    G.players[p.id] = p;
    size[club.id]=(size[club.id]||0)+1;
    signed.add(p.id);
    if(p.ovr>=72) headlines.push(`✍️ ${club.name} snap up free agent ${p.pos} ${p.name} (${p.ovr})`);
  });
  if(signed.size){
    G.freeAgents = G.freeAgents.filter(p=>!signed.has(p.id));
    headlines.slice(0,3).forEach(msg=>logNews(G,"transfer",msg, G.userTeamId));
  }
}
// Sign an out-of-contract free agent (no fee; wage only). Squad cap keeps it sane.
function signFreeAgent(G, p){
  const club = G.clubs[G.userTeamId];
  const squad = Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth);
  if(squad.length>=30) return { ok:false, msg:"Senior squad is full (30)." };
  G.freeAgents = (G.freeAgents||[]).filter(x=>x.id!==p.id);
  logMove(G, p, "free", null, club.id, null);
  p.teamId = club.id; p.years = rint(1,3); p.salary = wageFor(p);
  G.players[p.id] = p;
  autoPickXI(club, G.players);
  logNews(G,"sign",`✍️ Signed free agent ${p.pos} ${p.name} (${p.ovr})`, club.id);
  return { ok:true };
}
function wageBill(G, clubId){
  return round(Object.values(G.players).filter(p=>p.teamId===clubId).reduce((s,p)=>s+(p.salary||0),0)*10)/10;
}

/* ----------------------------- loans ----------------------------------- */
// A loaned player plays for (and develops at) the destination club this season, then returns to
// his owner at the rollover. p.loanOwner = the club he belongs to; p.teamId = where he's playing now.
function isLoaned(p){ return p && p.loanOwner!=null; }
function loanOut(G, p, toClubId){
  if(!transferWindowOpen(G)) return { ok:false, msg:"Loans only happen in the transfer window." };
  if(p.teamId!==G.userTeamId || isLoaned(p)) return { ok:false, msg:"Can't loan that player out." };
  const to = G.clubs[toClubId]; if(!to || to.id===G.userTeamId) return { ok:false, msg:"No club to loan to." };
  if(p.youth) return { ok:false, msg:"Promote him to the senior squad before loaning him out." };
  if(Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth).length<=16) return { ok:false, msg:"Senior squad too thin to loan anyone out." };
  // loan runs through the current season (in-season) or the whole upcoming one
  // (if arranged in the offseason) — returnLoans only sends him back once it's up
  logMove(G, p, "loan", G.userTeamId, to.id, null);
  p.loanOwner = G.userTeamId; p.loanUntil = (G.phase==="offseason") ? G.season+1 : G.season; p.teamId = to.id;
  autoPickXI(G.clubs[G.userTeamId], G.players); autoPickXI(to, G.players);
  logNews(G,"loan",`📤 Loaned ${p.pos} ${p.name} (${p.ovr}) to ${to.name} for the season`, G.userTeamId);
  return { ok:true };
}
// pick a sensible destination — a weaker club that will actually play him
function loanOutAuto(G, p){
  const cands = G.clubs.filter(c=>c.id!==G.userTeamId && Object.values(G.players).filter(x=>x.teamId===c.id && !x.youth).length<30);
  if(!cands.length) return { ok:false, msg:"No club available to take him." };
  cands.sort((a,b)=>clubStrength(a,G.players)-clubStrength(b,G.players));
  const to = cands[rint(0, Math.min(7, cands.length-1))];
  return loanOut(G, p, to.id);
}
function loanIn(G, p){
  if(!transferWindowOpen(G)) return { ok:false, msg:"Loans only happen in the transfer window." };
  if(p.teamId==null || p.teamId===G.userTeamId || isLoaned(p)) return { ok:false, msg:"Can't loan that player in." };
  if(Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth).length>=30) return { ok:false, msg:"Senior squad is full (30)." };
  const from = G.clubs[p.teamId];
  logMove(G, p, "loan", p.teamId, G.userTeamId, null);
  p.loanOwner = p.teamId; p.loanUntil = (G.phase==="offseason") ? G.season+1 : G.season; p.teamId = G.userTeamId;
  autoPickXI(G.clubs[G.userTeamId], G.players); if(from) autoPickXI(from, G.players);
  logNews(G,"loan",`📥 Loaned in ${p.pos} ${p.name} (${p.ovr}) from ${from?from.name:"?"} for the season`, G.userTeamId);
  return { ok:true };
}
// Return all loanees to their owners (run at the rollover, before develop/contracts).
function returnLoans(G){
  Object.values(G.players).forEach(p=>{
    if(p.loanOwner==null) return;
    // only send him back once the loan term is up (offseason loans run a full season)
    if(p.loanUntil!=null && p.loanUntil > G.season) return;
    const ownerId = p.loanOwner, loanClub = p.teamId!=null?G.clubs[p.teamId]:null, involvedUser = (p.teamId===G.userTeamId || ownerId===G.userTeamId);
    // remember where he actually played this season so the rollover archives the
    // season under the loan club (marked as a loan), not the parent club
    if(p.teamId!=null && p.teamId!==ownerId) p._loanArchiveTeam = p.teamId;
    // drop him from the loan club's lineup so they don't keep a ghost in the XI
    if(loanClub){ loanClub.xi=(loanClub.xi||[]).filter(id=>id!==p.id); loanClub.bench=(loanClub.bench||[]).filter(id=>id!==p.id); }
    if(G.clubs[ownerId]){ if(p.teamId!==ownerId) logMove(G, p, "loanret", p.teamId, ownerId, null); p.teamId = ownerId; if(involvedUser) logNews(G,"loan",`🔙 ${p.pos} ${p.name} returns from loan to ${G.clubs[ownerId].name}`, ownerId); }
    else { p.teamId = null; G.freeAgents=G.freeAgents||[]; if(!G.freeAgents.some(x=>x.id===p.id)) G.freeAgents.push(p); }   // owning club gone → free agent
    p.loanOwner = null; p.loanUntil = null;
  });
}

/* ----------------------------- owner ----------------------------------- */
function setOwnerExpectation(G){
  const c = G.clubs[G.userTeamId];
  if(c.div>=1){ G.expectation = { text:"Win promotion to the "+divName(c.country||0,c.div-1), target:"promo" }; }
  else {
    const last = (c.history||[]).slice(-1)[0];
    const lastPos = last ? last.pos : 12;
    if(lastPos<=4) G.expectation = { text:"Challenge for the title (top 3)", target:"top3" };
    else if(lastPos<=10) G.expectation = { text:"Finish in the top half", target:"top10" };
    else G.expectation = { text:"Avoid relegation", target:"safe" };
  }
  // Fuller board brief: the league goal plus a cup goal, a Champions Cup goal
  // (if in it), and a financial goal. Evaluated at season end (evaluateBoardSeasonEnd).
  const obj = [{ kind:"league", text:G.expectation.text }];
  const cupTarget = c.div===0 ? "QF" : "R16";
  obj.push({ kind:"cup", text:`Reach the ${cupName(c.country||0)} ${cupTarget==="QF"?"quarter-finals":"round of 16"}`, target:cupTarget });
  const inCC = G.contCup && (G.contCup.qualifiers||[]).includes(c.id);
  if(inCC) obj.push({ kind:"cont", text:`Get out of the ${CONT_CUP_NAME} group`, target:"ko" });
  obj.push({ kind:"finance", text:"Keep the club's finances in the black" });
  G.objectives = obj;
}

/* ----------------------------- job security ---------------------------- */
// Board confidence (0-100) reacts to match results during the season and to
// whether the club meets its owner's expectation. Bottom out → sacked, with
// job offers to continue a career elsewhere. All gated by settings.jobSecurity.
function jobSecurityOn(G){ return !G.settings || G.settings.jobSecurity!==false; }
function expTargetPos(G){
  const t=(G.expectation||{}).target;
  if(t==="promo"||t==="top3") return 3;
  if(t==="top10") return 10;
  return 17;   // "safe" — anything above the drop zone
}
function confLabel(c){ return c>=80?"Secure":c>=60?"Backed":c>=40?"Watching":c>=20?"Under pressure":"On the brink"; }
function bumpConfidenceForResult(G, win, draw, mult=1){
  // fan mood tracks results too (a livelier, more forgiving swing than the board)
  G.fanConfidence = clamp((G.fanConfidence==null?65:G.fanConfidence) + (win?1.6: draw?-0.2: -1.4)*mult, 0, 100);
  if(!jobSecurityOn(G)) return;
  if(G.boardConfidence==null) G.boardConfidence=60;
  G.boardConfidence = clamp(G.boardConfidence + (win?4: draw?0.5: -4)*mult, 0, 100);
}
function fanLabel(c){ return c>=80?"Euphoric":c>=62?"Happy":c>=42?"Restless":c>=22?"Unhappy":"Furious"; }
// Nudge the fan mood (used on signings, sales, trophies, ticket pricing).
function bumpFans(G, delta, reason){
  G.fanConfidence = clamp((G.fanConfidence==null?65:G.fanConfidence) + delta, 0, 100);
  if(reason) logNews(G,"fans",`${delta>=0?"😀":"😠"} ${reason}`, G.userTeamId);
}
// Pick clubs that would hire the user right now (a sacking) or come calling
// (a poaching approach when overperforming). Returns up to 3 offers.
function generateJobOffers(G, kind){
  const cur = G.clubs[G.userTeamId];
  const curStr = clubStrength(cur, G.players);
  let pool = G.clubs.filter(c=>c.id!==G.userTeamId && !c.userControlled);
  if(kind==="approach"){
    // bigger / stronger clubs poaching an overperformer
    pool = pool.filter(c=>clubStrength(c,G.players) > curStr+3).sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players));
  } else {
    // after a sacking: clubs roughly at or below the user's level, vacancy-style
    pool = pool.filter(c=>clubStrength(c,G.players) <= curStr+4).sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players));
    if(pool.length<3) pool = G.clubs.filter(c=>c.id!==G.userTeamId && !c.userControlled).sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players));
  }
  return pool.slice(0,3).map(c=>({ id:c.id, name:c.name, div:c.div, country:c.country||0, str:clubStrength(c,G.players), kind }));
}
// Unhappy players agitate to leave; a settled one withdraws. Gated by morale setting.
// A good player left out of the XI grows restless ("play me or sell me").
function processTransferRequests(G){
  if(!G.settings || G.settings.morale===false) return;
  if(G.day<6) return;   // give the season a few games before anyone agitates
  const user = G.clubs[G.userTeamId];
  const inXI = new Set(user.xi||[]);
  Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth).forEach(p=>{
    const benchedStar = p.ovr>=70 && !inXI.has(p.id) && !isInjured(p);
    if(benchedStar){ p.morale = clamp((p.morale==null?60:p.morale)-2, 0, 100); }   // wants first-team football
    if(p.wantsOut){
      p.morale = clamp((p.morale==null?60:p.morale)-1, 0, 100);   // unrest festers until resolved
      if((p.morale||60) >= 60){ p.wantsOut=false; logNews(G,"morale",`🙂 ${p.name} has settled and withdrawn his transfer request.`, user.id); }
    } else if(((p.morale==null?60:p.morale) < 32 || (benchedStar && (p.morale||60)<45)) && p.ovr>=64 && chance(0.07)){
      p.wantsOut=true; logNews(G,"morale",`📨 ${p.name} has handed in a transfer request — sell him or win him back with game time.`, user.id);
    }
  });
}
function takeJob(G, clubId){
  const old=G.clubs[G.userTeamId]; if(old) old.userControlled=false;
  G.userTeamId=clubId;
  const nc=G.clubs[clubId]; nc.userControlled=true;
  G.boardConfidence=58; G.pendingSack=false; G.jobOffers=null; G.lastMatch=null; G.lastMatches=[];
  setOwnerExpectation(G);
  logNews(G,"job",`📝 Appointed manager of ${nc.name}`, clubId);
  ensureCareer(G);
  const cur=G.career.clubsManaged[G.career.clubsManaged.length-1];
  if(cur && cur.to==null) cur.to=G.season;
  G.career.clubsManaged.push({ id:clubId, name:nc.name, abbr:nc.abbr, from:G.season, to:null });
}

/* ----------------------------- manager career / legacy ------------------ */
// Tracks the human manager's WHOLE career, independent of which club they're
// currently at — survives job changes via takeJob. Trophies are derived (not
// counted live) by scanning each managed club's honours within the season
// range the user was actually in charge there, so nothing can drift out of sync.
function ensureCareer(G){
  if(!G.career){
    const c=G.clubs[G.userTeamId];
    G.career={ seasonsManaged:0, transferSpend:0, transferIncome:0, academyGraduates:0,
      clubsManaged: c ? [{ id:c.id, name:c.name, abbr:c.abbr, from:G.season, to:null }] : [] };
  }
  if(!Array.isArray(G.career.clubsManaged)) G.career.clubsManaged=[];
}
function careerTrophies(G){
  ensureCareer(G);
  let trophies=[];
  G.career.clubsManaged.forEach(span=>{
    const club=G.clubs[span.id]; if(!club) return;
    (club.honours||[]).forEach(h=>{ if(h.season>=span.from && (span.to==null||h.season<=span.to)) trophies.push({...h, club:club.abbr}); });
  });
  return trophies;
}

/* ----------------------------- news ------------------------------------ */
function logNews(G, type, msg, teamId){
  if(!G) return;
  if(!Array.isArray(G.news)) G.news=[];
  G.news.unshift({ season:G.season, day:(G.day||0)+1, phase:G.phase, type, msg, teamId: teamId==null?null:teamId });
  if(G.news.length>250) G.news.length=250;
}

// Big save blobs live in IndexedDB (quota is hundreds of MB to GBs, vs the ~5MB
// localStorage cap that broke long saves). Only the tiny slot INDEX (names,
// seasons) stays in localStorage so the menu can list saves synchronously.
const IDB_NAME="pgsoccer_db", IDB_STORE="saves";

function idb(){

    try{
      if(!window.indexedDB){ rej(new Error("no idb")); return; }

      req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };

}

async function saveGame(G){
  try{
    if(!G.slotId) G.slotId = "s" + Date.now() + Math.floor(Math.random()*999);
    let ok=false;
    try{
      // Store the raw object — IndexedDB structured-clones it, which is far
      // faster than JSON+LZ-compressing a 640-club world (~25s vs well under 1s).
      await idbSet(slotKey(G.slotId), G); ok=true;
      try{ localStorage.removeItem(slotKey(G.slotId)); }catch(e){}   // reclaim any legacy localStorage copy
    }catch(idbErr){

      try{ localStorage.setItem(slotKey(G.slotId), encodeSave(G)); ok=true; }catch(e2){ ok=false; }
    }
    updateSlotIndex(G);
    return ok;
  }catch(e){ return false; }
}
async function loadSlot(id){
  try{

    if(raw==null){ try{ raw = localStorage.getItem(slotKey(id)); }catch(e){} }   // legacy fallback
    if(raw==null) return null;
    // new saves are stored as raw objects; older ones as (possibly compressed) strings
    const g = (typeof raw === "object") ? raw : decodeSave(raw);
    return g?migrate(g):null;
  }catch(e){ return null; }
}

// One-time world expansion for saves from the 4-country / 2-division era
// (160 clubs). Old club id -> new id keeps every club, its squad, honours and
// history; two new divisions per country and four whole new countries are
// generated around them. A season in progress is restarted under the new
// structure (fixtures/cups for a 160-club world can't continue in a 640-club one).
function expandWorld(G){
  if(!Array.isArray(G.clubs) || G.clubs.length!==160) return;
  const OLD_PER = 40;
  const mapId = id => id==null ? id : Math.floor(id/OLD_PER)*CLUBS_PER_COUNTRY + (id%OLD_PER);
  const wasRegular = G.phase==="regular";
  // re-home the existing 160 clubs at their new ids, then generate the rest
  const clubs = new Array(ALL_CLUB_DEFS.length);
  G.clubs.forEach(c=>{ const nid=mapId(c.id); c.id=nid; if(c.rivalId!=null) c.rivalId=mapId(c.rivalId); clubs[nid]=c; });
  const newIds=[];
  for(let id=0; id<clubs.length; id++){
    if(clubs[id]) continue;
    clubs[id] = makeClub(ALL_CLUB_DEFS[id], id, divOfIdx(id), countryOfIdx(id));
    newIds.push(id);
  }
  G.clubs = clubs;
  // remap every stored club reference
  Object.values(G.players||{}).forEach(p=>{ p.teamId=mapId(p.teamId); if(p.loanOwner!=null) p.loanOwner=mapId(p.loanOwner); if(p.sellOn&&p.sellOn.toClubId!=null) p.sellOn.toClubId=mapId(p.sellOn.toClubId); });
  (G.freeAgents||[]).forEach(p=>{ if(p.sellOn&&p.sellOn.toClubId!=null) p.sellOn.toClubId=mapId(p.sellOn.toClubId); });
  G.userTeamId = mapId(G.userTeamId);
  ["champions","contChampions","cupChampions","trebles","doubles"].forEach(k=>(G[k]||[]).forEach(e=>{ if(e && e.id!=null) e.id=mapId(e.id); }));
  if(G.career && Array.isArray(G.career.clubsManaged)) G.career.clubsManaged.forEach(s=>{ s.id=mapId(s.id); });
  if(G.h2h){ const nh={}; for(const k in G.h2h){ const [a,b]=k.split("-").map(Number); nh[mapId(a)+"-"+mapId(b)]=G.h2h[k]; } G.h2h=nh; }
  G.transferOffers = [];
  // squads for the ~480 new clubs
  newIds.forEach(id=>{ buildSquad(id, clubs[id].div).forEach(p=>{ G.players[p.id]=p; }); });
  assignRivals(clubs.filter(c=>c.rivalId==null));   // pair rivals in the new leagues only
  // restart the season under the expanded world
  if(wasRegular){
    Object.values(G.players).forEach(p=>{ p.stats=emptyStats(); p.compStats={}; });
    G.clubs.forEach(c=>{ c.pld=0;c.w=0;c.d=0;c.l=0;c.gf=0;c.ga=0;c.pts=0; c.seasonGate=0;c.seasonConcession=0;c.gateLog=[]; });
    G.day = 0;
  }
  G.cups=null; G.contCup=null; G.intlCycle=null;
  buildCalendar(G);
  withTeamIndex(G.players, ()=>{
    initContCup(G);
    initCups(G);
    G.clubs.forEach(c=>autoPickXI(c, G.players));
  });
  G.lastMatch=null; G.lastMatches=[];
  setOwnerExpectation(G);
  logNews(G,"news",`🌍 The football world has EXPANDED — 8 nations, 4 divisions each, 640 clubs!${wasRegular?" The current season restarts under the new structure.":""}`, G.userTeamId);
}

    G.clubs.forEach(c=>{ if(!c.formation) c.formation="4-3-3"; if(!c.tactic) c.tactic="balanced"; if(!c.academy) c.academy={level:1}; if(!Array.isArray(c.honours)) c.honours=[]; ensureStands(c); c.capacity=stadiumCapacity(c); ensureCommercials(G,c); if(!c.setPieces) c.setPieces={pen:null,fk:null,corner:null}; if(c.ticketTier==null) c.ticketTier=1; if(c.concessionTier==null) c.concessionTier=1; if(c.seasonGate==null) c.seasonGate=0; if(c.seasonConcession==null) c.seasonConcession=0; if(!Array.isArray(c.gateLog)) c.gateLog=[]; if(c.autoRotate==null) c.autoRotate=false; if(!c.instr) c.instr={press:"mid",tempo:"normal",width:"normal"}; if(c.formFam==null) c.formFam=100; if(c.formFamOf==null) c.formFamOf=c.formation; if(c.storeTier==null) c.storeTier=0; if(c.seasonTicketPct==null) c.seasonTicketPct=0; if(c.trainTier==null) c.trainTier=0; if(c.scoutTier==null) c.scoutTier=0; if(c.pitchTier==null) c.pitchTier=0; if(c.boxes==null) c.boxes=0; if(c.seasonBoxes==null) c.seasonBoxes=0; if(!c.coaches) c.coaches={att:0,def:0,gk:0,fit:0}; ensureXI(c, G.players); });
    if(!G.clubs.some(c=>c.rivalId!=null)) assignRivals(G.clubs);
    if(!G.expectation) setOwnerExpectation(G);
    // history/records + feature-toggle backfill
    if(!Array.isArray(G.finalsArchive)) G.finalsArchive = [];
    if(!G.records || typeof G.records!=="object") G.records = { players:{}, biggestWin:null };
    if(!G.records.players) G.records.players = {};
    G.settings = G.settings || {};
    const defs = { injuries:true, jobSecurity:true, morale:true, internationals:true, watchMatches:false };
    for(const k in defs){ if(G.settings[k]==null) G.settings[k]=defs[k]; }
    if(G.boardConfidence==null) G.boardConfidence=60;
    if(G.fanConfidence==null) G.fanConfidence=65;
    if(G.pendingSack==null) G.pendingSack=false;
    if(!G.intl || typeof G.intl!=="object") G.intl={ history:[], lastPlayed:null };
    if(!Array.isArray(G.intl.history)) G.intl.history=[];
    if(!Array.isArray(G.trebles)) G.trebles=[];
    if(!Array.isArray(G.doubles)) G.doubles=[];
    if(G.intlCycle===undefined) G.intlCycle=null;
    if(!G.retired || typeof G.retired!=="object") G.retired={};
    // slim + cap the retired archive (older saves stored full live-player state
    // here, which bloated the file; history/careerComp are kept for the profile)
    for(const id in G.retired){ const r=G.retired[id]; if(r && (r.stats||r.compStats)) G.retired[id]=slimRetired(r); }
    capRetired(G);
    ensureCareer(G);
    backfillHonours(G);
    backfillDoubles(G);
    // HOF entries predating the snapshot feature: copy history/comp splits from
    // the live player or retired archive while they still exist (idempotent)
    (G.hof||[]).forEach(h=>{
      if(Array.isArray(h.hist) && h.hist.length) return;
      const src = (G.players||{})[h.id] || (G.retired||{})[h.id];
      if(!src) return;
      if(Array.isArray(src.history) && src.history.length) h.hist = src.history.slice(-22);
      if(src.careerComp && !h.cc) h.cc = src.careerComp;
      if(h.nat==null && src.nat!=null) h.nat = src.nat;
    });
    // one-time: reconstruct the national-cup roll of honour from club honours
    if(!Array.isArray(G.cupChampions)){
      G.cupChampions = [];
      G.clubs.forEach(c=>(c.honours||[]).forEach(h=>{ if(h.type==="cup") G.cupChampions.push({ season:h.season, id:c.id, abbr:c.abbr, country:c.country||0 }); }));
      G.cupChampions.sort((a,b)=>b.season-a.season);
    }
    // one-time: seed the derby head-to-head from this season's already-played
    // league games (recorded live from here on; guard prevents double counting)
    if(!G.h2h){
      G.h2h = {};
      (G.schedule||[]).forEach(rd=>rd.forEach(g=>{
        if(!g.played) return;
        const h=G.clubs[g.home], a=G.clubs[g.away];
        if(h && a && h.rivalId===a.id) recordH2H(G, h, a, g.hs, g.as, "L");
      }));
    }
    // Backfill newer all-time-leader fields (saves, caps, int'l goals, Ballon d'Ors,
    // Golden Boots, blocks, aerials) onto existing record snapshots from the player's
    // preserved career data — live players, the retired archive, or HOF snapshots —
    // so the new leaderboards fill in retroactively for anyone we still have data on.
    {
      const pool = (G.records&&G.records.players)||{};
      Object.keys(pool).forEach(id=>{
        const rec = pool[id]; if(!rec || rec._fill2) return;
        const src = (G.players||{})[id] || (G.retired||{})[id];
        const ca = (src&&src.career)||{};
        const set = (k, v) => { if(rec[k]==null || rec[k]===0) rec[k] = v||0; };
        if(src){
          set("Sv", ca.Sv); set("CS", ca.CS); set("Blk", ca.Blk); set("Aer", ca.Aer);
          set("MOTM", ca.MOTM); set("Tkl", ca.Tkl); set("Int", ca.Int); set("Clr", ca.Clr); set("PrgP", ca.PrgP);
          set("caps", src.caps); set("intlG", src.intlG); set("ballonDor", src.ballonDor); set("golden", src.golden);
          if(!rec.peak) rec.peak = src.peakOvr||src.ovr||rec.peak||0;
        }
        // make sure every leaderboard key is a number so sorts never NaN
        ["G","A","App","CS","MOTM","Sv","Tkl","Int","Clr","Blk","Aer","PrgP","caps","intlG","ballonDor","golden"].forEach(k=>{ if(rec[k]==null) rec[k]=0; });
        rec._fill2 = true;
      });
    }
    // one-time: reconstruct the manager's season log from the clubs he managed
    if(G.career && !Array.isArray(G.career.seasons)){
      G.career.seasons = [];
      (G.career.clubsManaged||[]).forEach(span=>{
        const c = G.clubs[span.id]; if(!c) return;
        (c.history||[]).forEach(hh=>{
          if(hh.season>=span.from && (span.to==null || hh.season<span.to)){
            G.career.seasons.push({ season:hh.season, club:c.abbr, name:c.name, country:c.country||0, div:hh.div, pos:hh.pos, pts:hh.pts, w:hh.w, d:hh.d, l:hh.l,
              cup:hh.cup?hh.cup.round:null, cont:hh.cont?hh.cont.round:null,
              trophies:(c.honours||[]).filter(x=>x.season===hh.season && ["league","cup","continental"].includes(x.type)).length });
          }
        });
      });
      G.career.seasons.sort((a,b)=>b.season-a.season);
    }
    G.version = SAVE_VERSION;
  }catch(e){}
  return G;
}
function exportSave(G){
  try{
    const blob = new Blob([JSON.stringify(G)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const u = G.clubs[G.userTeamId];
    a.href=url; a.download=`pocketgm-soccer-${u?u.abbr:"save"}-${G.season}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000); return true;
  }catch(e){ return false; }
}
function importSave(file, onLoad){
  const r = new FileReader();
  r.onload = e=>{ try{ const g=migrate(JSON.parse(e.target.result)); if(g&&Array.isArray(g.clubs)) onLoad(g); else alert("Not a valid Pocket GM Soccer save."); }catch(err){ alert("Couldn't read that save file."); } };
  r.readAsText(file);
}

/* ----------------------------- new game -------------------------------- */
function newGame(userTeamId, opts={}){
  const { clubs, players } = generateLeague(userTeamId, opts);
  const G = {
    season: 2026, day: 0, phase: "regular", version: SAVE_VERSION,
    seed: (opts && opts.seed!=null && !Number.isNaN(opts.seed)) ? (opts.seed>>>0) : null,
    userTeamId, clubs, players,
    schedule: [],
    freeAgents: [], transferOffers: [], news: [], champions: [], contChampions: [], awardHistory: [], hof: [],
    cups: null, contCup: null, lastMatch: null, lastMatches: [],
    finalsArchive: [], records: { players:{}, biggestWin:null }, trebles: [], doubles: [],
    intl: { history:[], lastPlayed:null },
    boardConfidence: 60, fanConfidence: 65, pendingSack: false, jobOffers: null,
    career: { seasonsManaged:0, transferSpend:0, transferIncome:0, academyGraduates:0,
      clubsManaged: [{ id:userTeamId, name:clubs[userTeamId].name, abbr:clubs[userTeamId].abbr, from:2026, to:null }] },
    settings: { injuries:true, jobSecurity:true, morale:true, internationals:true, watchMatches:false },
  };
  buildCalendar(G);   // spread league / cup / continental onto their own matchdays
  // seed a free-agent pool sized for a bigger world
  for(let i=0;i<200;i++){ const p=makePlayer(pick(ALL_POS),[20,33],-4); p.teamId=null; G.freeAgents.push(p); }
  initCups(G);
  initContCup(G);
  setOwnerExpectation(G);
  return G;
}

/* ----------------------------- shared bits ----------------------------- */
function Badge({children}){ return <span className="px-2 py-1 rounded bg-[#16213a] text-slate-200 tnum text-xs">{children}</span>; }
// Deterministic club colours + a tiny crest, so every club has a visual identity.
// Derived from the club id (stable), or from club.colors if the user ever sets one.
const CLUB_PALETTE = [
  ["#e63946","#f1faee"],["#1d3557","#a8dadc"],["#2a9d8f","#e9c46a"],["#e76f51","#264653"],
  ["#6a4c93","#ffca3a"],["#118ab2","#ffd166"],["#ef476f","#073b4c"],["#06d6a0","#073b4c"],
  ["#ff7b00","#03071e"],["#c1121f","#fdf0d5"],["#4361ee","#f72585"],["#3a0ca3","#4cc9f0"],
  ["#780000","#c1121f"],["#008000","#ffffff"],["#14213d","#fca311"],["#5f0f40","#fb8b24"],
  ["#0b525b","#9df9ef"],["#7f5539","#ddb892"],["#22223b","#c9ada7"],["#1a535c","#ff6b6b"],
];
function clubColors(c){
  if(c && c.colors && c.colors[0]) return c.colors;
  const id = (c && c.id!=null) ? c.id : 0;
  // mix id + a second hash so same-index clubs across countries differ
  const primary = CLUB_PALETTE[id % CLUB_PALETTE.length];
  return primary;
}
function Crest({club, size=16}){
  const [a,b] = clubColors(club);
  const s = size+"px";
  return <span title={club?club.name:""} style={{width:s,height:s,background:a,borderColor:b}}
    className="inline-block rounded-full border-2 align-middle shrink-0" />;
}
// Last-5 league form as coloured dots (oldest → newest).
function FormDots({form}){
  const f = (form||[]).slice(-5);
  if(!f.length) return <span className="text-slate-600 text-xs">—</span>;
  return <span className="inline-flex gap-0.5">{f.map((r,i)=>(
    <span key={i} title={r} className={"inline-block w-2 h-2 rounded-full "+(r==="W"?"bg-emerald-500":r==="L"?"bg-red-500":"bg-slate-500")} />
  ))}</span>;
}
function Card({children, className="", onClick}){ return <div onClick={onClick} className={"bg-[#101a30] border border-[#1d2940] rounded-xl p-4 "+className}>{children}</div>; }
function OvrPill({v}){
  const c = v>=80?"bg-emerald-500 text-slate-900":v>=70?"bg-lime-500 text-slate-900":v>=60?"bg-yellow-500 text-slate-900":v>=50?"bg-orange-500 text-slate-900":"bg-slate-600 text-slate-100";
  return <span className={"inline-block w-8 text-center rounded font-bold text-xs py-0.5 "+c}>{v}</span>;
}
function PotPill({v}){ return <span className="inline-block w-8 text-center rounded font-semibold text-xs py-0.5 border border-amber-500/50 text-amber-300/90" title="Potential">{v}</span>; }
// ---- Scouting fog: unproven players (youth, low pro experience) show a SCOUTED rating that can be
// off and converges to the truth as they rack up appearances. Deterministic per id; AI/sim use TRUE.
function scoutApps(p){ return ((p.career&&p.career.App)||0) + ((p.stats&&p.stats.App)||0); }
function scoutConf(p){ if(!p) return 1; let c=clamp(scoutApps(p)/55, 0, 1); if(p.youth) c=Math.min(c,0.30); c=clamp(c+(p.age-17)*0.025, 0, 1); return clamp(Math.max(c, SCOUT_FLOOR), 0, 1); }   // Scouting Network raises the floor
function scoutBias(p){ return (mulberry32((p.id>>>0)||1)()*2-1)*8; }
function scoutedOvr(p){ const c=scoutConf(p); return clamp(Math.round(p.ovr + scoutBias(p)*(1-c)), 20, 99); }
function scoutedPot(p){ const c=scoutConf(p); return clamp(Math.round(p.pot + scoutBias(p)*(1-c)*1.1), 20, 99); }
function ScoutOvrPill({p}){ const c=scoutConf(p); if(c>=0.85) return <OvrPill v={p.ovr} />;
  return <span className="inline-flex items-center" title={`Scouted ~${Math.round(c*100)}% — firms up with appearances`}><OvrPill v={scoutedOvr(p)} /><span className="text-slate-500 text-[9px] ml-0.5">~</span></span>; }
function ScoutPotPill({p}){ const c=scoutConf(p); if(c>=0.85) return <PotPill v={p.pot} />;
  return <span className="inline-flex items-center" title={`Scouted ceiling ~${Math.round(c*100)}%`}><PotPill v={scoutedPot(p)} /><span className="text-amber-500/60 text-[9px] ml-0.5">~</span></span>; }
function PName({p, className=""}){
  const open = React.useContext(PlayerCtx);
  return <button onClick={()=>open&&open(p)} className={"text-left hover:text-emerald-300 "+className}>{p.name}</button>;
}
function PosTag({p}){
  return <span className="text-xs text-slate-400">
    <span className="text-slate-200 font-semibold">{p.pos}</span>
    {p.positions && p.positions.length>1 && <span className="text-slate-500"> · {p.positions.slice(1).join(",")}</span>}

}

function Splash({onStart, onBack}){
