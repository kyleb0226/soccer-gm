// "Simulate N years" — fast-forwards the whole world so you can see how things
// shake out. Runs one season per tick (yielding between so the progress bar
// paints), and mutes sacking for the duration so the run always completes;
// the job-security setting is restored afterward.
// Pick how many seasons to fast-forward, then Go. During the sim the user's club
// is put under FULL auto-management (re-signs, free agents, transfers, youth
// promotion, best XI) so a hands-off club keeps up and can climb divisions,
// instead of rotting. Runs in matchday-sized chunks via a MessageChannel so the
// tab stays responsive and the progress bar updates smoothly.
function SimYears({G, commit, tShow}){
  const [years, setYears] = useState(10);
  const [run, setRun] = useState(null);   // {done,total,md,mdTotal,season,stopping} while running
  const stopRef = React.useRef(false);
  const busyRef = React.useRef(false);    // guard against double-start / re-entrancy
  const go = () => {
    if(run || busyRef.current) return;
    const total = clamp(parseInt(years,10)||1, 1, 100);
    stopRef.current = false; busyRef.current = true;
    beginAutoManage(G);
    let done = 0;
    const snap = () => ({ done, total, md:G.phase==="regular"?G.day+1:0, mdTotal:G.schedule.length, season:G.season, stopping:stopRef.current });
    setRun(snap());
    const ch = new MessageChannel();
    const finish = (err) => {
      endAutoManage(G);     // ALWAYS restore manual control + settings first
      busyRef.current = false;
      commit(G);
      setRun(null);
      tShow(err ? ("Sim stopped: "+err) : `Auto-simulated ${done} season${done!==1?"s":""} → now ${G.season}`);
    };
    ch.port1.onmessage = () => {
      try {
        // advance ~10 matchdays, or roll the season over, then yield to paint
        let steps = 0, rolled = false;
        while(steps < 10){
          if(G.phase==="regular"){ simRound(G); steps++; }
          else { autoSimSeason(G); done++; rolled = true; break; }   // finishes the season + rolls over
        }
        // Stop always lands at a CLEAN season boundary — never mid-season — so the
        // user resumes at the start of a fresh season, not stranded mid-campaign.
        const stopNow = stopRef.current && rolled;
        if(done >= total || stopNow){ finish(); }
        else { setRun(snap()); ch.port2.postMessage(1); }
      } catch(e){ finish(String(e&&e.message||e)); }
    };
    ch.port2.postMessage(1);
  };
  // if this component unmounts mid-sim, make sure control is restored
  React.useEffect(()=>()=>{ stopRef.current = true; if(busyRef.current){ endAutoManage(G); busyRef.current=false; } }, []);
  return (
    <>
      <div className="flex items-center gap-1">
        <input type="number" min="1" max="100" value={years} disabled={!!run}
          onChange={e=>setYears(e.target.value)}
          className="w-14 bg-[#16213a] rounded-lg px-2 py-2 text-sm text-center tnum disabled:opacity-50" title="Number of seasons to auto-simulate" />
        <button onClick={go} disabled={!!run} className={"px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap "+(run?"bg-[#16213a] text-slate-500":"bg-indigo-500/90 text-white")} title="Fast-forward, with your club fully auto-managed">
          {run ? "Simulating…" : "⏩ Auto-sim seasons"}
        </button>
      </div>
      {run && (
        <div className="fixed inset-0 bg-black/70 z-[60] flex items-center justify-center p-4">
          <div className="bg-[#101a30] border border-[#1d2940] rounded-xl p-6 w-full max-w-sm text-center">
            <div className="text-lg font-bold mb-1">{run.stopping?"⏹ Finishing the season…":"⏩ Auto-simulating"}</div>
            <div className="text-sm text-slate-400 mb-1">Season {run.done+ (run.md>0?1:0)} of {run.total} · {G.season}{run.md>0?` · matchday ${run.md}/${run.mdTotal}`:""}</div>
            <div className="h-2 rounded bg-[#0d1526] overflow-hidden my-3"><div className={"h-full transition-all "+(run.stopping?"bg-amber-500":"bg-indigo-500")} style={{width:Math.round((run.done + (run.mdTotal?run.md/run.mdTotal:0))/run.total*100)+"%"}}></div></div>
            <div className="text-xs text-slate-500 mb-4">{run.stopping
              ? "Wrapping up the current season, then handing control back to you…"
              : "Your club is auto-managed — re-signing players, promoting youth, making transfers and picking its best XI to compete."}</div>
            <button onClick={()=>{ stopRef.current = true; setRun(r=>r?{...r,stopping:true}:r); }} disabled={run.stopping}
              className={"px-4 py-2 rounded-lg text-sm font-semibold "+(run.stopping?"bg-[#16213a] text-slate-500":"bg-[#16213a] hover:bg-[#1c2c4a] text-slate-200")}>
              {run.stopping?"Finishing this season…":"■ Finish season & stop"}
            </button>
          </div>
        </div>
      )}
    </>
  );
}

            {!(G.news||[]).length && <div className="text-slate-500">No news yet.</div>}
          </div>
        </Card>
      </div>
    </div>
  );
}
const ordinal = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const gd = c => c.gf - c.ga;
function MiniTable({G, rows, highlight}){

/* ----------------------------- squad ----------------------------------- */
function Squad({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  const [sort, setSort] = useState("ovr");
  const [renewP, setRenewP] = useState(null);
  // Senior squad only — academy players live in the Youth tab.
  let squad = Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth);
  squad.sort((a,b)=> sort==="ovr"? b.ovr-a.ovr : sort==="pos"? BAND[a.pos]-BAND[b.pos]||b.ovr-a.ovr : sort==="age"? a.age-b.age : b.value-a.value);
  const inXI = new Set(user.xi||[]);
  const release = p => {
    if(!confirm(`Release ${p.name}? They'll become a free agent.`)) return;
    releaseToFA(G, p);
    autoPickXI(user, G.players);
    logNews(G, "transfer", `❌ Released ${p.pos} ${p.name} (${p.ovr})`, user.id);
    commit(G); tShow(`${p.name} released`);
  };
  const sendDown = p => {
    if(p.age>21){ tShow("Only players aged 21 or under can drop to the academy."); return; }
    if(squad.length<=16){ tShow("Senior squad too thin to send anyone down."); return; }
    p.youth = true;
    autoPickXI(user, G.players);
    logNews(G, "youth", `🔽 ${p.name} (${p.pos} ${p.ovr}) sent down to the academy`, user.id);
    commit(G); tShow(`${p.name} sent to the academy`);
  };
  const toggleList = p => { p.listed = !p.listed; logNews(G,"transfer",p.listed?`🏷️ ${p.name} added to the transfer list`:`${p.name} taken off the transfer list`, user.id); commit(G); tShow(p.listed?`${p.name} listed for transfer`:`${p.name} unlisted`); };
  return (
    <div className="space-y-3">
      <Card>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="font-semibold">{user.name} — {squad.length} players</div>
          <div className="text-sm text-slate-400">Wage bill {money(wageBill(G,user.id))}/yr · Budget {money(user.budget)}</div>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-3 text-center text-xs">
          {[["App","apps",0],["G","goals",0],["A","assists",0],["CS","clean sh",0]].map(([k,l])=>{
            const tot=squad.reduce((s,p)=>s+(p.stats[k]||0),0);
            return <div key={k} className="bg-[#0d1526] rounded p-2"><div className="text-slate-400">{l}</div><div className="font-bold text-sm tnum">{tot}</div></div>;
          })}
        </div>
        <div className="flex gap-2 mt-2 text-xs">
          {[["ovr","Rating"],["pos","Position"],["age","Age"],["val","Value"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSort(k)} className={"px-2 py-1 rounded "+(sort===k?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l}</button>
          ))}
        </div>
      </Card>
      <Card className="p-0 overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]">
            <th className="text-left p-2">Player</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Pot</th>
            <th className="p-2">Age</th><th className="p-2">Wage</th><th className="p-2">Yrs</th><th className="p-2">Value</th><th className="p-2"></th><th className="p-2"></th><th className="p-2"></th><th className="p-2"></th>
          </tr></thead>
          <tbody>
            {squad.map(p=>(
              <tr key={p.id} className="border-b border-[#15203a]">
                <td className="p-2 text-left">
                  {inXI.has(p.id) && <span className="text-emerald-400 mr-1" title="In starting XI">●</span>}
                  <PName p={p} className="font-medium" />
                  {isInjured(p) && <span className="ml-1 text-red-400 text-xs" title={p.injury.type}>✚{p.injury.weeks}w</span>}
                  {isSuspended(p) && <span className="ml-1 text-orange-400 text-xs" title="Suspended">⛔{p.susp}</span>}
                  {p.youth && <span className="ml-1 text-amber-300 text-xs">YTH</span>}
                  {p.unhappy && p.years>0 && <span className="ml-1 text-orange-400 text-xs" title="Wants a new contract before it runs down">⚠</span>}
                  {(p.expiredSince!=null||p.expiredGrace) && p.years<=0 && <span className="ml-1 text-red-400 text-xs font-bold" title="Contract EXPIRED — re-sign him now or he leaves on a free next season">⏳ EXPIRED</span>}
                  {p.wantsOut && <span className="ml-1 text-xs" title="Has handed in a transfer request">✈️</span>}
                  {p.listed && !p.wantsOut && <span className="ml-1 text-xs" title="Transfer-listed">🏷️</span>}
                  {p.form!=null && p.form>=7.3 && <span className="ml-1 text-xs" title="In hot form">🔥</span>}
                  {p.form!=null && p.form<=6.0 && <span className="ml-1 text-xs" title="Off form">❄️</span>}
                  {p.morale!=null && p.morale<45 && <span className="ml-1 text-xs" title="Unhappy">😠</span>}
                  {p.fitness!=null && p.fitness<85 && !isInjured(p) && <span className={"ml-1 text-xs "+(p.fitness<55?"text-red-400":"text-yellow-400")} title="Match fitness — rest him to recover">{p.fitness}%</span>}
                </td>
                <td className="p-2 text-center"><PosTag p={p} /></td>
                <td className="p-2 text-center"><OvrPill v={p.ovr} /></td>
                <td className="p-2 text-center"><PotPill v={p.pot} /></td>

                <td className="p-2 text-center tnum">{money(p.value)}</td>
                <td className="p-2 text-center"><button onClick={()=>setRenewP(p)} className={"px-2 py-1 rounded text-xs font-semibold "+(p.years<=0?"bg-emerald-500 text-slate-900":p.unhappy?"bg-orange-500 text-slate-900":"bg-[#16213a] text-slate-300 hover:bg-[#1d2940]")}>{p.years<=0?"Re-sign":"Renew"}</button></td>
                <td className="p-2 text-center"><button onClick={()=>release(p)} className="px-2 py-1 rounded text-xs font-semibold bg-[#16213a] text-red-400 hover:bg-red-900/40">Release</button></td>
                <td className="p-2 text-center">{p.age<=21 && <button onClick={()=>sendDown(p)} className="px-2 py-1 rounded text-xs font-semibold bg-[#16213a] text-amber-300 hover:bg-[#1d2940]" title="Move to the academy to develop faster">↓ Youth</button>}</td>
                <td className="p-2 text-center"><button onClick={()=>toggleList(p)} className={"px-2 py-1 rounded text-xs font-semibold "+(p.listed?"bg-indigo-500 text-white":"bg-[#16213a] text-slate-300 hover:bg-[#1d2940]")} title="Transfer-list to invite bids">{p.listed?"Listed":"List"}</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
      {renewP && <RenewModal G={G} p={renewP} commit={commit} tShow={tShow} onClose={()=>setRenewP(null)} />}
    </div>
  );
}
// Contract negotiation: the player names a wage demand (ability + ambition + form);
// the user picks a term length. Longer deals carry a small per-year premium for security.
function RenewModal({G, p, commit, tShow, onClose}){
  const user = G.clubs[G.userTeamId];
  const demand = wageDemand(p);
  const termPremium = { 1:1.0, 2:1.0, 3:1.05, 4:1.10 };
  const [rel, setRel] = useState(p.release!=null ? String(p.release) : "");
  const sign = yrs => {
    p.salary = clamp(round(demand*termPremium[yrs]*10)/10, 0.2, 40);
    p.years = yrs; p.unhappy = false; p.expiredGrace = false; p.expiredSince = null;
    const rv = parseFloat(rel);
    p.release = (rel==="" || isNaN(rv)) ? null : round(Math.max(0,rv)*10)/10;
    commit(G); tShow(`${p.name} signed for ${yrs}y at ${money(p.salary)}/yr`); onClose();
  };
  const bill = wageBill(G, user.id);
  return (
    <div className="fixed inset-0 z-40 bg-black/60 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-2xl p-5 w-full max-w-md" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <div className="font-bold text-lg">{p.name}</div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-200">✕</button>
        </div>
        <div className="text-sm text-slate-400 mb-3">{p.pos} · {p.age}y · OVR {p.ovr} · Pot {p.pot}</div>
        <div className="grid grid-cols-2 gap-2 text-sm mb-4">
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Current wage</div><div className="font-semibold tnum">{money(p.salary)}/yr</div></div>
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Wage demand</div><div className="font-semibold tnum text-amber-300">{money(demand)}/yr</div></div>
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Club wage bill</div><div className="font-semibold tnum">{money(bill)}/yr</div></div>
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Transfer budget</div><div className="font-semibold tnum">{money(user.budget)}</div></div>
        </div>
        <div className="flex items-center justify-between gap-2 mb-3">
          <div className="text-xs text-slate-400">Release clause (£M, blank = none)</div>
          <input value={rel} onChange={e=>setRel(e.target.value.replace(/[^0-9.]/g,""))} placeholder="none" inputMode="decimal" className="w-24 bg-[#0d1526] rounded px-2 py-1 text-sm text-right tnum" />
        </div>
        <div className="text-xs text-slate-400 mb-2">Offer a contract length (sets the clause above):</div>
        <div className="grid grid-cols-4 gap-2">
          {[1,2,3,4].map(yrs=>(
            <button key={yrs} onClick={()=>sign(yrs)}
              className="px-2 py-2 rounded-lg bg-emerald-500 text-slate-900 font-semibold text-sm">
              {yrs}y<div className="text-[10px] font-normal">{money(round(demand*termPremium[yrs]*10)/10)}/yr</div>
            </button>
          ))}
        </div>
        <div className="text-[11px] text-slate-500 mt-3">A lower release clause makes the player easier for rivals to buy; leave it blank for none. Let a deal run down and a rival can poach him on a free.</div>
      </div>
    </div>
  );
}

/* ----------------------------- tactics / formation --------------------- */
function Tactics({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  const slots = FORMATIONS[user.formation] || FORMATIONS["4-3-3"];
  const coords = pitchCoords(slots);
  const [pickSlot, setPickSlot] = useState(null);   // slot index being assigned
  ensureXI(user, G.players);
  const squad = Object.values(G.players).filter(p=>p.teamId===user.id && !isInjured(p));
  const setFormation = f => { if(f!==user.formation){ user.formFam=52; user.formFamOf=f; } user.formation=f; autoPickXI(user, G.players); commit(G); };
  const setInstr = (k,v) => { user.instr = { press:"mid", tempo:"normal", width:"normal", ...(user.instr||{}), [k]:v }; commit(G); };
  const setTactic = t => { user.tactic=t; commit(G); };
  const assign = (slotIdx, pid) => {
    const xi = (user.xi||[]).slice();
    const existing = xi.indexOf(pid);
    if(existing>=0){ const tmp=xi[slotIdx]; xi[slotIdx]=pid; xi[existing]=tmp; }  // swap
    else xi[slotIdx]=pid;
    user.xi = xi; autoFillBench(user, G.players); commit(G); setPickSlot(null);
  };
  const u = unitRatings(user, G.players);
  return (
    <div className="space-y-3">
      <Card>
        <div className="flex flex-wrap items-center gap-2">
          <span className="text-sm text-slate-400">Formation</span>

            {FORMATION_NAMES.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
          <span className="text-sm text-slate-400 ml-2">Tactic</span>
          {["defensive","balanced","attacking"].map(t=>(
            <button key={t} onClick={()=>setTactic(t)} className={"px-2 py-1 rounded text-xs capitalize "+((user.tactic||"balanced")===t?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{t}</button>
          ))}
          <button onClick={()=>{ autoPickXI(user, G.players); commit(G); tShow("Auto-picked best XI"); }} className="ml-auto px-3 py-1 rounded bg-[#16213a] text-slate-200 text-xs">Auto-pick XI</button>
          <button onClick={()=>{ user.autoRotate=!user.autoRotate; if(user.autoRotate) rotateXI(user, G.players, false); commit(G); tShow(user.autoRotate?"Auto-Rotate ON — the assistant will rest tired players":"Auto-Rotate OFF — you pick the XI"); }} className={"px-3 py-1 rounded text-xs font-semibold "+(user.autoRotate?"bg-sky-500 text-slate-900":"bg-[#16213a] text-slate-300")} title="Let the assistant manager rotate fresh legs in to protect fitness, especially in midweek double-game weeks">🔄 Auto-Rotate {user.autoRotate?"ON":"OFF"}</button>
        </div>
        {user.autoRotate && <div className="mt-2">
          <div className="text-xs text-sky-300/80 mb-1">🔄 Assistant manager is handling selection — rests tired starters and rotates harder in midweek weeks. Priority:</div>
          <div className="flex gap-1">
            {[["balanced","⚖️ Balanced","Mild rotation in the league, harder in midweek cups"],["league","🏆 League first","Strongest XI in the league, rotate hard in cups"],["cup","🌍 Cups first","Strongest XI in cups/continental, rotate hard in the league"]].map(([v,l,tip])=>(
              <button key={v} title={tip} onClick={()=>{ user.rotatePriority=v; commit(G); tShow(`Rotation priority: ${l}`); }} className={"px-2 py-1 rounded text-xs "+(((user.rotatePriority)||"balanced")===v?"bg-sky-500 text-slate-900 font-semibold":"bg-[#16213a] text-slate-300")}>{l}</button>
            ))}
          </div>
        </div>}
        <div className="flex gap-4 mt-2 text-xs text-slate-400">
          <span>DEF <b className="text-slate-200">{round(u.DEF)}</b></span>
          <span>MID <b className="text-slate-200">{round(u.MID)}</b></span>
          <span>ATT <b className="text-slate-200">{round(u.ATT)}</b></span>
          <span>Overall <b className="text-emerald-300">{clubStrength(user, G.players)}</b></span>

        {/* tactical instructions */}
        <div className="mt-3 border-t border-[#1d2940] pt-2 space-y-2">

            ["tempo","Tempo",[["fast","Fast"],["normal","Normal"],["slow","Slow"]],"Fast tempo = more chances both ways and more fatigue; slow keeps the ball"],

            </div>
          ))}
          <div className="flex items-center gap-2">
            <span className="text-xs text-slate-400 w-14">Familiar</span>
            <div className="flex-1 h-2 rounded bg-[#0d1526] overflow-hidden"><div className="h-full bg-sky-400" style={{width:(user.formFam!=null?clamp(user.formFam,0,100):100)+"%"}}></div></div>

            return (
              <button key={i} onClick={()=>setPickSlot(i)}
                style={{ left:c.x+"%", top:c.y+"%", transform:"translate(-50%,-50%)" }}
                className="absolute flex flex-col items-center">
                <div className={"w-11 h-11 rounded-full flex items-center justify-center text-sm font-bold border-2 "+(p? (pen>0?"bg-orange-500/90 border-orange-300 text-slate-900":"bg-emerald-500 border-emerald-200 text-slate-900") : "bg-[#16213a] border-slate-500 text-slate-400")}>
                  {p? p.ovr : slot}
                </div>
                <div className="text-[10px] mt-0.5 text-white/90 font-medium max-w-[64px] truncate">{p? p.name.split(" ").slice(-1)[0] : slot}</div>
                <div className="text-[9px] text-emerald-200/80">{slot}{pen>0?" ⚠":""}</div>
              </button>
            );
          })}
        </div>
        <div className="text-xs text-slate-400 mt-2">Tap a position to assign a player. <span className="text-orange-400">Orange = out of position</span> (rating penalty). A player can fill any of his listed positions with no penalty.</div>
      </Card>

      {pickSlot!=null && (
        <SlotPicker G={G} slot={slots[pickSlot]} squad={squad} xi={user.xi||[]}
          onPick={pid=>assign(pickSlot, pid)} onClose={()=>setPickSlot(null)} />
      )}

      <SetPieceCard G={G} commit={commit} tShow={tShow} />

      <Card>
        <div className="font-semibold mb-2">Bench</div>
        <div className="flex flex-wrap gap-2">
          {(user.bench||[]).map(id=>{ const p=G.players[id]; if(!p) return null; return (
            <div key={id} className="px-2 py-1 rounded bg-[#16213a] text-sm flex items-center gap-2">
              <OvrPill v={p.ovr} /><PName p={p} /><span className="text-xs text-slate-500">{p.pos}</span>
            </div>
          ); })}
        </div>
      </Card>
    </div>
  );
}
function SetPieceCard({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  ensureSetPieces(user, G.players);
  const squad = Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth && p.pos!=="GK").sort((a,b)=>b.ovr-a.ovr);
  const ROLES = [["pen","Penalties","🎯"],["fk","Free Kicks","🥅"],["corner","Corners","🚩"]];
  const setTaker = (role, pid) => { user.setPieces=user.setPieces||{}; user.setPieces[role]=pid; commit(G); tShow(`${ROLES.find(r=>r[0]===role)[1]} taker set`); };
  const autoAssign = () => { ["pen","fk","corner"].forEach(role=>{ user.setPieces[role]=bestSetPieceTaker(user, G.players, role); }); commit(G); tShow("Set-piece takers auto-assigned"); };
  return (
    <Card>
      <div className="flex items-center justify-between mb-2">
        <div className="font-semibold">Set-Piece Takers</div>
        <button onClick={autoAssign} className="px-2 py-1 rounded bg-[#16213a] text-slate-300 text-xs">Auto-assign</button>
      </div>
      <div className="grid sm:grid-cols-3 gap-2">
        {ROLES.map(([role,label,emoji])=>{
          const curId = user.setPieces && user.setPieces[role];
          const cur = curId!=null ? G.players[curId] : null;
          return (
            <div key={role} className="bg-[#0d1526] rounded-lg p-2">
              <div className="text-xs text-slate-400 mb-1">{emoji} {label}</div>
              <select value={curId||""} onChange={e=>setTaker(role, e.target.value?Number(e.target.value):null)} className="w-full bg-[#16213a] rounded px-2 py-1 text-sm">
                <option value="">— none —</option>
                {squad.map(p=><option key={p.id} value={p.id}>{p.name} ({p.ovr})</option>)}
              </select>
              {cur && <div className="text-[11px] text-slate-500 mt-1">{cur.pos} · Sho {cur.sho} · Pas {cur.pas}</div>}
            </div>
          );
        })}
      </div>
    </Card>
  );
}
function autoFillBench(club, players){
  const used = new Set(club.xi||[]);
  const rest = Object.values(players).filter(p=>p.teamId===club.id && !used.has(p.id) && !isInjured(p)).sort((a,b)=>b.ovr-a.ovr);
  club.bench = rest.slice(0,9).map(p=>p.id);
}
function SlotPicker({G, slot, squad, xi, onPick, onClose}){
  const ranked = squad.slice().sort((a,b)=>effRating(b,slot)-effRating(a,slot));
  return (
    <div className="fixed inset-0 bg-black/60 z-40 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-xl w-full max-w-md max-h-[70vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-3 border-b border-[#1d2940] flex items-center justify-between sticky top-0 bg-[#101a30]">
          <div className="font-semibold">Assign at <span className="text-emerald-300">{slot}</span></div>
          <button onClick={onClose} className="text-slate-400">✕</button>
        </div>
        <div className="p-2 space-y-1">
          {ranked.map(p=>{
            const pen = posPenalty(p, slot); const eff = effRating(p,slot);
            const inXi = xi.includes(p.id);
            return (
              <button key={p.id} onClick={()=>onPick(p.id)} className="w-full flex items-center gap-2 p-2 rounded hover:bg-[#16213a] text-left">
                <OvrPill v={p.ovr} />
                <div className="flex-1">
                  <div className="font-medium">{p.name} {inXi&&<span className="text-xs text-emerald-400">(in XI)</span>}</div>
                  <div className="text-xs text-slate-400">{posLabel(p)} · {p.age}y</div>
                </div>
                <div className={"text-sm font-semibold "+(pen>0?"text-orange-400":"text-emerald-300")}>{pen>0?`${eff} (-${pen})`:"natural"}</div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

            className={"px-3 py-1.5 rounded text-sm "+(country===ci?"bg-indigo-500 text-white font-semibold":"bg-[#16213a] text-slate-300")}>{C.flag} {C.name}</button>

            </div>
          </div>
          <div className="text-right text-xs text-slate-400">
            <div>Squad OVR {club.xi&&club.xi.length?Math.round(club.xi.map(id=>G.players[id]).filter(Boolean).reduce((s,p)=>s+p.ovr,0)/(club.xi.length||1)):clubStrength(club,G.players)}</div>
            <div>Budget {money(club.budget)}</div>
          </div>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-3 text-center text-sm">
          <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Goals</div><div className="font-bold tnum">{totals.g}</div></div>
          <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Assists</div><div className="font-bold tnum">{totals.a}</div></div>
          <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Apps</div><div className="font-bold tnum">{totals.app}</div></div>
          <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Clean Sh</div><div className="font-bold tnum">{totals.cs}</div></div>
        </div>
      </Card>

      {/* trophy cabinet */}
      {(()=>{
        const hon = (club.honours||[]).slice().sort((a,b)=>b.season-a.season);
        const cnt = t => hon.filter(h=>h.type===t).length;
        return (
          <Card>
            <div className="font-semibold mb-2">🏆 {club.name} trophy cabinet</div>
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-2 text-center">
              {[["league","Leagues"],["cup","Cups"],["continental","Continental"],["double","🥈 Doubles"],["treble","🌟 Trebles"],["promo","Promotions"]].map(([t,l])=>(
                <div key={t} className={"rounded-lg p-2 "+(t==="treble"&&cnt(t)>0?"bg-amber-500/15 border border-amber-500/40":t==="continental"&&cnt(t)>0?"bg-sky-500/15 border border-sky-500/30":"bg-[#0d1526]")}><div className="text-2xl font-black tnum">{cnt(t)}</div><div className="text-[11px] text-slate-400">{l}</div></div>
              ))}
            </div>
            <div className="space-y-1 text-sm max-h-48 overflow-y-auto">
              {hon.map((h,i)=>(<div key={i} className="text-slate-300 flex gap-2"><span className="text-slate-500 tnum">{h.season}</span><span>{h.type==="league"?"🏆":h.type==="cup"?"🎖️":h.type==="continental"?"🌍":h.type==="treble"?"🌟":"⬆️"} {h.label}</span></div>))}
              {!hon.length && <div className="text-slate-500">No trophies in the cabinet yet.</div>}
            </div>
          </Card>
        );
      })()}

      {/* derby head-to-head vs rivals */}
      {(()=>{
        const rival = club.rivalId!=null ? G.clubs[club.rivalId] : null;
        if(!rival) return null;
        const a = Math.min(club.id, rival.id), b = Math.max(club.id, rival.id);
        const r = (G.h2h||{})[a+"-"+b];
        const mine = r ? (club.id===a ? {w:r.aW, l:r.bW, d:r.d, gf:r.aG, ga:r.bG} : {w:r.bW, l:r.aW, d:r.d, gf:r.bG, ga:r.aG}) : null;
        const compSym = c => c==="C"?"🏆":c==="CC"?"🌍":"⚽";
        return (
          <Card>
            <div className="font-semibold mb-1">🔥 Derby — {club.abbr} vs {rival.abbr} <span className="text-slate-500 text-xs font-normal">({rival.name})</span></div>
            {!mine ? <div className="text-sm text-slate-500">No meetings recorded yet (tracking started this season).</div> : <>
              <div className="grid grid-cols-4 gap-2 text-center text-sm mb-2">
                <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Played</div><div className="font-bold tnum">{mine.w+mine.d+mine.l}</div></div>
                <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">{club.abbr} wins</div><div className="font-bold tnum text-emerald-400">{mine.w}</div></div>
                <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Draws</div><div className="font-bold tnum">{mine.d}</div></div>
                <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">{rival.abbr} wins</div><div className="font-bold tnum text-red-400">{mine.l}</div></div>
              </div>
              <div className="text-xs text-slate-400 mb-1">Goals {mine.gf}-{mine.ga} · Recent meetings:</div>
              <div className="space-y-0.5 text-sm tnum">
                {(r.games||[]).slice(0,6).map((g,i)=>{
                  const myHome = g.h===club.abbr;
                  const gf = myHome?g.hs:g.as, ga = myHome?g.as:g.hs;
                  return (
                    <div key={i} className="flex items-center gap-2">
                      <span className="text-slate-500 text-xs w-10">{g.s}</span>
                      <span className="w-5 text-center" title={g.comp==="C"?"National Cup":g.comp==="CC"?"Champions Cup":"League"}>{compSym(g.comp)}</span>
                      <span className="flex-1">{g.h} {g.hs}-{g.as} {g.a}</span>
                      <span className={"inline-block w-2 h-2 rounded-full "+(gf>ga?"bg-emerald-500":gf<ga?"bg-red-500":"bg-slate-500")}></span>
                    </div>
                  );
                })}
              </div>
            </>}
          </Card>
        );
      })()}

      {/* season-by-season team history + overall record */}
      {(()=>{
        const liveCup = (G.cups||[]).find(x=>x.country===(club.country||0));
        const curCup = clubCupRun(G, liveCup, club.id);
        const curCont = clubContRun(G, G.contCup, club.id);
        // still alive in a live cup → show progress, not a final result
        const cupCell = (run, cup) => {
          if(!run) return <span className="text-slate-600">—</span>;
          const alive = cup && cup.winner==null && ((cup.alive||[]).includes(club.id)||(cup.byes||[]).includes(club.id));
          const label = alive ? "in "+(cup.round==="PR"?"Prelim":cup.round) : (CUP_RUN_LABEL[run.round]||run.round);
          const win = run.round==="W" && !alive;
          return <span className={win?"text-amber-300 font-semibold":run.round==="Final"&&!alive?"text-slate-200":"text-slate-300"}>{win&&"🏆 "}{label}<span className="text-slate-500 text-[10px]"> ({run.w}-{run.d}-{run.l})</span></span>;
        };
        // current season (in progress or just finished, not yet archived)
        const curRow = club.pld>0 || curCup || curCont ? {
          season:G.season, div:club.div, pos:leaguePos(G,club), w:club.w, d:club.d, l:club.l, gf:club.gf, ga:club.ga, pts:club.pts,
          cup:curCup, cont:curCont, live:true,
        } : null;
        const rows = (curRow?[curRow]:[]).concat((club.history||[]).slice().reverse());
        // overall record per competition (archived seasons + the live one)
        const sum = pickFn => rows.reduce((a,r)=>{ const x=pickFn(r); if(x){ a.pld+=(x.pld!=null?x.pld:(x.w+x.d+x.l)); a.w+=x.w; a.d+=x.d; a.l+=x.l; a.gf+=x.gf; a.ga+=x.ga; } return a; },{pld:0,w:0,d:0,l:0,gf:0,ga:0});
        const recs = { L:sum(r=>r), C:sum(r=>r.cup), CC:sum(r=>r.cont) };
        recs.all = ["L","C","CC"].reduce((a,k)=>{ const x=recs[k]; a.pld+=x.pld; a.w+=x.w; a.d+=x.d; a.l+=x.l; a.gf+=x.gf; a.ga+=x.ga; return a; },{pld:0,w:0,d:0,l:0,gf:0,ga:0});
        const R = recs[recComp]||recs.all;
        const winPct = R.pld ? Math.round(R.w/R.pld*100) : 0;
        const ord = n => n+(n===1?"st":n===2?"nd":n===3?"rd":"th");
        return (
          <>
          <Card>
            <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
              <div className="font-semibold">📊 Overall record <span className="text-slate-500 text-xs font-normal">({rows.length} season{rows.length!==1?"s":""} on record)</span></div>
              <div className="flex gap-1 flex-wrap">
                {[["all","All"],["L","⚽ League"],["C","🏆 Cup"],["CC","🌍 Champs Cup"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setRecComp(k)} className={"px-2 py-1 rounded text-xs font-semibold "+(recComp===k?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l}</button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center text-sm">
              <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Played</div><div className="font-bold tnum">{R.pld}</div></div>
              <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">W-D-L</div><div className="font-bold tnum">{R.w}-{R.d}-{R.l}</div></div>
              <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">Win %</div><div className="font-bold tnum">{winPct}%</div></div>
              <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">GF</div><div className="font-bold tnum">{R.gf}</div></div>
              <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">GA</div><div className="font-bold tnum">{R.ga}</div></div>
              <div className="bg-[#0d1526] rounded p-2"><div className="text-xs text-slate-400">GD</div><div className="font-bold tnum">{R.gf-R.ga>=0?"+":""}{R.gf-R.ga}</div></div>
            </div>
            {recComp==="C" && !recs.C.pld && <div className="text-xs text-slate-500 mt-2">Cup match records started being tracked from this update — older seasons show only league data.</div>}
          </Card>
          {(()=>{
            const rec = club.records||{};
            const hist = (club.history||[]).concat(curRow&&curRow.live?[curRow]:[]);
            const bestGoals = hist.reduce((b,h)=>Math.max(b,h.gf||0),0);
            const bestPts = hist.reduce((b,h)=>Math.max(b,h.pts||0),0);
            const bestFin = hist.filter(h=>h.div===0).reduce((b,h)=>Math.min(b,h.pos||99),99);
            const R = ({label, children}) => <div className="bg-[#0d1526] rounded p-2"><div className="text-[11px] text-slate-400">{label}</div><div className="text-sm font-semibold">{children}</div></div>;
            const anything = rec.bigWin||rec.bigLoss||rec.recordBuy||rec.recordSale||rec.bestUnbeaten||bestGoals;
            if(!anything) return null;
            return (
              <Card>
                <div className="font-semibold mb-2">📌 {club.name} club records</div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {rec.bigWin && <R label="💥 Biggest win">{rec.bigWin.gf}-{rec.bigWin.ga} v {rec.bigWin.opp} <span className="text-slate-500 tnum">'{String(rec.bigWin.season).slice(2)}</span></R>}
                  {rec.bigLoss && <R label="💔 Heaviest defeat">{rec.bigLoss.gf}-{rec.bigLoss.ga} v {rec.bigLoss.opp} <span className="text-slate-500 tnum">'{String(rec.bigLoss.season).slice(2)}</span></R>}
                  {rec.bestUnbeaten>0 && <R label="🛡️ Longest unbeaten">{rec.bestUnbeaten} league games</R>}
                  {rec.recordBuy && <R label="📥 Record signing"><span className="text-emerald-300">{money(rec.recordBuy.fee)}</span> · {rec.recordBuy.name}</R>}
                  {rec.recordSale && <R label="📤 Record sale"><span className="text-emerald-300">{money(rec.recordSale.fee)}</span> · {rec.recordSale.name}</R>}
                  {bestGoals>0 && <R label="⚽ Most goals (season)">{bestGoals}</R>}
                  {bestPts>0 && <R label="📈 Most points (season)">{bestPts}</R>}
                  {bestFin<99 && <R label="🏅 Highest finish">{ord(bestFin)} in {divName(club.country||0,0)}</R>}
                </div>
              </Card>
            );
          })()}
          {rows.length>0 && (
            <Card className="p-0 overflow-x-auto">
              <div className="p-3 font-semibold">📜 {club.name} — season by season</div>

/* ----------------------------- leaders --------------------------------- */
function Leaders({G}){
  const u = G.clubs[G.userTeamId];
  const [country, setCountry] = useState(u.country||0);
  const [div, setDiv] = useState(u.div);
  const pool = Object.values(G.players).filter(p=>p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].div===div && G.clubs[p.teamId].country===country);
  const board = (title, arr, val) => (
    <Card>
      <div className="font-semibold mb-2">{title}</div>
      <table className="w-full text-sm">
        <tbody>
          {arr.slice(0,10).map((p,i)=>(
            <tr key={p.id} className="border-b border-[#15203a]">
              <td className="py-1 text-slate-500 w-6">{i+1}</td>
              <td className="py-1"><PName p={p} className="font-medium" /> <span className="text-xs text-slate-500">{G.clubs[p.teamId].abbr} · {p.pos}</span></td>
              <td className="py-1 text-right font-semibold tnum">{val(p)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </Card>
  );
  const minApp = p => p.stats.App>=4;
  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap">
        {COUNTRIES.map((C,ci)=><button key={ci} onClick={()=>setCountry(ci)} className={"px-3 py-1.5 rounded text-sm "+(country===ci?"bg-indigo-500 text-white font-semibold":"bg-[#16213a] text-slate-300")}>{C.flag} {C.name}</button>)}
      </div>
      <div className="flex gap-2">
        {COUNTRIES[country].divNames.map((d,i)=><button key={i} onClick={()=>setDiv(i)} className={"px-3 py-1.5 rounded text-sm "+(div===i?"bg-emerald-500 text-slate-900 font-semibold":"bg-[#16213a] text-slate-300")}>{d}</button>)}
      </div>
      <div className="grid sm:grid-cols-2 gap-3">
        {board("⚽ Top Scorers", pool.slice().sort((a,b)=>b.stats.G-a.stats.G), p=>p.stats.G)}
        {board("🅰️ Assists", pool.slice().sort((a,b)=>b.stats.A-a.stats.A), p=>p.stats.A)}
        {board("🎯 Key Passes", pool.slice().sort((a,b)=>(b.stats.KP||0)-(a.stats.KP||0)), p=>p.stats.KP||0)}
        {board("📈 Expected Goals (xG)", pool.slice().sort((a,b)=>(b.stats.xG||0)-(a.stats.xG||0)), p=>(p.stats.xG||0).toFixed(1))}
        {board("🧤 Clean Sheets", pool.filter(p=>p.pos==="GK").sort((a,b)=>b.stats.CS-a.stats.CS), p=>p.stats.CS)}
        {board("🥅 GK Saves", pool.filter(p=>p.pos==="GK").sort((a,b)=>(b.stats.Sv||0)-(a.stats.Sv||0)), p=>p.stats.Sv||0)}
        {board("🛡️ Tackles", pool.slice().sort((a,b)=>(b.stats.Tkl||0)-(a.stats.Tkl||0)), p=>p.stats.Tkl||0)}
        {board("🧠 Interceptions", pool.slice().sort((a,b)=>(b.stats.Int||0)-(a.stats.Int||0)), p=>p.stats.Int||0)}
        {board("🚧 Clearances", pool.slice().sort((a,b)=>(b.stats.Clr||0)-(a.stats.Clr||0)), p=>p.stats.Clr||0)}
        {board("💪 Duel % (min 30)", pool.filter(p=>(p.stats.DuT||0)>=30).sort((a,b)=>duelPct(b.stats)-duelPct(a.stats)), p=>duelPct(p.stats)+"%")}
        {board("🎯 Progressive Passes", pool.slice().sort((a,b)=>(b.stats.PrgP||0)-(a.stats.PrgP||0)), p=>p.stats.PrgP||0)}
        {board("🏰 Ball-Winner (Def. Value)", pool.filter(minApp).sort((a,b)=>defContribution(b.stats)-defContribution(a.stats)), p=>defContribution(p.stats))}
        {board("⭐ Avg Rating", pool.filter(minApp).sort((a,b)=>avgRating(b.stats)-avgRating(a.stats)), p=>avgRating(p.stats).toFixed(2))}
        {board("💎 Rating Value", pool.filter(minApp).sort((a,b)=>ratingValue(b.stats)-ratingValue(a.stats)), p=>ratingValue(p.stats))}
      </div>
    </div>
  );
}

  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap">
        {COUNTRIES.map((C,ci)=>(
          <button key={ci} onClick={()=>setCountry(ci)} className={"px-3 py-1.5 rounded text-sm "+(country===ci?"bg-indigo-500 text-white font-semibold":"bg-[#16213a] text-slate-300")}>{C.flag} {C.name}</button>
        ))}
      </div>
      {!cup ? <Card>No cup in progress.</Card> : <>
      <Card>
        <div className="font-semibold">{cupName(country)}</div>
        <div className="text-sm text-slate-400">{cup.winner!=null? `Winner: ${G.clubs[cup.winner].name} 🏆`
          : cup.round==="PR" ? `Preliminary round · ${cup.alive.length} lower-league clubs play for ${Math.floor(cup.alive.length/2)} spots · ${(cup.byes||[]).length} clubs have byes into the Rd of 64`
          : `Current round: ${cup.round} · ${cup.alive.length} clubs left`}</div>
        {(((cup.results||{}).PR) || (cup.byes&&cup.byes.length>0)) && <div className="text-xs text-slate-500 mt-0.5">All {CLUBS_PER_COUNTRY} clubs in the country enter — the fourth tier and the weakest third-tier clubs start in the preliminary round; everyone above gets a bye.</div>}
      </Card>
      {order.map(r=>{
        const ties = (cup.results||{})[r];
        if(!ties) return null;
        return (
          <Card key={r}>
            <div className="font-semibold mb-2">{roundLabel(r)}</div>
            <div className="space-y-1 text-sm tnum">
              {ties.map((t,i)=>(
                <div key={i} className={"flex items-center gap-2 "+((t.home===G.userTeamId||t.away===G.userTeamId)?"text-emerald-300":"")}>
                  <span className={"flex-1 text-right "+(t.win===t.home?"font-bold":"")}>{G.clubs[t.home].abbr}</span>
                  <span className="px-2 text-center">{t.twoLeg
                    ? <>{t.aggH}-{t.aggA}<div className="text-[10px] text-slate-500 font-normal">{t.l1h}-{t.l1a}, {t.l2h}-{t.l2a}{t.pens?` · pens ${t.pens}`:t.aet?" · aet":""}</div></>
                    : <>{t.hs}-{t.as}{t.pens?<span className="text-[10px] text-amber-400"> (p{t.pens})</span>:t.aet?<span className="text-[10px] text-amber-400"> aet</span>:""}</>}</span>
                  <span className={"flex-1 "+(t.win===t.away?"font-bold":"")}>{G.clubs[t.away].abbr}</span>
                </div>
              ))}
            </div>
          </Card>
        );
      })}
      {(()=>{ const rc=(G.cupChampions||[]).filter(c=>c.country===country); return rc.length>0 && (
        <Card>
          <div className="font-semibold mb-2">🏆 {cupName(country)} — roll of honour</div>
          <div className="space-y-1 text-sm max-h-56 overflow-y-auto">
            {rc.map((c,i)=>(<div key={i} className="flex gap-2"><span className="text-slate-500 tnum w-12">{c.season}</span><span className={c.id===G.userTeamId?"text-amber-300 font-semibold":"text-slate-200"}>{G.clubs[c.id]?G.clubs[c.id].name:c.abbr}</span></div>))}
          </div>
        </Card>
      ); })()}
      </>}
    </div>
  );

/* ----------------------------- fixtures -------------------------------- */
// Build the user's full season fixture feed across ALL competitions, tagged by
// competition so league / national cup / continental can be told apart.
const COMP_META = {
  league: { sym:"⚽", label:"League",   cls:"text-slate-400" },
  cup:    { sym:"🏆", label:"Nat. Cup", cls:"text-amber-300" },
  cont:   { sym:"🌍", label:CONT_CUP_NAME, cls:"text-indigo-300" },
};
function userFixtureFeed(G){
  const uid = G.userTeamId, out = [];
  const cupRev = G.cupMD_rev || CUP_MD_REV, contRev = G.contMD_rev || CONT_MD_REV;
  // league
  G.schedule.forEach((round, md)=>{
    const g = round.find(x=>x.home===uid||x.away===uid);
    if(!g) return;
    const home = g.home===uid, oppId = home?g.away:g.home, opp = G.clubs[oppId];
    out.push({ md:md+1, comp:"league", home, oppName:opp?opp.name:"?", played:!!g.played,
      gf:home?g.hs:g.as, ga:home?g.as:g.hs, round:"League", derby:isDerby(G, uid, oppId) });
  });
  // domestic cup (current season)
  const cup = (G.cups||[]).find(c=>c.country===(G.clubs[uid].country||0));
  if(cup){
    // played ties
    CUP_ORDER.forEach(r=>{
      const ties = (cup.results||{})[r]; if(!ties) return;
      const t = ties.find(x=>x.home===uid||x.away===uid); if(!t) return;
      const home = t.home===uid;
      out.push({ md:cupRev[r], comp:"cup", home, oppName:(G.clubs[home?t.away:t.home]||{}).name||"?",
        played:true, gf:home?t.hs:t.as, ga:home?t.as:t.hs, round:r });
    });
    // all future rounds the user is still in (show as upcoming). A club with a
    // bye into the R32 is still "in" the cup during the preliminary round.
    if(cup.winner==null && ((cup.alive||[]).includes(uid) || (cup.byes||[]).includes(uid))){
      const doneRounds=new Set(Object.keys(cup.results||{}));
      const hasBye=(cup.byes||[]).includes(uid);
      CUP_ORDER.filter(r=>!doneRounds.has(r) && cupRev[r]!=null && !(r==="PR"&&hasBye)).forEach(r=>{
        out.push({ md:cupRev[r], comp:"cup", home:null, oppName:"TBD", played:false, round:r });
      });
    }
  }
  // continental (current season)
  const cc = G.contCup;
  const contQual = cc && (cc.qualifiers||[]).includes(uid);
  if(cc && contQual){
    // played group results
    (cc.groups||[]).forEach(grp=>{
      (grp.results||[]).forEach(res=>{
        if(res.home!==uid && res.away!==uid) return;
        const home = res.home===uid; const mdName = ["G1","G2","G3","G4","G5","G6"][res.md];
        out.push({ md:contRev[mdName], comp:"cont", home, oppName:(G.clubs[home?res.away:res.home]||{}).name||"?",
          played:true, gf:home?res.hs:res.as, ga:home?res.as:res.hs, round:"Group" });
      });
    });
    // remaining group matchdays (not yet played)
    if(cc.phase==="group"){
      const doneMds=new Set((cc.groups||[]).flatMap(g=>(g.results||[]).map(r=>r.md)));
      [0,1,2,3,4,5].filter(m=>!doneMds.has(m)).forEach(m=>{
        const mdName=["G1","G2","G3","G4","G5","G6"][m];
        out.push({ md:contRev[mdName], comp:"cont", home:null, oppName:"TBD", played:false, round:"Group MD"+(m+1) });
      });
    }
    // played KO ties
    const alive=(cc.alive||[]).includes(uid);
    CONT_ORDER.forEach(r=>{
      const ties=(cc.results||{})[r]; if(!ties) return;
      const t=ties.find(x=>x.home===uid||x.away===uid); if(!t) return;
      const home=t.home===uid;
      const tgf=t.twoLeg?t.aggH:t.hs, tga=t.twoLeg?t.aggA:t.as;
      out.push({ md:contRev[r], comp:"cont", home, oppName:(G.clubs[home?t.away:t.home]||{}).name||"?",
        played:true, gf:home?tgf:tga, ga:home?tga:tgf, round:r, twoLeg:!!t.twoLeg });
    });
    // upcoming KO rounds
    if(alive && cc.phase==="ko"){
      const doneKO=new Set(Object.keys(cc.results||{}));
      CONT_ORDER.filter(r=>!doneKO.has(r)).forEach(r=>{
        out.push({ md:contRev[r], comp:"cont", home:null, oppName:"TBD", played:false, round:r });
      });
    }
  }
  return out.sort((a,b)=> a.md-b.md || (a.comp==="league"?-1:1));
}

/* ----------------------------- transfers ------------------------------- */
function Transfers({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  const windowOpen = transferWindowOpen(G);
  const [tab, setTab] = useState("buy");
  const [q, setQ] = useState("");
  // BUY: other clubs' players, affordable-ish
  let market = Object.values(G.players).filter(p=>p.teamId!=null && p.teamId!==user.id);
  if(q) market = market.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  market.sort((a,b)=>b.ovr-a.ovr);
  market = market.slice(0,80);
  // Senior squad only — academy players never count toward roster slots or
  // appear as loan-out candidates (they have to be promoted first, see loanOut).
  const squad = Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth);
  const offers = G.transferOffers||[];
  const [sellOnDeal, setSellOnDeal] = useState(false);   // give seller 20% sell-on for -25% fee
  const feeFor = p => round(p.value * 1.15 * (sellOnDeal?0.75:1) *10)/10;
  const doBuy = p => { const fee=feeFor(p); const r=buyPlayer(G,p,fee,sellOnDeal?{sellOnPct:20}:{}); if(r.ok){ commit(G); tShow(`Signed ${p.name}`); } else tShow(r.msg); };
  const doRelease = p => { if(p.release==null) return; const r=buyPlayer(G,p,p.release,{via:"release"}); if(r.ok){ commit(G); tShow(`Triggered ${p.name}'s release clause`); } else tShow(r.msg); };
  const doSell = p => {
    const fee=round(p.value*0.9*10)/10;
    // always sell to an actual AI club so the player stays in the world
    const buyer=G.clubs.filter(c=>c.id!==user.id && c.budget>=fee
      && Object.values(G.players).filter(x=>x.teamId===c.id && !x.youth).length<28)
      .sort((a,b)=>b.budget-a.budget)[0];
    if(!buyer){ tShow("No club can afford that player right now."); return; }
    sellPlayer(G,p,fee,buyer.id); commit(G); tShow(`Sold ${p.name} to ${buyer.name} for ${money(fee)}`);
  };
  const acceptOffer = o => { const p=G.players[o.playerId]; if(!p){ G.transferOffers=offers.filter(x=>x.id!==o.id); commit(G); return; } sellPlayer(G,p,o.fee,o.by); G.transferOffers=offers.filter(x=>x.id!==o.id); commit(G); tShow(`Accepted ${money(o.fee)} for ${p.name}`); };
  const rejectOffer = o => { G.transferOffers=offers.filter(x=>x.id!==o.id); commit(G); };
  const doLoanOut = p => { const r=loanOutAuto(G,p); if(r.ok){ commit(G); tShow(`${p.name} out on loan`); } else tShow(r.msg); };
  const doLoanIn = p => { const r=loanIn(G,p); if(r.ok){ commit(G); tShow(`${p.name} in on loan`); } else tShow(r.msg); };
  // loan-out candidates: your own players (not already loaned), youngest/fringe first
  const loanOutPool = squad.filter(p=>!isLoaned(p)).sort((a,b)=>(a.ovr-b.ovr)||(a.age-b.age)).slice(0,30);
  // loan-in candidates: AI fringe players (not in their XI), decent quality
  const loanInPool = Object.values(G.players).filter(p=>p.teamId!=null && p.teamId!==user.id && !isLoaned(p) && p.ovr>=55 && !(G.clubs[p.teamId].xi||[]).includes(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,60);
  const myLoans = Object.values(G.players).filter(p=>isLoaned(p) && (p.loanOwner===user.id || p.teamId===user.id));
  return (
    <div className="space-y-3">
      <Card>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="font-semibold">Transfer Market</div>
          <div className="text-sm text-slate-400">Budget {money(user.budget)} · Senior squad {squad.length}/30 <span className="text-slate-600">(academy players don't count)</span></div>
        </div>
        <div className={"text-xs mt-1 "+(windowOpen?"text-emerald-300":"text-amber-300")}>{transferWindowLabel(G)}{!windowOpen && " · free agents still signable"}</div>
        <div className="flex gap-2 mt-2 text-sm">
          {[["buy","Buy"],["sell","Sell"],["loan","Loans"],["offers","Offers"+(offers.length?` (${offers.length})`:"")]].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} className={"px-3 py-1 rounded "+(tab===k?"bg-emerald-500 text-slate-900 font-semibold":"bg-[#16213a] text-slate-300")}>{l}</button>
          ))}
          <button onClick={()=>{ generateTransferOffers(G); commit(G); tShow("Market checked"); }} className="ml-auto px-3 py-1 rounded bg-[#16213a] text-slate-300 text-xs">Generate offer</button>
        </div>
      </Card>

      {tab==="buy" && (
        <>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search players…" className="w-full bg-[#16213a] rounded px-3 py-2 text-sm" />
          <label className="flex items-center gap-2 text-xs text-slate-300 px-1"><input type="checkbox" checked={sellOnDeal} onChange={e=>setSellOnDeal(e.target.checked)} /> Offer a 20% sell-on clause to cut fees 25% (the seller takes 20% of your next sale)</label>
          <Card className="p-0 overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]"><th className="text-left p-2">Player</th><th className="p-2">Club</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Age</th><th className="p-2">Fee</th><th className="p-2">Release</th><th className="p-2"></th></tr></thead>
              <tbody>
                {market.map(p=>(
                  <tr key={p.id} className="border-b border-[#15203a]">
                    <td className="p-2 text-left"><PName p={p} className="font-medium" /></td>
                    <td className="p-2 text-center text-slate-400">{G.clubs[p.teamId].abbr}</td>
                    <td className="p-2 text-center"><PosTag p={p} /></td>
                    <td className="p-2 text-center"><ScoutOvrPill p={p} /></td>
                    <td className="p-2 text-center tnum">{p.age}</td>
                    <td className="p-2 text-center tnum">{money(feeFor(p))}</td>
                    <td className="p-2 text-center tnum text-xs">{p.release!=null
                      ? <button onClick={()=>doRelease(p)} disabled={!windowOpen||user.budget<p.release} className={"px-1.5 py-0.5 rounded "+((!windowOpen||user.budget<p.release)?"text-slate-500":"bg-amber-500/20 text-amber-300 hover:bg-amber-500/30")} title="Trigger release clause">{money(p.release)}</button>
                      : <span className="text-slate-600">—</span>}</td>
                    <td className="p-2 text-center"><button onClick={()=>doBuy(p)} disabled={!windowOpen||user.budget<feeFor(p)} className={"px-2 py-1 rounded text-xs font-semibold "+((!windowOpen||user.budget<feeFor(p))?"bg-[#16213a] text-slate-500":"bg-emerald-500 text-slate-900")}>Buy</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
        </>
      )}
      {tab==="sell" && (
        <>
        <Card><div className="text-xs text-slate-400">Sell for a fee, or <span className="text-sky-300">loan out</span> a young player who needs game time — he keeps developing and plays a full season for the loan club (his stats there are logged with a 🔁 loan marker), then returns to you at season's end.</div></Card>
        <Card className="p-0 overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]"><th className="text-left p-2">Player</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Age</th><th className="p-2">Sale</th><th className="p-2"></th></tr></thead>
            <tbody>
              {squad.slice().sort((a,b)=>b.value-a.value).map(p=>(
                <tr key={p.id} className="border-b border-[#15203a]">
                  <td className="p-2 text-left"><PName p={p} className="font-medium" />{isLoaned(p)&&<span className="ml-1 text-sky-300 text-xs" title="Out on loan">🔁</span>}</td>
                  <td className="p-2 text-center"><PosTag p={p} /></td>
                  <td className="p-2 text-center"><OvrPill v={p.ovr} /></td>
                  <td className="p-2 text-center tnum">{p.age}</td>
                  <td className="p-2 text-center tnum">{money(round(p.value*0.9*10)/10)}</td>
                  <td className="p-2 text-center whitespace-nowrap">
                    <button onClick={()=>{ if(!windowOpen){ tShow("The transfer window is closed."); return; } if(squad.length<=14){ tShow("Squad too small to sell."); return; } doSell(p); }} disabled={!windowOpen||isLoaned(p)} className={"px-2 py-1 rounded text-xs "+((windowOpen&&!isLoaned(p))?"bg-[#16213a] text-slate-200":"bg-[#16213a] text-slate-500")}>Sell</button>
                    <button onClick={()=>{ if(!windowOpen){ tShow("The transfer window is closed."); return; } doLoanOut(p); }} disabled={!windowOpen||isLoaned(p)} className={"ml-1 px-2 py-1 rounded text-xs font-semibold "+((windowOpen&&!isLoaned(p))?"bg-sky-500/20 text-sky-300 hover:bg-sky-500/30":"bg-[#16213a] text-slate-500")} title="Loan out for the season (he develops and plays for the loan club)">🔁 Loan</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
        </>
      )}
      {tab==="offers" && (
        <div className="space-y-2">
          {offers.length===0 && <Card><div className="text-slate-400 text-sm">No incoming offers. Tap “Generate offer” or play matches to attract interest.</div></Card>}
          {offers.map(o=>{ const p=G.players[o.playerId]; const by=G.clubs[o.by]; if(!p) return null; return (
            <Card key={o.id}>
              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex-1">
                  <div className="font-semibold">{by.name} bid {money(o.fee)}</div>
                  <div className="text-sm text-slate-400">for <PName p={p} className="text-slate-200" /> ({p.pos} {p.ovr}, valued {money(p.value)})</div>
                </div>
                <button onClick={()=>acceptOffer(o)} className="px-3 py-1.5 rounded bg-emerald-500 text-slate-900 text-sm font-semibold">Accept</button>
                <button onClick={()=>rejectOffer(o)} className="px-3 py-1.5 rounded bg-[#16213a] text-slate-200 text-sm">Reject</button>
              </div>
            </Card>
          ); })}
        </div>
      )}
      {tab==="loan" && (
        <div className="space-y-3">
          {myLoans.length>0 && <Card>
            <div className="font-semibold mb-2 text-sm">Active loans</div>
            <div className="space-y-1 text-sm">
              {myLoans.map(p=>{ const out=p.loanOwner===user.id; const other=G.clubs[out?p.teamId:p.loanOwner];
                return <div key={p.id} className="flex items-center gap-2">
                  <span className={out?"text-amber-300":"text-emerald-300"}>{out?"📤 OUT":"📥 IN"}</span>
                  <PName p={p} className="flex-1" /><PosTag p={p} /><OvrPill v={p.ovr} />
                  <span className="text-slate-500 text-xs">{out?"at":"from"} {other?other.abbr:"?"}</span>
                </div>;
              })}
            </div>
          </Card>}
          {!windowOpen && <Card><div className="text-amber-300 text-sm">{transferWindowLabel(G)} — loans open in the transfer window.</div></Card>}
          <Card className="p-0 overflow-x-auto">
            <div className="px-3 pt-2 text-sm font-semibold">📥 Loan in <span className="text-slate-500 font-normal text-xs">— AI fringe players, returns at season's end</span></div>
            <table className="w-full text-sm"><thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]"><th className="text-left p-2">Player</th><th className="p-2">Club</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Age</th><th className="p-2"></th></tr></thead>
              <tbody>{loanInPool.map(p=>(
                <tr key={p.id} className="border-b border-[#15203a]">
                  <td className="p-2 text-left"><PName p={p} className="font-medium" /></td>
                  <td className="p-2 text-center text-slate-400">{G.clubs[p.teamId].abbr}</td>
                  <td className="p-2 text-center"><PosTag p={p} /></td>
                  <td className="p-2 text-center"><ScoutOvrPill p={p} /></td>
                  <td className="p-2 text-center tnum">{p.age}</td>
                  <td className="p-2 text-center"><button onClick={()=>doLoanIn(p)} disabled={!windowOpen} className={"px-2 py-1 rounded text-xs font-semibold "+(windowOpen?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-500")}>Loan</button></td>
                </tr>
              ))}</tbody>
            </table>
          </Card>
          <Card className="p-0 overflow-x-auto">
            <div className="px-3 pt-2 text-sm font-semibold">📤 Loan out <span className="text-slate-500 font-normal text-xs">— send a fringe player for game time</span></div>
            <table className="w-full text-sm"><thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]"><th className="text-left p-2">Player</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Age</th><th className="p-2"></th></tr></thead>
              <tbody>{loanOutPool.map(p=>(
                <tr key={p.id} className="border-b border-[#15203a]">
                  <td className="p-2 text-left"><PName p={p} className="font-medium" /></td>
                  <td className="p-2 text-center"><PosTag p={p} /></td>
                  <td className="p-2 text-center"><OvrPill v={p.ovr} /></td>
                  <td className="p-2 text-center tnum">{p.age}</td>
                  <td className="p-2 text-center"><button onClick={()=>doLoanOut(p)} disabled={!windowOpen} className={"px-2 py-1 rounded text-xs "+(windowOpen?"bg-[#16213a] text-slate-200":"bg-[#16213a] text-slate-500")}>Loan out</button></td>
                </tr>
              ))}</tbody>
            </table>
          </Card>
        </div>
      )}
    </div>
  );
}

/* ----------------------------- free agents ----------------------------- */
function FreeAgents({G, commit, tShow}){
  const [q, setQ] = useState("");
  const [rq, setRq] = useState("");
  const [showRetired, setShowRetired] = useState(false);
  let fa = (G.freeAgents||[]).slice();
  if(q) fa = fa.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  fa.sort((a,b)=>b.ovr-a.ovr);
  const sign = p => { const r=signFreeAgent(G,p); if(r.ok){ commit(G); tShow(`Signed ${p.name}`); } else tShow(r.msg); };

  // Retired players — can be coaxed out of retirement (penalty: -3 OVR, 60% fitness, 1-yr contract)
  const unretire = p => {
    const sq = Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth).length;
    if(sq>=30) return tShow("Senior squad is full (30).");
    p.retired = false; p.ovr = Math.max(p.ovr-3, 40); p.fitness = 60; p.years = 1;
    p.salary = Math.max(wageFor(p)*0.7, 0.1); p.teamId = G.userTeamId; p.morale = 70;
    p.stats = emptyStats(); p.compStats = {}; p.form = 6.7;
    logMove(G, p, "unret", null, G.userTeamId, null);
    if(!p.career) p.career = emptyStats();
    if(!Array.isArray(p.history)) p.history = [];
    if(p.susp==null) p.susp = 0; if(p.ycCount==null) p.ycCount = 0;
    p.value = playerValue(p);
    G.players[p.id] = p;
    delete G.retired[p.id];
    logNews(G,"transfer",`🔙 ${p.name} comes out of retirement to join ${G.clubs[G.userTeamId].name}`, G.userTeamId);
    commit(G); tShow(`${p.name} comes out of retirement!`);
  };

  let retired = Object.values(G.retired||{}).sort((a,b)=>b.retiredSeason-a.retiredSeason||b.ovr-a.ovr);
  if(rq) retired = retired.filter(p=>p.name.toLowerCase().includes(rq.toLowerCase()));

  return (
    <div className="space-y-3">
      <Card><div className="font-semibold">Free Agents</div><div className="text-sm text-slate-400">Out-of-contract players. No fee — you only pay wages.</div></Card>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search free agents…" className="w-full bg-[#16213a] rounded px-3 py-2 text-sm" />
      <Card className="p-0 overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]"><th className="text-left p-2">Player</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Age</th><th className="p-2">Wage</th><th className="p-2"></th></tr></thead>
          <tbody>
            {fa.slice(0,120).map(p=>(
              <tr key={p.id} className="border-b border-[#15203a]">
                <td className="p-2 text-left"><PName p={p} className="font-medium" /></td>
                <td className="p-2 text-center"><PosTag p={p} /></td>
                <td className="p-2 text-center"><ScoutOvrPill p={p} /></td>
                <td className="p-2 text-center tnum">{p.age}</td>
                <td className="p-2 text-center tnum">{money(wageFor(p))}</td>
                <td className="p-2 text-center"><button onClick={()=>sign(p)} className="px-2 py-1 rounded bg-emerald-500 text-slate-900 text-xs font-semibold">Sign</button></td>
              </tr>
            ))}
            {!fa.length && <tr><td colSpan="6" className="p-4 text-center text-slate-500">No free agents available.</td></tr>}
          </tbody>
        </table>
      </Card>

      {/* Retired Players */}
      <button onClick={()=>setShowRetired(v=>!v)} className="w-full text-left px-3 py-2 bg-[#16213a] rounded text-sm font-semibold flex items-center justify-between">
        <span>🏅 Retired Players ({Object.keys(G.retired||{}).length})</span>
        <span className="text-slate-400 text-xs">{showRetired?"▲ hide":"▼ show"}</span>
      </button>
      {showRetired && (
        <div className="space-y-2">
          <div className="text-xs text-slate-400 px-1">Players who have retired. You can convince someone to come out of retirement — they'll take a -3 OVR hit and arrive at 60% fitness on a 1-year deal.</div>
          <input value={rq} onChange={e=>setRq(e.target.value)} placeholder="Search retired players…" className="w-full bg-[#16213a] rounded px-3 py-2 text-sm" />
          <Card className="p-0 overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]"><th className="text-left p-2">Player</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Age</th><th className="p-2">Retired</th><th className="p-2"></th></tr></thead>
              <tbody>
                {retired.slice(0,200).map(p=>(
                  <tr key={p.id} className="border-b border-[#15203a]">
                    <td className="p-2 text-left"><PName p={p} className="font-medium" /></td>
                    <td className="p-2 text-center"><PosTag p={p} /></td>
                    <td className="p-2 text-center text-slate-300">{p.ovr}</td>
                    <td className="p-2 text-center tnum">{p.retiredAge||p.age}</td>
                    <td className="p-2 text-center text-slate-500 text-xs">S{p.retiredSeason}</td>
                    <td className="p-2 text-center"><button onClick={()=>unretire(p)} className="px-2 py-1 rounded bg-amber-500 text-slate-900 text-xs font-semibold">Unmotivate</button></td>
                  </tr>
                ))}
                {!retired.length && <tr><td colSpan="6" className="p-4 text-center text-slate-500">No retired players yet.</td></tr>}
              </tbody>
            </table>
