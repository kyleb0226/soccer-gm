<script type="text/babel-src" id="app-src">
const { useState, useEffect, useRef, useMemo } = React;
// Global "open this player's full card" handler, provided at App root so a player's
// name is clickable ANYWHERE (squad, leaders, transfers, fixtures, ...).
const PlayerCtx = React.createContext(null);

/* =========================================================================
   POCKET GM — SOCCER   (single-file React)
   Full football-manager suite: squad, formations (multi-position players!),
   double round-robin league sim across two divisions with promotion &
   relegation, a domestic knockout cup, stat leaders, finances/contracts,
   the transfer market + free agency, a youth academy, season awards, a
   hall of fame, and a multi-season franchise loop. Fictional clubs/players.
   ========================================================================= */

/* ----------------------------- RNG / utils ----------------------------- */
let _rng = Math.random;
function setRng(fn){ _rng = fn || Math.random; }
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rint = (a, b) => Math.floor(_rng() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(_rng() * arr.length)];
const chance = p => _rng() < p;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const round = Math.round;
function gauss(mean, sd){
  let u = 0, v = 0;
  while (u === 0) u = _rng();
  while (v === 0) v = _rng();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const rateGauss = (mean, sd) => clamp(round(gauss(mean, sd)), 20, 99);
const n01 = r => clamp((r - 20) / 79, 0, 1);   // normalize 20..99 -> 0..1
const money = m => (Math.abs(m) >= 1 ? "£" + m.toFixed(1) + "M" : "£" + round(m * 1000) + "K");
function wpick(arr, wfn){
  let tot = 0; arr.forEach(x => tot += Math.max(0, wfn(x)));
  if(tot <= 0) return arr.length ? pick(arr) : null;
  let r = _rng() * tot;
  for(const x of arr){ const w = Math.max(0, wfn(x)); if(r < w) return x; r -= w; }
  return arr[arr.length-1];
}
function poisson(lambda){
  lambda = clamp(lambda, 0.02, 8);
  const L = Math.exp(-lambda); let k = 0, p = 1;
  do { k++; p *= _rng(); } while(p > L);
  return k - 1;
}
// Player-id generator. Resets to 1 each page load, but ids persist in the save; after
// loading we MUST resume past the highest existing id (uid.atLeast in migrate) or newly
// generated players (youth, FA fill) reuse low ids and overwrite existing players.
const uid = (() => { let i = 1; const f = () => i++; f.atLeast = n => { if(Number.isFinite(n) && n >= i) i = n + 1; }; return f; })();

/* ----------------------------- name pools ------------------------------ */
const FIRST = ["Jack","Harry","Mason","Leo","Oliver","Diego","Carlos","Mateo","Luca","Andre","Marco","Kai","Liam","Noah","Ethan","Hugo","Felix","Omar","Yusuf","Malik","Rafael","Pedro","Bruno","Joao","Nico","Sergio","Pablo","Lorenzo","Matteo","Adam","Reece","Callum","Dylan","Connor","Ryan","Tyler","Aaron","Cole","Owen","Finn","Theo","Isaac","Elias","Gabriel","Samuel","Julian","Sebastian","Adrian","Ivan","Viktor","Lukas","Tomas","Stefan","Mathis","Enzo","Karim","Idris","Tariq","Amir","Kofi","Kwame","Sol","Ezra","Reuben","Jude","Phil","Bukayo","Declan","Mohammed","Hakim","Sami","Anton","Dmitri","Pavel","Milan","Luka","Marko","Ante","Goran","Niko","Henrik","Erik","Bjorn","Sven","Lars","Mika","Aleksi","Jonas","Pierre","Olivier","Cedric","Bastien","Remy","Thiago","Vinicius","Gustavo","Caio","Rodrigo","Santiago","Cristian","Maxim","Daniel","Victor","Marcus","Anders","Jamal","Kylian","Ousmane","Riyad","Nabil","Youssef"];
const LAST = ["Walker","Brooks","Hayes","Bennett","Foster","Carter","Reyes","Diaz","Lopez","Ortega","Vargas","Santos","Silva","Costa","Fernandes","Pereira","Oliveira","Ribeiro","Almeida","Carvalho","Rossi","Bianchi","Romano","Greco","Conti","Moretti","Muller","Schmidt","Fischer","Weber","Wagner","Becker","Hoffmann","Schulz","Koch","Bauer","Klein","Wolf","Neumann","Dubois","Laurent","Moreau","Lefebvre","Garcia","Martinez","Rodriguez","Gonzalez","Hernandez","Perez","Sanchez","Ramirez","Torres","Flores","Rivera","Gomez","Ruiz","Alvarez","Castillo","Ibrahimovic","Larsson","Eriksson","Andersson","Nilsson","Hansen","Pedersen","Berg","Lindqvist","Virtanen","Korhonen","Novak","Horvat","Kovac","Petrov","Ivanov","Popov","Sokolov","Volkov","Kuznetsov","Mensah","Owusu","Boateng","Diop","Traore","Kone","Toure","Cisse","Ndiaye","Bah","Okafor","Adeyemi","Eze","Saka","Rashford","Sterling","Kane","Foden","Mount","Grealish","Bellingham","Rice","Sancho","Maguire","Stones","Trippier","Pickford","Henderson","Alexander","Wan","Gallagher","Palmer","Watkins","Toney","Maddison","Bowen","Ramsdale"];
const genName = () => pick(FIRST) + " " + pick(LAST);

/* ----------------------------- positions ------------------------------- */
// Canonical positions used in formations and player generation.
const ALL_POS = ["GK","RB","CB","LB","RWB","LWB","CDM","CM","CAM","RM","LM","RW","LW","ST"];
const GROUP = pos => pos==="GK" ? "GK"
  : ["RB","CB","LB","RWB","LWB"].includes(pos) ? "DEF"
  : ["CDM","CM","CAM","RM","LM"].includes(pos) ? "MID" : "ATT";
// Vertical band on the pitch (0 = goal line .. 5 = attack), used for the pitch
// diagram AND for the out-of-position penalty (same band = small penalty).
const BAND = { GK:0, RB:1, CB:1, LB:1, RWB:1, LWB:1, CDM:2, CM:3, RM:3, LM:3, CAM:4, RW:5, LW:5, ST:5 };

// Per-position OVR weights over the six outfield attributes + gk. Each sums ~1.0.
const POS_W = {
  GK:  {gk:.70, phy:.14, pas:.16},
  CB:  {def:.46, phy:.24, pas:.12, pac:.13, dri:.05},
  RB:  {def:.34, pac:.22, phy:.14, pas:.16, dri:.14},
  LB:  {def:.34, pac:.22, phy:.14, pas:.16, dri:.14},
  RWB: {def:.30, pac:.24, phy:.13, pas:.17, dri:.16},
  LWB: {def:.30, pac:.24, phy:.13, pas:.17, dri:.16},
  CDM: {def:.34, pas:.26, phy:.20, dri:.12, sho:.08},
  CM:  {pas:.30, dri:.20, def:.18, phy:.14, sho:.18},
  CAM: {pas:.28, dri:.26, sho:.24, pac:.12, phy:.10},
  RM:  {pac:.24, dri:.26, pas:.20, sho:.18, phy:.12},
  LM:  {pac:.24, dri:.26, pas:.20, sho:.18, phy:.12},
  RW:  {pac:.26, dri:.27, sho:.22, pas:.15, phy:.10},
  LW:  {pac:.26, dri:.27, sho:.22, pas:.15, phy:.10},
  ST:  {sho:.38, pac:.22, dri:.18, phy:.14, pas:.08},
};
// Attribute tilts (added to a base mean) so a generated player's raw attributes suit
// his position (a striker shoots, a centre-back defends, a keeper has 'keeping').
const POS_TILT = {
  GK:  {pac:-18, sho:-26, pas:-2, dri:-12, def:-10, phy:6,  gk:20},
  CB:  {pac:-6,  sho:-18, pas:-6, dri:-12, def:18,  phy:12, gk:-30},
  RB:  {pac:8,   sho:-10, pas:2,  dri:2,   def:8,   phy:2,  gk:-30},
  LB:  {pac:8,   sho:-10, pas:2,  dri:2,   def:8,   phy:2,  gk:-30},
  RWB: {pac:12,  sho:-6,  pas:4,  dri:6,   def:4,   phy:0,  gk:-30},
  LWB: {pac:12,  sho:-6,  pas:4,  dri:6,   def:4,   phy:0,  gk:-30},
  CDM: {pac:-2,  sho:-6,  pas:6,  dri:0,   def:12,  phy:10, gk:-30},
  CM:  {pac:2,   sho:2,   pas:10, dri:6,   def:2,   phy:4,  gk:-30},
  CAM: {pac:4,   sho:8,   pas:10, dri:10,  def:-8,  phy:-2, gk:-30},
  RM:  {pac:12,  sho:4,   pas:6,  dri:10,  def:-4,  phy:-2, gk:-30},
  LM:  {pac:12,  sho:4,   pas:6,  dri:10,  def:-4,  phy:-2, gk:-30},
  RW:  {pac:14,  sho:8,   pas:4,  dri:12,  def:-10, phy:-4, gk:-30},
  LW:  {pac:14,  sho:8,   pas:4,  dri:12,  def:-10, phy:-4, gk:-30},
  ST:  {pac:10,  sho:18,  pas:-2, dri:8,   def:-14, phy:6,  gk:-30},
};
// Secondary-position eligibility graph — THE multi-position feature. A generated player
// gets his primary position plus 1–3 related secondaries he can also play, so many
// formations are viable (a RW who can fill RM/ST, a CB who covers RB/CDM, ...).
const POS_ADJ = {
  GK:["GK"],
  RB:["RB","RWB","CB","RM"], LB:["LB","LWB","CB","LM"],
  RWB:["RWB","RB","RM","RW"], LWB:["LWB","LB","LM","LW"],
  CB:["CB","RB","LB","CDM"],
  CDM:["CDM","CM","CB"], CM:["CM","CDM","CAM"],
  CAM:["CAM","CM","RW","LW","ST"],
  RM:["RM","RW","RWB","CM"], LM:["LM","LW","LWB","CM"],
  RW:["RW","RM","LW","ST","CAM"], LW:["LW","LM","RW","ST","CAM"],
  ST:["ST","CAM","RW","LW"],
};
function rollPositions(primary){
  const opts = (POS_ADJ[primary] || [primary]).filter(p => p !== primary);
  const set = [primary];
  if(primary !== "GK"){
    const k = chance(0.18) ? 0 : chance(0.55) ? 1 : chance(0.75) ? 2 : 3;
    for(let i=0;i<k && opts.length;i++){ const c = pick(opts); if(!set.includes(c)) set.push(c); }
  }
  return set;
}
// out-of-position penalty applied to a player's effective rating when fielded at `slot`.
function posPenalty(player, slot){
  if((player.positions||[player.pos]).includes(slot)) return 0;
  const pb = BAND[slot];
  const near = (player.positions||[player.pos]).some(p => Math.abs(BAND[p]-pb) <= 1);
  return near ? 7 : 16;
}
const posLabel = p => (p.positions && p.positions.length>1)
  ? p.positions[0] + " (" + p.positions.slice(1).join(",") + ")" : p.pos;

/* ----------------------------- formations ------------------------------ */
const FORMATIONS = {
  "4-4-2":          ["GK","RB","CB","CB","LB","RM","CM","CM","LM","ST","ST"],
  "4-3-3":          ["GK","RB","CB","CB","LB","CM","CM","CM","RW","ST","LW"],
  "4-3-3 (DM)":     ["GK","RB","CB","CB","LB","CDM","CM","CM","RW","ST","LW"],
  "4-2-3-1":        ["GK","RB","CB","CB","LB","CDM","CDM","RM","CAM","LM","ST"],
  "4-4-2 Diamond":  ["GK","RB","CB","CB","LB","CDM","CM","CM","CAM","ST","ST"],
  "4-5-1":          ["GK","RB","CB","CB","LB","RM","CM","CM","CM","LM","ST"],
  "3-5-2":          ["GK","CB","CB","CB","RWB","CM","CM","CM","LWB","ST","ST"],
  "3-4-3":          ["GK","CB","CB","CB","RM","CM","CM","LM","RW","ST","LW"],
  "5-3-2":          ["GK","RWB","CB","CB","CB","LWB","CM","CM","CM","ST","ST"],
};
const FORMATION_NAMES = Object.keys(FORMATIONS);
// Pitch coordinates (x,y in 0..100) for a formation, derived from each slot's band so the
// formation editor can draw a top-down pitch. y: GK near own goal (90) .. attack (14).
function pitchCoords(slots){
  const Y = {0:90, 1:72, 2:60, 3:46, 4:32, 5:16};
  const byBand = {};
  slots.forEach((pos,i)=>{ const b=BAND[pos]; (byBand[b]=byBand[b]||[]).push(i); });
  const xy = new Array(slots.length);
  Object.keys(byBand).forEach(b=>{
    const idxs = byBand[b]; const n = idxs.length;
    idxs.forEach((slotIdx,k)=>{
      const x = n===1 ? 50 : 12 + (76*k)/(n-1);
      xy[slotIdx] = { x, y: Y[b] };
    });
  });
  return xy;
}

/* ----------------------------- clubs ----------------------------------- */
// [city, nickname, abbr]. First 20 start in the Premier division, next 20 in the
// Championship (second tier). Promotion/relegation swaps clubs between them each year.
const TEAMS_PER_DIV = 20;
const NUM_DIVS = 2;
const CLUBS_PER_COUNTRY = TEAMS_PER_DIV * NUM_DIVS;   // 40
// The world: four footballing nations, each with a two-tier pyramid (top flight +
// second tier, 20 clubs each). Club names are generated deterministically from each
// country's city + suffix lists, so the splash can list them before a game exists.
const COUNTRIES = [
  { name:"Albion", flag:"🦁", divNames:["Premier League","Championship"],
    nicks:["United","City","Rovers","Athletic","FC","Wanderers","Albion","Town"],
    cities:["Kingsbridge","Harrowgate","Ashford","Blackmoor","Crownhill","Easton","Fenwick","Granville","Hollowell","Ironbridge","Jarrow","Kelvindale","Langmere","Marsden","Northwood","Oakvale","Pemberton","Ravenscar","Stonegate","Thornbury","Underwood","Valeford","Westcliff","Yarmouth","Aldermoor","Brackenhill","Carrowmore","Dunfield","Ellerby","Foxholme","Gosforth","Hartcliffe","Inglewood","Kestonbury","Lynmouth","Millbrook","Norbeck","Otterburn","Pinevale","Quarrydale"] },
  { name:"Iberia", flag:"🐂", divNames:["Primera Liga","Segunda"],
    nicks:["CF","Atlético","Real","Deportivo","Unión","Sporting","CD","Racing"],
    cities:["Alcazar","Bellamar","Castroreal","Duranta","Espinar","Fuendel","Granela","Huescar","Ibarreta","Jaravia","Lorquin","Maralba","Navedo","Olivar","Portela","Quesada","Robledo","Salbera","Toralba","Ventosa","Almazan","Briones","Cardena","Donalva","Estrela","Figuera","Gandul","Herrera","Illescas","Jumilla","Lebrija","Montoro","Niebla","Ondara","Pedroche","Requena","Sarine","Tordera","Utrera","Velez"] },
  { name:"Rhineland", flag:"🦅", divNames:["Bundesliga","2. Liga"],
    nicks:["SV","FC","Borussia","Eintracht","SC","VfB","Union","1.FC"],
    cities:["Adlersberg","Brandhof","Konigstadt","Drachenfels","Eisenburg","Falkenau","Grunwald","Hochberg","Immenstadt","Jagersee","Kaltenbach","Lindenau","Morgental","Nordheim","Oberfeld","Pforzen","Quellburg","Rheinau","Steinbach","Tannberg","Ulmenhof","Vogtland","Wartburg","Adlerhorst","Birkenau","Donaueck","Erlenbach","Fichtenau","Goldbach","Hugelheim","Isarstein","Karlsfeld","Lichtenau","Moosburg","Neustein","Ostertal","Reutberg","Sonnberg","Talheim","Waldkirch"] },
  { name:"Padania", flag:"🐺", divNames:["Serie A","Serie B"],
    nicks:["Calcio","AC","FC","US","Inter","Sporting","Pro","Nuova"],
    cities:["Monterosso","Valsanta","Castelmare","Borgovecchio","Rivalta","Sangiorgio","Belmonte","Corteluna","Daltavilla","Fiorenzo","Grottamare","Luccara","Marenzio","Norcello","Oltrera","Portovico","Quintano","Roccabruna","Saleruno","Terralba","Valverde","Albareto","Brentano","Caldera","Donnara","Empolino","Fontevia","Genzano","Imperola","Lavagno","Montalto","Novaria","Ortano","Pietrasanta","Riomaggio","Sestola","Trevisana","Urbiano","Vercella","Zenello"] },
];
const NUM_COUNTRIES = COUNTRIES.length;
// Build a country's 40 club definitions deterministically: [city, nick, abbr].
function buildCountryDefs(ci){
  const C = COUNTRIES[ci];
  const defs = [], used = new Set();
  for(let i=0;i<CLUBS_PER_COUNTRY;i++){
    const city = C.cities[i % C.cities.length];
    const nick = C.nicks[i % C.nicks.length];
    let abbr = city.slice(0,3).toUpperCase(), k=3;
    while(used.has(abbr) && k<city.length){ abbr = (city.slice(0,2)+city[k]).toUpperCase(); k++; }
    while(used.has(abbr)){ abbr = (city.slice(0,2)+(i%10)).toUpperCase(); k++; if(k>40) break; }
    used.add(abbr);
    defs.push([city, nick, abbr]);
  }
  return defs;
}
// Flat list of all 160 clubs; global club id == index here. Country = floor(id/40),
// local index within country < 20 => top flight (div 0), else second tier (div 1).
const ALL_CLUB_DEFS = [].concat(...COUNTRIES.map((_,ci)=>buildCountryDefs(ci)));
const countryOfIdx = id => Math.floor(id / CLUBS_PER_COUNTRY);
const localIdx = id => id % CLUBS_PER_COUNTRY;
const divOfIdx = id => localIdx(id) < TEAMS_PER_DIV ? 0 : 1;
// Per-country division name, e.g. divName(0,0) -> "Premier League".
function divName(country, div){ return (COUNTRIES[country]||COUNTRIES[0]).divNames[div]; }
// Back-compat for older single-country references.
const DIV_NAMES = COUNTRIES[0].divNames;

/* ----------------------------- player gen ------------------------------ */
function emptyStats(){ return { App:0, Min:0, G:0, A:0, CS:0, YC:0, RC:0, MOTM:0, ratingSum:0, ratingN:0, SH:0, SOT:0, KP:0, xG:0, Sv:0 }; }
function avgRating(s){ return s && s.ratingN ? s.ratingSum/s.ratingN : 0; }
// A WAR-style "Rating Value": one number for a player's total contribution this run.
// Goals/assists/clean sheets/saves weighted, scaled by minutes and rating over baseline.
function ratingValue(s){
  if(!s || !s.App) return 0;
  const perf = (avgRating(s) - 6.5) * (s.Min/90) * 0.22;
  const out = (s.G||0)*0.42 + (s.A||0)*0.26 + (s.CS||0)*0.12 + (s.Sv||0)*0.015 + (s.KP||0)*0.01;
  return +(perf + out).toFixed(1);
}
function computeOvr(p){
  const w = POS_W[p.pos] || POS_W.CM;
  let s = 0; for(const k in w) s += w[k] * (p[k]||0);
  p.ovr = clamp(round(s), 20, 99);
  return p.ovr;
}
function setPotential(p){
  const room = clamp(round((25 - p.age) * 1.7 + gauss(2,4)), -4, 26);
  p.pot = clamp(p.ovr + Math.max(0, room), p.ovr, 99);
  if(p.age <= 20 && chance(0.05)) p.pot = clamp(p.pot + rint(12,26), p.ovr, 99);   // rare wonderkid
}
// wage (£M/yr) and transfer value (£M) from ability, age and contract.
function wageFor(p){
  let s = Math.pow(Math.max(0, p.ovr-40)/59, 2.1) * 22;
  if(p.age < 23) s *= 0.5; else if(p.age < 27) s *= 0.82;
  return clamp(round(s*10)/10, 0.2, 30);
}
// What a player demands per year to re-sign: his market wage, plus an ambition
// premium for young talent with headroom, plus a form premium from last season.
function wageDemand(p){
  let s = wageFor(p);
  const room = (p.pot||p.ovr) - p.ovr;
  if(p.age<=24 && room>4) s *= 1.15;                  // wonderkid ambition
  const st = p.stats, app = (st && st.App) || 0;
  if(app>=8){                                         // reward a strong campaign
    const perG = (st.G + 0.5*st.A) / app;
    s *= clamp(1 + perG*0.30 + (avgRating(st)-6.6)*0.10, 0.85, 1.7);
  }
  return clamp(round(s*10)/10, 0.2, 40);
}
function abilityValue(o){ return Math.pow(Math.max(0, o-35)/45, 2.6) * 90; }
function playerValue(p){
  const pot = p.pot || p.ovr;
  const youth = clamp((27 - p.age) / 12, 0, 1);
  const projOvr = p.ovr + (pot - p.ovr) * youth;
  const cur = abilityValue(p.ovr), fut = abilityValue(projOvr);
  const w = 0.30 + 0.50 * youth;
  let v = cur * (1 - w) + fut * w;
  if(p.age >= 30) v *= clamp(1 - (p.age - 29) * 0.07, 0.35, 1);
  return Math.max(0.2, round(v*10)/10);
}
function makePlayer(pos, ageRange, meanAdj=0){
  const age = rint(ageRange[0], ageRange[1]);
  const tilt = POS_TILT[pos] || POS_TILT.CM;
  const base = 52 + meanAdj;
  const p = {
    id: uid(), name: genName(), age, pos, positions: rollPositions(pos), isGK: pos==="GK",
    foot: chance(0.75) ? "R" : (chance(0.85) ? "L" : "B"), num: rint(1,40),
    pac: rateGauss(base+tilt.pac,11), sho: rateGauss(base+tilt.sho,12),
    pas: rateGauss(base+tilt.pas,11), dri: rateGauss(base+tilt.dri,11),
    def: rateGauss(base+tilt.def,12), phy: rateGauss(base+tilt.phy,11),
    gk:  rateGauss(base+tilt.gk,12),
    stats: emptyStats(), career: emptyStats(), history: [],
  };
  // ~7% of players are standouts — a fat top end so elite talent stands apart
  if(chance(0.07)){
    const b = rint(7,16);
    ["pac","sho","pas","dri","def","phy","gk"].forEach(k=>{
      const wt = (POS_W[pos]||{})[k] || 0;
      if(wt > 0.10) p[k] = clamp(p[k] + b, 20, 99);
    });
  }
  computeOvr(p); setPotential(p); p.peakOvr = p.ovr;
  p.salary = wageFor(p); p.years = rint(1,4); p.value = playerValue(p);
  return p;
}

/* ----------------------------- league gen ------------------------------ */
const STADIUM_NAMES = ["Riverside","Highbury Park","The Den","Elm Road","Victoria Park","Stonebridge","Old Mill Ground","Kingsmeadow","Fortress Park","Saxon Field","The Crucible","Moorland Stadium","Tunstall Park","Greenfield","Castle Road","Harbour End","Abbey Stadium","Brookvale","Sandhill Park","Penrose Ground","Whitmore Park","Cathedral Ground","Eastlands","The Vale","Brightside Park","Lowfields","Mariners Park","Cliffe End","Ashwood Stadium","Foundry Park","Northgate","Belmont Ground","Carrow End","Deepdale Park","Goldstone Ground","Hillsborough Park","Loftus Field","Maine Ground","New Den","Priory Park"];
function makeClub(def, idx, div, country){
  const [city, nick, abbr] = def;
  return {
    id: idx, city, nick, abbr, name: city + " " + nick, div, country,
    stadium: STADIUM_NAMES[idx % STADIUM_NAMES.length], capacity: rint(18,62)*1000,
    pld:0, w:0, d:0, l:0, gf:0, ga:0, pts:0,
    budget: rint(20,140) + (div===0?60:0), formation: "4-3-3", xi: [], bench: [],
    academy: { level: 1 }, history: [], honours: [],
    userControlled: false,
  };
}
function buildSquad(clubId, div){
  const players = [];
  const meanAdj = div===0 ? 0 : -8;   // second-tier clubs are a notch weaker
  // a balanced senior squad: 3 GK, 7 DEF, 8 MID, 5 ATT = 23
  const plan = ["GK","GK","GK","RB","LB","CB","CB","CB","RWB","LWB",
    "CDM","CM","CM","CAM","RM","LM","CM","RW","LW","ST","ST","CAM","RW"];
  plan.forEach(pos => { const ageR = chance(0.25)?[18,22]:[22,33]; players.push(makePlayer(pos, ageR, meanAdj)); });
  players.forEach(p => p.teamId = clubId);
  return players;
}
function generateLeague(userTeamId, opts={}){
  const { seed=null } = opts;
  if(seed!=null && !Number.isNaN(seed)) setRng(mulberry32(seed >>> 0));
  const clubs = ALL_CLUB_DEFS.map((d,i)=>makeClub(d, i, divOfIdx(i), countryOfIdx(i)));
  clubs[userTeamId].userControlled = true;
  const players = {};
  clubs.forEach(c => buildSquad(c.id, c.div).forEach(p => players[p.id] = p));
  clubs.forEach(c => autoPickXI(c, players));
  setRng(null);
  return { clubs, players };
}

/* ----------------------------- schedule -------------------------------- */
// Double round-robin per division via the circle method: 20 teams -> 38 rounds.
// Returns rounds[]; each round = array of {home, away, div, played, hs, as}.
function divRounds(clubIds){
  const ids = clubIds.slice();
  if(ids.length % 2) ids.push(null);
  const n = ids.length, half = n/2;
  const fixed = ids[0]; let rot = ids.slice(1);
  const firstLeg = [];
  for(let r=0;r<n-1;r++){
    const row = rot.slice(); const arr = [fixed].concat(row);
    const games = [];
    for(let i=0;i<half;i++){
      const a = arr[i], b = arr[n-1-i];
      if(a==null || b==null) continue;
      // alternate home/away by round for balance
      games.push(r%2===0 ? {home:a, away:b} : {home:b, away:a});
    }
    firstLeg.push(games);
    rot = [rot[rot.length-1]].concat(rot.slice(0, rot.length-1));   // rotate
  }
  // second leg = reverse fixtures
  const secondLeg = firstLeg.map(games => games.map(g => ({home:g.away, away:g.home})));
  return firstLeg.concat(secondLeg);
}
function buildSchedule(clubs){
  // Each of the (countries x divisions) leagues plays its own double round-robin;
  // all leagues share the same 38 matchdays, merged into one round per matchday.
  const leagues = {};   // key country*10+div -> [clubIds]
  clubs.forEach(c => { const k=c.country*10+c.div; (leagues[k]=leagues[k]||[]).push(c.id); });
  const rounds = [];
  Object.keys(leagues).forEach(k=>{
    const country = Math.floor(k/10), div = k%10;
    const lr = divRounds(leagues[k]);
    lr.forEach((games, i)=>{
      const r = rounds[i] || (rounds[i]=[]);
      games.forEach(g => r.push({ home:g.home, away:g.away, div, country, played:false, hs:0, as:0 }));
    });
  });
  return rounds;
}

/* ----------------------------- match sim ------------------------------- */
// Effective rating of player `p` if fielded at formation `slot`.
function effRating(p, slot){ return Math.max(20, p.ovr - posPenalty(p, slot)); }
// Three unit ratings (DEF / MID / ATT) for a club's current XI, 20..99-ish.
// The XI a club actually fields: its chosen XI with injured/suspended players
// auto-replaced by the best available squad member for that slot (so a club is
// never short and never fields an unavailable player).
function fieldedXI(club, players){
  const slots = FORMATIONS[club.formation] || FORMATIONS["4-3-3"];
  const xi = club.xi || [];
  const used = new Set();
  const subs = Object.values(players).filter(p=>p.teamId===club.id && isAvailable(p));
  const out = [];
  slots.forEach((slot,i)=>{
    let p = players[xi[i]];
    if(!p || !isAvailable(p) || used.has(p.id)){
      const pool = subs.filter(q=>!used.has(q.id));
      const naturals = pool.filter(q=>(q.positions||[q.pos]).includes(slot));
      p = (naturals.length ? naturals.sort((a,b)=>b.ovr-a.ovr)
                           : pool.sort((a,b)=>effRating(b,slot)-effRating(a,slot)))[0];
    }
    if(p){ used.add(p.id); out.push({ p, slot }); }
  });
  return out;
}
function unitRatings(club, players){
  const xi = fieldedXI(club, players);
  let dS=0,dN=0, mS=0,mN=0, aS=0,aN=0, gk=50;
  xi.forEach(({p,slot})=>{
    const er = effRating(p, slot), b = BAND[slot];
    if(slot==="GK"){ gk = p.gk; return; }
    if(b<=2){ dS+=er; dN++; }
    else if(b===3){ mS+=er; mN++; }
    else { aS+=er; aN++; }
    if(b===2){ mS+=er*0.5; mN+=0.5; }   // DMs help midfield too
  });
  const DEF = (dN? dS/dN : 50)*0.7 + gk*0.3;
  const MID = mN? mS/mN : 50;
  const ATT = aN? aS/aN : 50;
  return { DEF, MID, ATT, gk };
}
function clubStrength(club, players){
  const u = unitRatings(club, players);
  return round(0.34*u.DEF + 0.33*u.MID + 0.33*u.ATT);
}
const TACTIC_MOD = {
  attacking: { xgFor:1.16, xgAgainst:1.12 },
  balanced:  { xgFor:1.0,  xgAgainst:1.0 },
  defensive: { xgFor:0.86, xgAgainst:0.83 },
};
// Simulate one match. Mutates player season stats + both clubs' table rows.
// Returns a box-score object (used to show the user's match in detail).
function simMatch(home, away, players, opts={}){
  const neutral = !!opts.neutral;
  const uH = unitRatings(home, players), uA = unitRatings(away, players);
  const hAtt = (0.55*n01(uH.ATT) + 0.30*n01(uH.MID) + 0.15*n01(uH.DEF));
  const hDef = (0.55*n01(uH.DEF) + 0.30*n01(uH.MID) + 0.15*n01(uH.ATT));
  const aAtt = (0.55*n01(uA.ATT) + 0.30*n01(uA.MID) + 0.15*n01(uA.DEF));
  const aDef = (0.55*n01(uA.DEF) + 0.30*n01(uA.MID) + 0.15*n01(uA.ATT));
  const tH = TACTIC_MOD[home.tactic||"balanced"], tA = TACTIC_MOD[away.tactic||"balanced"];
  const homeAdv = neutral ? 1 : 1.12, awayAdv = neutral ? 1 : 0.92;
  let xgH = clamp(1.32 * Math.exp(1.7*(hAtt - aDef)) * tH.xgFor * tA.xgAgainst * homeAdv, 0.15, 5.5);
  let xgA = clamp(1.32 * Math.exp(1.7*(aAtt - hDef)) * tA.xgFor * tH.xgAgainst * awayAdv, 0.15, 5.5);
  let hs = poisson(xgH), as = poisson(xgA);
  if(opts.mustDecide && hs===as){ if(chance(clamp(0.5+(clubStrength(home,players)-clubStrength(away,players))/40,0.1,0.9))) hs++; else as++; }
  // match stats: possession (midfield share), shots & shots-on-target (from xG)
  const possH = clamp(round(50 + (n01(uH.MID)-n01(uA.MID))*45 + (neutral?0:2)), 28, 72);
  const shH = clamp(round(xgH/0.11 + gauss(0,1.4)), hs, 32);
  const shA = clamp(round(xgA/0.11 + gauss(0,1.4)), as, 32);
  const sotH = clamp(round(shH*(0.30+0.12*n01(uH.ATT))), hs, shH);
  const sotA = clamp(round(shA*(0.30+0.12*n01(uA.ATT))), as, shA);
  const box = { home, away, hs, as, hScorers:[], aScorers:[], hRatings:[], aRatings:[], neutral,
    stat:{ possH, possA:100-possH, shH, shA, sotH, sotA, xgH:+xgH.toFixed(2), xgA:+xgA.toFixed(2) }, timeline:[] };
  applyMatch(home, away, hs, as, players, box, opts);
  return box;
}
function lineupOf(club, players){ return fieldedXI(club, players); }
// attacking weight of a slot (who tends to score) and creative weight (who assists)
const SCORE_W = { GK:0, RB:0.6, LB:0.6, CB:0.7, RWB:0.9, LWB:0.9, CDM:1.0, CM:2.2, CAM:4.5, RM:3.2, LM:3.2, RW:5.5, LW:5.5, ST:9 };
const CREATE_W = { GK:0, RB:1.2, LB:1.2, CB:0.4, RWB:2.0, LWB:2.0, CDM:1.4, CM:3.2, CAM:5.0, RM:4.2, LM:4.2, RW:4.5, LW:4.5, ST:2.2 };
function applyMatch(home, away, hs, as, players, box, opts){
  const isCup = !!opts.cup;
  const G = opts.G;
  const st = box.stat || {};
  const H = lineupOf(home, players), A = lineupOf(away, players);
  // appearances + minutes for everyone who started (90'); a couple of bench cameos
  function credit(side, club){
    side.forEach(({p})=>{ p.stats.App++; p.stats.Min += 90; });
    const bench = (club.bench||[]).map(id=>players[id]).filter(p=>p && isAvailable(p));
    bench.slice(0,3).forEach(p=>{ if(chance(0.5)){ p.stats.App++; p.stats.Min += rint(8,30); } });
  }
  credit(H, home); credit(A, away);
  // distribute goals to scorers + assisters
  function awardGoals(side, n){
    const out = [];
    for(let i=0;i<n;i++){
      const sc = wpick(side, o => (SCORE_W[o.slot]||0) * (0.5 + n01(o.p.sho)));
      if(!sc) continue;
      sc.p.stats.G++;
      const min = rint(1,90);
      let assistName = null, assistId = null;
      if(chance(0.72)){
        const cands = side.filter(o => o !== sc);
        const as2 = wpick(cands, o => (CREATE_W[o.slot]||0) * (0.5 + n01(o.p.pas*0.6 + o.p.dri*0.4)));
        if(as2){ as2.p.stats.A++; as2.p.stats.KP++; assistName = as2.p.name; assistId = as2.p.id; }
      }
      out.push({ name: sc.p.name, id: sc.p.id, min, assist: assistName, assistId });
    }
    out.sort((a,b)=>a.min-b.min);
    return out;
  }
  box.hScorers = awardGoals(H, hs);
  box.aScorers = awardGoals(A, as);
  // distribute shots / shots-on-target / xG to attackers, and key passes to creators
  function spread(side, shots, sot, xg){
    for(let i=0;i<shots;i++){
      const o = wpick(side, q => (SCORE_W[q.slot]||0) * (0.5 + n01(q.p.sho)));
      if(!o) continue;
      o.p.stats.SH++;
      if(i < sot) o.p.stats.SOT++;
      o.p.stats.xG += +(xg/Math.max(1,shots)).toFixed(2);
    }
    const kp = Math.max(0, round(shots*0.55) - 0);   // chances created beyond assists
    for(let i=0;i<kp;i++){ const o = wpick(side, q => (CREATE_W[q.slot]||0) * (0.5 + n01(q.p.pas))); if(o) o.p.stats.KP++; }
  }
  spread(H, st.shH||hs, st.sotH||hs, st.xgH||hs);
  spread(A, st.shA||as, st.sotA||as, st.xgA||as);
  // goalkeeper saves = shots on target faced minus goals conceded
  const gkOf = side => side.find(o=>o.slot==="GK");
  const gH = gkOf(H), gA = gkOf(A);
  if(gH) gH.p.stats.Sv += Math.max(0, (st.sotA||0) - as);
  if(gA) gA.p.stats.Sv += Math.max(0, (st.sotH||0) - hs);
  // clean sheets
  if(as===0) H.forEach(({p,slot})=>{ if(BAND[slot]<=2 || slot==="GK") p.stats.CS++; });
  if(hs===0) A.forEach(({p,slot})=>{ if(BAND[slot]<=2 || slot==="GK") p.stats.CS++; });
  // cards -> suspensions (yellows accumulate to a ban; red = multi-match ban)
  function card(p, slot){
    const yc = clamp(0.10 + (BAND[slot]<=2?0.06:0) - n01(p.phy)*0.04, 0.04, 0.22);
    if(chance(yc)){
      p.stats.YC++; p.ycCount = (p.ycCount||0) + 1;
      if(p.ycCount >= YC_BAN_THRESHOLD){ p.ycCount = 0; banPlayer(G, p, 1, "yellow-card accumulation"); }
    }
    if(chance(0.01)){ p.stats.RC++; const m = rint(2,3); injure(p, rint(2,4)); banPlayer(G, p, m, "a red card"); }
  }
  [H,A].forEach(side => side.forEach(({p,slot})=>card(p,slot)));
  // minute-by-minute timeline (used in the box score)
  const tl = [];
  let rh=0, ra=0;
  box.hScorers.concat(box.aScorers).slice()
    .sort((a,b)=>a.min-b.min)
    .forEach(g=>{
      const isHome = box.hScorers.includes(g);
      if(isHome) rh++; else ra++;
      tl.push({ min:g.min, side:isHome?"H":"A", name:g.name, assist:g.assist, hs:rh, as:ra });
    });
  box.timeline = tl;
  // ratings + man of the match (now nudged by territory: shots & possession edge)
  const res = hs>as?1 : hs<as?-1 : 0;
  function rate(side, scored, conceded, result, shotsFor, shotsAgainst, poss){
    let best=null, bestR=0;
    const terr = clamp((shotsFor-shotsAgainst)*0.015 + (poss-50)*0.004, -0.3, 0.3);
    side.forEach(({p,slot})=>{
      let r = 6.2 + (result>0?0.4:result<0?-0.3:0) + terr;
      r += 0.95 * countGoals(box, p.id);
      r += 0.55 * countAssists(box, p.id);
      if(slot==="GK") r += clamp((p.stats.Sv? Math.min(p.stats.Sv,6):0)*0.05, 0, 0.4);
      if(conceded===0 && (BAND[slot]<=2||slot==="GK")) r += 0.6;
      if(conceded>=3 && (BAND[slot]<=2||slot==="GK")) r -= 0.5;
      r = clamp(r + gauss(0, 0.35), 4.0, 10);
      p.stats.ratingSum += r; p.stats.ratingN++;
      if(r>bestR){ bestR=r; best=p; }
    });
    return best;
  }
  const motmH = rate(H, hs, as, res, st.shH||0, st.shA||0, st.possH||50);
  const motmA = rate(A, as, hs, -res, st.shA||0, st.shH||0, st.possA||50);
  const motm = (res>=0 ? motmH : motmA) || motmH || motmA;
  if(motm) motm.stats.MOTM++;
  box.motm = motm ? motm.name : null;
  // standings (cup matches don't affect the league table)
  if(!isCup){
    home.pld++; away.pld++; home.gf+=hs; home.ga+=as; away.gf+=as; away.ga+=hs;
    if(hs>as){ home.w++; home.pts+=3; away.l++; }
    else if(hs<as){ away.w++; away.pts+=3; home.l++; }
    else { home.d++; away.d++; home.pts++; away.pts++; }
  }
}
// Ban a player for N upcoming matches; news only for the user's club.
function banPlayer(G, p, matches, reason){
  p.susp = (p.susp||0) + matches;
  if(G && p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].userControlled){
    logNews(G, "susp", `🟥 ${p.name} suspended for ${p.susp} match${p.susp>1?"es":""} (${reason})`, p.teamId);
  }
}
function countGoals(box, id){ return box.hScorers.filter(s=>s.id===id).length + box.aScorers.filter(s=>s.id===id).length; }
function countAssists(box, id){ return box.hScorers.concat(box.aScorers).filter(s=>s.assistId===id).length; }

/* ----------------------------- injuries & bans ------------------------- */
function isInjured(p){ return !!(p && p.injury && p.injury.weeks > 0); }
function injure(p, weeks){ p.injury = { weeks, type: pick(["knock","hamstring","ankle","muscle strain"]) }; }
function isSuspended(p){ return !!(p && p.susp > 0); }
function isAvailable(p){ return p && !isInjured(p) && !isSuspended(p); }
const YC_BAN_THRESHOLD = 5;   // yellows accumulated -> a one-match ban
function maybeInjure(club, players, settings){
  if(settings && settings.injuries===false) return;
  const xi = (club.xi||[]).map(id=>players[id]).filter(Boolean);
  xi.forEach(p=>{ if(!isInjured(p) && chance(0.012)) injure(p, rint(1,6)); });
}

/* ----------------------------- XI selection ---------------------------- */
// Auto-pick the best available XI for a club's current formation, honoring each
// player's position eligibility (least penalty + highest rating wins each slot).
// Pick the best XI for a club's formation, strongly favouring players in a NATURAL
// position (avoiding out-of-position selections) and never fielding an outfielder in
// goal if a keeper is available.
function autoPickXI(club, players){
  const slots = FORMATIONS[club.formation] || FORMATIONS["4-3-3"];
  let squad = Object.values(players).filter(p => p.teamId===club.id && isAvailable(p));
  if(squad.length < 11) squad = Object.values(players).filter(p => p.teamId===club.id);   // emergency: ignore injuries/bans
  const used = new Set();
  const xi = new Array(slots.length).fill(null);
  const isKeeper = p => p.pos==="GK" || (p.positions||[]).includes("GK");
  const canPlay = (p, slot) => (p.positions||[p.pos]).includes(slot);
  const avail = () => squad.filter(p=>!used.has(p.id));

  // 1) Goalkeeper(s): only ever from actual keepers (best handling); outfielder only as last resort.
  slots.forEach((slot,i)=>{
    if(slot!=="GK") return;
    const keepers = avail().filter(isKeeper).sort((a,b)=>b.gk-a.gk);
    const pick = keepers[0] || avail().sort((a,b)=>effRating(b,slot)-effRating(a,slot))[0];
    if(pick){ used.add(pick.id); xi[i]=pick.id; }
  });

  // 2) Outfield slots filled scarcity-first (slots with the fewest natural candidates
  //    go first) so rare specialists land in their natural role before versatile players
  //    are used up. Each slot takes the best natural fit, else the best by effRating.
  const naturalCount = i => squad.filter(p=>!used.has(p.id) && canPlay(p, slots[i])).length;
  const outIdx = slots.map((s,i)=>i).filter(i=>slots[i]!=="GK").sort((a,b)=>naturalCount(a)-naturalCount(b));
  outIdx.forEach(i=>{
    const slot = slots[i], pool = avail();
    const naturals = pool.filter(p=>canPlay(p, slot));
    const pick = naturals.length ? naturals.sort((a,b)=>b.ovr-a.ovr)[0]
                                 : pool.sort((a,b)=>effRating(b,slot)-effRating(a,slot))[0];
    if(pick){ used.add(pick.id); xi[i]=pick.id; }
  });

  club.xi = xi.filter(x=>x!=null);
  // bench: a backup keeper first, then the best remaining outfielders
  const rest = squad.filter(p=>!used.has(p.id));
  const benchGK = rest.filter(isKeeper).sort((a,b)=>b.gk-a.gk)[0];
  const bench = [];
  if(benchGK) bench.push(benchGK.id);
  rest.filter(p=>!benchGK || p.id!==benchGK.id).sort((a,b)=>b.ovr-a.ovr).forEach(p=>{ if(bench.length<9) bench.push(p.id); });
  club.bench = bench;
}
function ensureXI(club, players){ if(!club.xi || club.xi.length<11) autoPickXI(club, players); }

/* ----------------------------- standings ------------------------------- */
// Standings for one league (a country's division). `country` defaults to country 0
// so any legacy single-arg callers still resolve to the original top nation.
function tableFor(G, div, country=0){
  return G.clubs.filter(c=>c.div===div && (c.country||0)===country).slice().sort((a,b)=>
    b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf || a.name.localeCompare(b.name));
}
function leaguePos(G, club){ return tableFor(G, club.div, club.country||0).findIndex(c=>c.id===club.id) + 1; }

/* ----------------------------- club honours ---------------------------- */
// A simple trophy record on each club: { season, type, label }. type is one of
// "league" | "cup" | "continental" | "promo" so a future trophy-cabinet UI can group them.
function addHonour(club, season, type, label){
  if(!club) return;
  if(!Array.isArray(club.honours)) club.honours = [];
  club.honours.push({ season, type, label });
}

/* ----------------------------- knockout core --------------------------- */
// Resolve one round of any single-leg knockout cup, in place. `order` lists the
// round names smallest-first (..., "SF", "Final"); the last entry plays neutral.
// Sets cup.winner (+ cup.runnerUp) once one club remains.
function playKnockoutRound(G, cup, order){
  if(!cup || cup.winner!=null) return;
  const ids = cup.alive.slice();
  const winners = [], ties = [];
  const isFinal = cup.round === order[order.length-1];
  for(let i=0;i<ids.length;i+=2){
    const a = G.clubs[ids[i]], b = G.clubs[ids[i+1]];
    if(!b){ winners.push(ids[i]); continue; }
    ensureXI(a, G.players); ensureXI(b, G.players);
    const box = simMatch(a, b, G.players, { cup:true, neutral: isFinal, mustDecide:true, G });
    const w = box.hs>=box.as ? a.id : b.id;   // mustDecide guarantees no draw
    winners.push(w);
    ties.push({ home:a.id, away:b.id, hs:box.hs, as:box.as, win:w });
  }
  cup.results[cup.round] = ties;
  cup.history.unshift({ round: cup.round, ties });
  if(winners.length===1){
    cup.winner = winners[0];
    const fin = ties[0];
    cup.runnerUp = fin ? (fin.win===fin.home ? fin.away : fin.home) : null;
    cup.alive = winners;
  } else {
    cup.alive = winners;
    cup.round = order[order.indexOf(cup.round)+1] || order[order.length-1];
  }
}

/* ----------------------------- domestic cups --------------------------- */
// One 32-team knockout PER COUNTRY: that nation's 20 top-flight clubs + its 12
// best second-tier clubs. Rounds resolve on set matchdays; a draw is decided by
// a strength coin-flip. G.cups is an array indexed by country.
const CUP_NAME = "National Cup";
const CUP_ORDER = ["R32","R16","QF","SF","Final"];
const CUP_MD = { 6:"R32", 13:"R16", 21:"QF", 29:"SF", 36:"Final" };
function cupName(country){ return (COUNTRIES[country]||COUNTRIES[0]).name + " Cup"; }
function initCountryCup(G, country){
  const top = G.clubs.filter(c=>c.country===country && c.div===0).map(c=>c.id);
  const second = G.clubs.filter(c=>c.country===country && c.div===1)
    .sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players)).slice(0,12).map(c=>c.id);
  let pool = top.concat(second);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(_rng()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return { country, alive: pool, round: "R32", history: [], winner: null, runnerUp: null, results: {} };
}
function initCups(G){ G.cups = COUNTRIES.map((_,ci)=>initCountryCup(G, ci)); }
function playCupRound(G){
  (G.cups||[]).forEach(cup=>{
    const wasOver = cup.winner!=null;
    playKnockoutRound(G, cup, CUP_ORDER);
    if(!wasOver && cup.winner!=null){
      const wc = G.clubs[cup.winner];
      logNews(G, "cup", `🏆 ${wc.name} win the ${cupName(cup.country)}!`, wc.id);
      addHonour(wc, G.season, "cup", `${cupName(cup.country)} winners`);
    }
  });
}
// The user's own national cup (for the Cup tab default).
function userCup(G){ const c=G.clubs[G.userTeamId]; return (G.cups||[]).find(x=>x.country===(c?c.country:0)) || (G.cups||[])[0]; }

/* ------------------------- continental champions cup ------------------- */
// A 16-team seeded knockout (R16 -> QF -> SF -> Final, neutral final) running
// alongside the leagues. Qualifiers: each country's top 3 by LAST season's finish
// PLUS a 4th "cup route" berth (national cup winner -> runner-up -> next finisher).
const CONT_CUP_NAME = "Continental Champions Cup";
const CONT_ORDER = ["QF","SF","Final"];   // knockout phase order (groups handled separately)
const CONT_MD = { 5:"G1", 11:"G2", 17:"G3", 24:"QF", 30:"SF", 36:"Final" };
// Rank one country's top-flight clubs by last completed season's finish (best first);
// newly promoted clubs (no top-flight history) and ties fall back to current strength.
function contRankCountry(G, country){
  const lastFinish = c => {
    const h = c.history || [];
    for(let i=h.length-1;i>=0;i--){ if(h[i].div===0) return h[i].pos; }
    return 999;
  };
  return G.clubs.filter(c=>c.country===country && c.div===0).slice().sort((a,b)=>{
    const fa=lastFinish(a), fb=lastFinish(b);
    if(fa!==fb) return fa-fb;
    return clubStrength(b,G.players)-clubStrength(a,G.players);
  });
}
// Four continental berths for one country: top 3 + cup route.
function countryContQualifiers(G, country){
  const ranked = contRankCountry(G, country);
  const top3 = ranked.slice(0,3).map(c=>c.id);
  let cupRoute = null;
  const cup = (G.cups||[]).find(x=>x.country===country);
  if(cup){
    if(cup.winner!=null && !top3.includes(cup.winner)) cupRoute = cup.winner;
    else if(cup.runnerUp!=null && !top3.includes(cup.runnerUp)) cupRoute = cup.runnerUp;
  }
  if(cupRoute==null){ const x = ranked.slice(3).find(c=>!top3.includes(c.id)); cupRoute = x?x.id:null; }
  const four = cupRoute!=null ? top3.concat([cupRoute]) : top3.slice();
  for(let i=3; four.length<4 && i<ranked.length; i++){ if(!four.includes(ranked[i].id)) four.push(ranked[i].id); }
  return { ids: four.slice(0,4), cupRoute };
}
// Standard 16-team seeding so the top seeds can only meet in later rounds.
function seedBracket16(pool){
  const order = [1,16,8,9,5,12,4,13,3,14,6,11,7,10,2,15];
  return order.map(s=>pool[s-1]).filter(x=>x!=null);
}
// Continental cup = GROUP STAGE → KNOCKOUT. Each nation sends 4 qualifiers; the 16 are drawn into
// 4 groups of 4 so every group has exactly ONE club from each country and one from each seeding pot.
// Single round-robin (3 matchdays); the top 2 of each group advance to an 8-team knockout (QF→Final).
const CONT_GROUP_FX = [ [[0,3],[1,2]], [[0,2],[3,1]], [[0,1],[2,3]] ];   // round-robin of 4
function initContCup(G){
  const perCountry = COUNTRIES.map((_,ci)=>countryContQualifiers(G, ci));   // {ids:[4 by rank], cupRoute}
  const nC = COUNTRIES.length;
  const cupRoutes=[]; perCountry.forEach(q=>{ if(q.cupRoute!=null) cupRoutes.push(q.cupRoute); });
  const seeds={}; perCountry.forEach(q=>q.ids.forEach((id,p)=>{ if(id!=null) seeds[id]=p+1; }));   // pot = rank
  const groups=[];
  for(let g=0; g<4; g++){
    const teams=[];
    for(let c=0;c<nC;c++){ const id = perCountry[c] && perCountry[c].ids[(c+g)%4]; if(id!=null) teams.push(id); }  // one per country + one per pot
    const table={}; teams.forEach(id=>table[id]={pld:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
    groups.push({ name:String.fromCharCode(65+g), teams, table, results:[] });
  }
  const qualifiers=[]; perCountry.forEach(q=>q.ids.forEach(id=>{ if(id!=null) qualifiers.push(id); }));
  G.contCup = { season:G.season, phase:"group", groupMd:0, round:"G1", groups,
    alive:[], results:{}, history:[], winner:null, runnerUp:null, seeds, qualifiers, cupRoutes };
}
function contGroupOrder(grp){
  return grp.teams.slice().sort((x,y)=>{ const A=grp.table[x], B=grp.table[y];
    return B.pts-A.pts || (B.gf-B.ga)-(A.gf-A.ga) || B.gf-A.gf; });
}
function playContGroupRound(G, cup){
  const md = cup.groupMd;
  cup.groups.forEach(grp=>{
    (CONT_GROUP_FX[md]||[]).forEach(([ai,bi])=>{
      const aId=grp.teams[ai], bId=grp.teams[bi]; if(aId==null||bId==null) return;
      const a=G.clubs[aId], b=G.clubs[bId];
      ensureXI(a,G.players); ensureXI(b,G.players);
      const box=simMatch(a,b,G.players,{cup:true, G});   // group games can draw
      const ta=grp.table[aId], tb=grp.table[bId];
      ta.pld++; tb.pld++; ta.gf+=box.hs; ta.ga+=box.as; tb.gf+=box.as; tb.ga+=box.hs;
      if(box.hs>box.as){ ta.w++; ta.pts+=3; tb.l++; }
      else if(box.hs<box.as){ tb.w++; tb.pts+=3; ta.l++; }
      else { ta.d++; tb.d++; ta.pts++; tb.pts++; }
      grp.results.push({ md, home:aId, away:bId, hs:box.hs, as:box.as });
    });
  });
}
function buildContKnockout(G, cup){
  const ord = cup.groups.map(contGroupOrder);
  const w = ord.map(o=>o[0]), r = ord.map(o=>o[1]);   // winners + runners-up [A,B,C,D]
  // QF: 1A-2B · 1C-2D · 1B-2A · 1D-2C (a group winner can't meet his own runner-up early)
  cup.alive = [ w[0],r[1], w[2],r[3], w[1],r[0], w[3],r[2] ].filter(x=>x!=null);
  cup.phase = "ko"; cup.round = "QF";
}
function playContCupRound(G){
  const cup=G.contCup; if(!cup || cup.winner!=null) return;
  if(cup.phase==="group"){
    playContGroupRound(G, cup);
    cup.groupMd++;
    if(cup.groupMd>=3) buildContKnockout(G, cup);
    else cup.round = "G"+(cup.groupMd+1);
  } else {
    playKnockoutRound(G, cup, CONT_ORDER);
  }
}

/* ----------------------------- sim loop -------------------------------- */
function simRound(G){
  if(G.phase!=="regular") return;
  const round = G.schedule[G.day]; if(!round) return;
  // tactic context for the user's club (its chosen formation/tactic already on the club)
  round.forEach(g=>{
    const home = G.clubs[g.home], away = G.clubs[g.away];
    ensureXI(home, G.players); ensureXI(away, G.players);
    const box = simMatch(home, away, G.players, { G });
    g.played = true; g.hs = box.hs; g.as = box.as;
    if(home.id===G.userTeamId || away.id===G.userTeamId){
      G.lastMatch = serializeBox(box, G);
      logNews(G, "match", `${home.abbr} ${box.hs}-${box.as} ${away.abbr}`, G.userTeamId);
    }
    maybeInjure(home, G.players, G.settings); maybeInjure(away, G.players, G.settings);
  });
  // injuries heal a week; league suspensions tick down one match
  Object.values(G.players).forEach(p=>{ if(isInjured(p)) p.injury.weeks--; if(isSuspended(p)) p.susp--; });
  // youth 5v5 game time (drives prospect development)
  accrueYouth(G);
  // domestic cup round (all national cups) on its matchday
  if(CUP_MD[G.day+1] && G.cups){ playCupRound(G); }
  // continental champions cup round on its matchday
  if(CONT_MD[G.day+1] && G.contCup && G.contCup.winner==null){
    playContCupRound(G);
    if(G.contCup.winner!=null){
      const wc=G.clubs[G.contCup.winner];
      logNews(G,"cup",`🏆 ${wc.name} are crowned champions of ${CONT_CUP_NAME}!`, wc.id);
      addHonour(wc, G.season, "continental", `${CONT_CUP_NAME} winners`);
      G.contChampions = G.contChampions || [];
      G.contChampions.unshift({ season:G.season, id:wc.id, abbr:wc.abbr });
    }
  }
  G.day++;
  if(G.day >= G.schedule.length){ G.phase = "offseason"; finalizeSeason(G); }
}
function serializeBox(box, G){
  return {
    season: G.season, day: G.day+1,
    home: box.home.abbr, away: box.away.abbr, homeName: box.home.name, awayName: box.away.name,
    hs: box.hs, as: box.as, neutral: box.neutral, cup: !!box.cup,
    hScorers: box.hScorers, aScorers: box.aScorers, motm: box.motm,
    stat: box.stat, timeline: box.timeline,
  };
}
// sim forward until the user's next league match is about to be played (or season end)
function simToNextUserMatch(G){
  let guard = 0;
  while(G.phase==="regular" && guard++ < 60){
    simRound(G);
    if(G.phase!=="regular") break;
    const next = G.schedule[G.day];
    if(next && next.some(g=>g.home===G.userTeamId || g.away===G.userTeamId)) break;
  }
}

/* ----------------------------- offseason ------------------------------- */
function finalizeSeason(G){
  // league champion of every country
  G.champions = G.champions || [];
  COUNTRIES.forEach((C,ci)=>{
    const champ = tableFor(G, 0, ci)[0];
    if(!champ) return;
    G.champions.unshift({ season:G.season, id:champ.id, abbr:champ.abbr, country:ci });
    logNews(G, "title", `🏆 ${champ.name} are champions of the ${divName(ci,0)}!`, champ.id);
    addHonour(G.clubs[champ.id], G.season, "league", `${divName(ci,0)} champions`);
  });
  computeAwards(G);
  G.phase = "offseason";
}
function computeAwards(G){
  // a per-country award set (top flight only)
  G.awardHistory = G.awardHistory || [];
  const entry = { season:G.season, countries: [] };
  COUNTRIES.forEach((C,ci)=>{
    const all = Object.values(G.players).filter(p=>p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].country===ci && G.clubs[p.teamId].div===0 && p.stats.App>=10);
    if(!all.length){ entry.countries.push({ country:ci, pots:null, boot:null, glove:null, young:null }); return; }
    const boot = all.slice().sort((a,b)=>b.stats.G-a.stats.G)[0];
    const glove = all.filter(p=>p.pos==="GK").sort((a,b)=>b.stats.CS-a.stats.CS)[0];
    const pots = all.slice().sort((a,b)=>(avgRating(b.stats)+b.stats.G*0.03+b.stats.A*0.02)-(avgRating(a.stats)+a.stats.G*0.03+a.stats.A*0.02))[0];
    const yng = all.filter(p=>p.age<=21).sort((a,b)=>avgRating(b.stats)-avgRating(a.stats))[0];
    entry.countries.push({ country:ci,
      pots: pots?{id:pots.id,name:pots.name,team:G.clubs[pots.teamId].abbr,r:+avgRating(pots.stats).toFixed(2)}:null,
      boot: boot?{id:boot.id,name:boot.name,team:G.clubs[boot.teamId].abbr,g:boot.stats.G}:null,
      glove: glove?{id:glove.id,name:glove.name,team:G.clubs[glove.teamId].abbr,cs:glove.stats.CS}:null,
      young: yng?{id:yng.id,name:yng.name,team:G.clubs[yng.teamId].abbr,r:+avgRating(yng.stats).toFixed(2)}:null });
    if(pots){ pots.awards=(pots.awards||0)+1; }
    if(boot){ boot.golden=(boot.golden||0)+1; }
  });
  G.awardHistory.unshift(entry);
}
// Roll the franchise into the next season: archive stats, age & develop players, expire
// contracts, promotion/relegation, youth intake, finances, fresh fixtures + cup.
function startNextSeason(G){
  returnLoans(G);   // loanees go back to their owners before aging/contracts
  // archive each player's season into history + career, then reset season stats
  Object.values(G.players).forEach(p=>{
    if(p.stats.App>0){
      p.history = p.history || [];
      p.history.push({ season:G.season, team: p.teamId!=null && G.clubs[p.teamId] ? G.clubs[p.teamId].abbr : "—",
        App:p.stats.App, G:p.stats.G, A:p.stats.A, CS:p.stats.CS, r:+avgRating(p.stats).toFixed(2) });
      if(p.history.length>30) p.history = p.history.slice(-30);
      for(const k in p.stats) p.career[k] = (p.career[k]||0) + p.stats[k];
    }
    p.stats = emptyStats();
    p.susp = 0; p.ycCount = 0;   // bans & yellow tallies clear each season
  });
  // record club season history + reset table
  G.clubs.forEach(c=>{
    c.history = c.history || [];
    c.history.push({ season:G.season, div:c.div, pos:leaguePos(G,c), w:c.w, d:c.d, l:c.l, gf:c.gf, ga:c.ga, pts:c.pts });
    if(c.history.length>40) c.history = c.history.slice(-40);
  });
  // age + develop everyone (rostered players AND the existing free-agent pool, once each —
  // do FAs here BEFORE expiries add new names so the just-released don't age twice)
  Object.values(G.players).forEach(p=>developPlayer(p));
  (G.freeAgents||[]).forEach(p=>developPlayer(p));
  hallOfFameCheck(G);
  // contracts: decrement, expiries become free agents
  G.freeAgents = G.freeAgents || [];
  Object.values(G.players).forEach(p=>{
    if(p.teamId==null) return;
    p.years = (p.years||1) - 1;
    const club = G.clubs[p.teamId];
    if(p.years<=0){
      // AI clubs re-sign most of their useful players (at the player's demand); the rest hit the market
      if(club && club.userControlled){ p.years=0; p.unhappy=true; }   // user must decide (renew in squad)
      else if(p.ovr>=58 && chance(0.78)){ p.years=rint(2,4); p.salary=wageDemand(p); p.unhappy=false; }
      else { releaseToFA(G, p); }
    } else if(p.years<=1 && club && club.userControlled && p.ovr>=60){
      p.unhappy=true;   // wants a new deal before running down (Bosman risk next year)
    } else { p.unhappy=false; }
  });
  // retirements (old, low-rated)
  Object.values(G.players).forEach(p=>{
    if(p.age>=34 && (p.ovr<62 || p.age>=39) && chance(p.age>=37?0.55:0.22)){
      if(p.teamId!=null){ logNews(G,"retire",`${p.name} (${p.pos}) retires at ${p.age}`, p.teamId); }
      delete G.players[p.id];
    }
  });
  // promotion / relegation WITHIN each country: bottom 3 of the top flight swap
  // with the top 3 of the second tier.
  COUNTRIES.forEach((C,ci)=>{
    const prem = tableFor(G,0,ci), champ = tableFor(G,1,ci);
    prem.slice(-3).forEach(c=>{ c.div=1; logNews(G,"releg",`⬇️ ${c.name} are relegated to the ${divName(ci,1)}`, c.id); });
    champ.slice(0,3).forEach(c=>{ c.div=0; logNews(G,"promo",`⬆️ ${c.name} are promoted to the ${divName(ci,0)}`, c.id); addHonour(c, G.season, "promo", `Promoted to ${divName(ci,0)}`); });
  });
  // finances: income (TV base + league prize + gate) MINUS the annual wage bill,
  // so contracts actually cost money and budgets reflect how well the club is run.
  G.clubs.forEach(c=>{
    const pos = leaguePos(G,c);
    const base = c.div===0 ? 30 : 13;                                         // TV / central distribution
    const prize = c.div===0 ? clamp((21-pos)*1.7, 4, 34) : clamp((21-pos)*0.6, 1, 13);  // merit payment
    const gate = round(c.capacity/1000 * (c.div===0?0.52:0.32));             // matchday income
    const wages = wageBill(G, c.id);
    c.budget = round((c.budget + base + prize + gate - wages) * 10)/10;
    c.pld=0;c.w=0;c.d=0;c.l=0;c.gf=0;c.ga=0;c.pts=0;
  });
  // youth intake into every club, refill thin squads
  G.clubs.forEach(c=>youthIntake(G, c));
  G.clubs.forEach(c=>refillSquad(G, c));
  // thin the free-agent pool (already aged above)
  G.freeAgents = G.freeAgents.filter(p=>p.ovr>=48 || p.age<=23).slice(0,300);
  // fresh fixtures + cups + reset XIs
  G.season++; G.day=0; G.phase="regular";
  G.schedule = buildSchedule(G.clubs);
  initContCup(G);   // seed continental cup from LAST season's standings + national cups (still on G.cups)
  initCups(G);      // then reset the national cups for the new season
  G.clubs.forEach(c=>autoPickXI(c, G.players));
  G.transferOffers = [];
  G.lastMatch = null;
  setOwnerExpectation(G);
}
function developPlayer(p){
  p.age++;
  // `delta` is the intended OVR change this year. Young players with headroom to
  // their potential grow; older players decline. (Growth is capped by remaining room.)
  const room = (p.pot||p.ovr) - p.ovr;
  let delta = 0;
  if(p.age<=23) delta = room>0 ? rint(2,5) : rint(0,1);
  else if(p.age<=27) delta = room>0 ? rint(0,3) : 0;
  else if(p.age<=30) delta = -rint(0,1);
  else delta = -rint(1,3);
  // youth game time accelerates teenage development
  if(p.age<=20 && room>0){ const ya=p.youthApps||0; delta += ya>=18?2 : ya>=8?1 : 0; }
  p.youthApps = 0; p.youthG = 0;
  if(delta>0) delta = Math.min(delta, room);   // never overshoot potential
  // OVR is a weighted average of attributes, so bump attributes until the OVR
  // actually moves by ~delta (the old code added raw points that averaged away to ~0).
  const keys = ["pac","sho","pas","dri","def","phy","gk"];
  const w = POS_W[p.pos]||{};
  const relevant = keys.filter(k=>(w[k]||0)>0.05);
  const target = clamp(p.ovr + delta, 20, 99);
  const dir = delta>0 ? 1 : -1;
  let guard = 0;
  while(delta!==0 && guard++ < 120){
    if(dir>0 ? p.ovr>=target : p.ovr<=target) break;
    let k = relevant.length?pick(relevant):pick(keys);
    let nv = clamp(p[k] + dir, 20, 99);
    if(nv===p[k]){ k = pick(keys); nv = clamp(p[k] + dir, 20, 99); }   // attr capped — try another
    p[k] = nv;
    computeOvr(p);
  }
  // pace fades fastest with age
  if(p.age>=30){ p.pac = clamp(p.pac - rint(0,2), 20, 99); computeOvr(p); }
  p.peakOvr = Math.max(p.peakOvr||p.ovr, p.ovr);
  p.salary = wageFor(p); p.value = playerValue(p);
}
function releaseToFA(G, p){
  p.teamId = null; p.years = 0; p.injury = null;
  G.freeAgents = G.freeAgents || [];
  if(!G.freeAgents.some(x=>x.id===p.id)) G.freeAgents.push(p);
  delete G.players[p.id];
}
function youthIntake(G, club){
  const lvl = (club.academy && club.academy.level) || 1;
  const n = 1 + (chance(0.4+lvl*0.1)?1:0) + (lvl>=4&&chance(0.4)?1:0);
  const intake = [];
  for(let i=0;i<n;i++){
    const pos = pick(ALL_POS);
    const p = makePlayer(pos, [16,18], -10 + lvl*1.5);
    // give academy prospects real headroom (better academies -> higher ceilings)
    p.pot = clamp(Math.max(p.pot, p.ovr + rint(8, 14+lvl*3)), p.ovr, 99);
    p.teamId = club.id; p.salary = Math.min(p.salary, 0.4); p.years = rint(2,4); p.youth = true;
    G.players[p.id] = p; intake.push(p);
  }
  if(club.userControlled){
    G.youthIntake = intake.map(p=>({ id:p.id, name:p.name, pos:p.pos, ovr:p.ovr, pot:p.pot }));
    if(intake.length) logNews(G,"youth",`🎓 Youth intake: ${intake.map(p=>p.name+" ("+p.pos+" "+p.ovr+"→"+p.pot+")").join(", ")}`, club.id);
  }
}
// Refill a thin squad, targeting positional NEEDS (so every club keeps enough
// keepers, defenders, midfielders and forwards to field its formation naturally).
function refillSquad(G, club){
  let squad = Object.values(G.players).filter(p=>p.teamId===club.id);
  const adj = club.div===0 ? -2 : -8;
  const add = pos => { const p=makePlayer(pos,[18,29],adj); p.teamId=club.id; p.years=rint(1,3); G.players[p.id]=p; squad.push(p); };
  const has = arr => squad.filter(p=>arr.includes(p.pos)).length;
  const DEF=["RB","LB","CB","RWB","LWB"], MID=["CDM","CM","CAM","RM","LM"], ATT=["RW","LW","ST"];
  let guard=0;
  while(has(["GK"])<3 && guard++<40) add("GK");
  guard=0; while(has(DEF)<7 && guard++<40) add(pick(["CB","CB","RB","LB"]));
  guard=0; while(has(MID)<7 && guard++<40) add(pick(["CM","CM","CDM","CAM"]));
  guard=0; while(has(ATT)<5 && guard++<40) add(pick(["ST","RW","LW"]));
  guard=0; while(squad.length<23 && guard++<40) add(pick(ALL_POS));
  autoPickXI(club, G.players);
}

/* ----------------------------- youth (5v5) ----------------------------- */
// A lightweight youth setup: every club fields a small-sided youth side of its
// academy prospects (age <= 19). Game time accrues (youthApps) and accelerates
// their development at the season rollover. The user's youth game is simmed in
// detail each matchday for flavour; AI clubs just bank the game time.
function youthProspects(G, clubId){
  return Object.values(G.players).filter(p=>p.teamId===clubId && p.age<=19)
    .sort((a,b)=> b.pot-a.pot || b.ovr-a.ovr);
}
// The 5-a-side youth XI: best keeper + four best outfielders.
function youthFive(G, clubId){
  const pros = youthProspects(G, clubId);
  const gk = pros.find(p=>p.pos==="GK");
  const out = pros.filter(p=>p.pos!=="GK").slice(0, gk?4:5);
  return (gk?[gk]:[]).concat(out);
}
function youthStrength(G, clubId){
  const five = youthFive(G, clubId);
  if(!five.length) return 45;
  return five.reduce((s,p)=>s+p.ovr,0)/five.length;
}
function simYouthMatch(G, home, away){
  const sh = youthStrength(G, home.id), sa = youthStrength(G, away.id);
  const xgH = clamp(1.5*Math.exp(0.045*(sh-sa)), 0.3, 4.5), xgA = clamp(1.5*Math.exp(0.045*(sa-sh)), 0.3, 4.5);
  const hs = poisson(xgH), as = poisson(xgA);
  const attackers = youthFive(G, home.id).filter(p=>p.pos!=="GK");
  const scorers = [];
  for(let i=0;i<hs;i++){ const sc = attackers.length?pick(attackers):youthFive(G,home.id)[0]; if(sc){ sc.youthG=(sc.youthG||0)+1; scorers.push(sc.name); } }
  return { opp: away.abbr, oppName: away.name, hs, as, scorers, day: G.day+1 };
}
function accrueYouth(G){
  // bank a youth appearance for each club's playing prospects
  G.clubs.forEach(c=>{ youthFive(G, c.id).forEach(p=>{ p.youthApps=(p.youthApps||0)+1; }); });
  // detailed youth fixture for the user's club
  const u = G.clubs[G.userTeamId];
  const pool = G.clubs.filter(c=>c.id!==u.id && c.country===u.country);
  if(pool.length) G.youthLast = simYouthMatch(G, u, pick(pool));
}

/* ----------------------------- hall of fame ---------------------------- */
function hallOfFameCheck(G){
  G.hof = G.hof || [];
  Object.values(G.players).forEach(p=>{
    if(p.age>=34 && (p.career.G>=120 || (p.peakOvr>=88 && p.career.App>=250) || (p.awards||0)>=2)){
      if(!p.hof){ p.hof=true; G.hof.unshift({ id:p.id, name:p.name, pos:p.pos, G:p.career.G, A:p.career.A, App:p.career.App, peak:p.peakOvr, season:G.season }); }
    }
  });
  if(G.hof.length>120) G.hof.length=120;
}

/* ----------------------------- transfers ------------------------------- */
// Buy a player from another club: pay the fee from your budget; he joins your squad.
// Paid transfers (buy/sell) + AI bids only happen in the summer or January window.
// Free agents (out-of-contract) can still be signed any time, as in real football.
function transferWindowOpen(G){
  if(G.phase==="offseason") return true;
  if(G.phase!=="regular") return false;
  return G.day<=2 || (G.day>=18 && G.day<=21);   // summer tail + January
}
function transferWindowLabel(G){
  if(G.phase==="offseason") return "🟢 Summer transfer window open";
  if(transferWindowOpen(G)) return G.day<=2 ? "🟢 Summer window — closes after matchday 3" : "🟢 January window — closes after matchday 22";
  if(G.day<18) return `🔴 Window closed — January opens at matchday 19 (in ${19-G.day})`;
  return "🔴 Window closed — reopens in the summer";
}
function buyPlayer(G, p, fee){
  const buyer = G.clubs[G.userTeamId];
  if(!transferWindowOpen(G)) return { ok:false, msg:"The transfer window is closed." };
  if(buyer.budget < fee) return { ok:false, msg:"Not enough budget for that fee." };
  const seller = p.teamId!=null ? G.clubs[p.teamId] : null;
  buyer.budget = round((buyer.budget - fee)*10)/10;
  if(seller){ seller.budget = round((seller.budget + fee)*10)/10; }
  p.teamId = buyer.id; p.years = Math.max(p.years||0, rint(2,4)); p.salary = wageFor(p);
  autoPickXI(buyer, G.players);
  logNews(G,"transfer",`➡️ Signed ${p.pos} ${p.name} (${p.ovr}) for ${money(fee)}`, buyer.id);
  return { ok:true };
}
// Sell one of your players to an AI club for a fee.
function sellPlayer(G, p, fee, toClubId){
  if(!transferWindowOpen(G)) return false;
  const seller = G.clubs[G.userTeamId];
  const buyer = toClubId!=null ? G.clubs[toClubId] : null;
  seller.budget = round((seller.budget + fee)*10)/10;
  if(buyer){ buyer.budget = round(Math.max(0, buyer.budget - fee)*10)/10; p.teamId = buyer.id; autoPickXI(buyer, G.players); }
  else { p.teamId = null; G.freeAgents=G.freeAgents||[]; G.freeAgents.push(p); }
  autoPickXI(seller, G.players);
  logNews(G,"transfer",`⬅️ Sold ${p.pos} ${p.name} (${p.ovr}) for ${money(fee)}`, seller.id);
}
// AI clubs occasionally bid for your best/surplus players.
function generateTransferOffers(G){
  G.transferOffers = G.transferOffers || [];
  if(!transferWindowOpen(G)) return;
  if(G.transferOffers.length>=4) return;
  const squad = Object.values(G.players).filter(p=>p.teamId===G.userTeamId);
  if(squad.length<=18) return;
  const target = wpick(squad, p=>p.value);
  if(!target) return;
  const suitors = G.clubs.filter(c=>c.id!==G.userTeamId && c.budget>target.value*1.1);
  if(!suitors.length) return;
  const by = pick(suitors);
  const fee = round(target.value * (0.9 + _rng()*0.6) *10)/10;
  G.transferOffers.push({ id:"of"+Date.now()+Math.floor(_rng()*999), playerId:target.id, by:by.id, fee });
  logNews(G,"offer",`💬 ${by.name} bid ${money(fee)} for ${target.name}`, G.userTeamId);
}
// Sign an out-of-contract free agent (no fee; wage only). Squad cap keeps it sane.
function signFreeAgent(G, p){
  const club = G.clubs[G.userTeamId];
  const squad = Object.values(G.players).filter(x=>x.teamId===G.userTeamId);
  if(squad.length>=30) return { ok:false, msg:"Squad is full (30)." };
  G.freeAgents = (G.freeAgents||[]).filter(x=>x.id!==p.id);
  p.teamId = club.id; p.years = rint(1,3); p.salary = wageFor(p);
  G.players[p.id] = p;
  autoPickXI(club, G.players);
  logNews(G,"sign",`✍️ Signed free agent ${p.pos} ${p.name} (${p.ovr})`, club.id);
  return { ok:true };
}
function wageBill(G, clubId){
  return round(Object.values(G.players).filter(p=>p.teamId===clubId).reduce((s,p)=>s+(p.salary||0),0)*10)/10;
}

/* ----------------------------- loans ----------------------------------- */
// A loaned player plays for (and develops at) the destination club this season, then returns to
// his owner at the rollover. p.loanOwner = the club he belongs to; p.teamId = where he's playing now.
function isLoaned(p){ return p && p.loanOwner!=null; }
function loanOut(G, p, toClubId){
  if(!transferWindowOpen(G)) return { ok:false, msg:"Loans only happen in the transfer window." };
  if(p.teamId!==G.userTeamId || isLoaned(p)) return { ok:false, msg:"Can't loan that player out." };
  const to = G.clubs[toClubId]; if(!to || to.id===G.userTeamId) return { ok:false, msg:"No club to loan to." };
  if(Object.values(G.players).filter(x=>x.teamId===G.userTeamId).length<=16) return { ok:false, msg:"Squad too thin to loan anyone out." };
  p.loanOwner = G.userTeamId; p.loanUntil = G.season; p.teamId = to.id;
  autoPickXI(G.clubs[G.userTeamId], G.players); autoPickXI(to, G.players);
  logNews(G,"loan",`📤 Loaned ${p.pos} ${p.name} (${p.ovr}) to ${to.name} for the season`, G.userTeamId);
  return { ok:true };
}
// pick a sensible destination — a weaker club that will actually play him
function loanOutAuto(G, p){
  const cands = G.clubs.filter(c=>c.id!==G.userTeamId && Object.values(G.players).filter(x=>x.teamId===c.id).length<30);
  if(!cands.length) return { ok:false, msg:"No club available to take him." };
  cands.sort((a,b)=>clubStrength(a,G.players)-clubStrength(b,G.players));
  const to = cands[rint(0, Math.min(7, cands.length-1))];
  return loanOut(G, p, to.id);
}
function loanIn(G, p){
  if(!transferWindowOpen(G)) return { ok:false, msg:"Loans only happen in the transfer window." };
  if(p.teamId==null || p.teamId===G.userTeamId || isLoaned(p)) return { ok:false, msg:"Can't loan that player in." };
  if(Object.values(G.players).filter(x=>x.teamId===G.userTeamId).length>=30) return { ok:false, msg:"Squad is full (30)." };
  const from = G.clubs[p.teamId];
  p.loanOwner = p.teamId; p.loanUntil = G.season; p.teamId = G.userTeamId;
  autoPickXI(G.clubs[G.userTeamId], G.players); if(from) autoPickXI(from, G.players);
  logNews(G,"loan",`📥 Loaned in ${p.pos} ${p.name} (${p.ovr}) from ${from?from.name:"?"} for the season`, G.userTeamId);
  return { ok:true };
}
// Return all loanees to their owners (run at the rollover, before develop/contracts).
function returnLoans(G){
  Object.values(G.players).forEach(p=>{
    if(p.loanOwner==null) return;
    const ownerId = p.loanOwner, involvedUser = (p.teamId===G.userTeamId || ownerId===G.userTeamId);
    if(G.clubs[ownerId]){ p.teamId = ownerId; if(involvedUser) logNews(G,"loan",`🔙 ${p.pos} ${p.name} returns from loan`, ownerId); }
    p.loanOwner = null; p.loanUntil = null;
  });
}

/* ----------------------------- owner ----------------------------------- */
function setOwnerExpectation(G){
  const c = G.clubs[G.userTeamId];
  if(c.div===1){ G.expectation = { text:"Win promotion back to the "+divName(c.country||0,0), target:"promo" }; return; }
  const last = (c.history||[]).slice(-1)[0];
  const lastPos = last ? last.pos : 12;
  if(lastPos<=4) G.expectation = { text:"Challenge for the title (top 3)", target:"top3" };
  else if(lastPos<=10) G.expectation = { text:"Finish in the top half", target:"top10" };
  else G.expectation = { text:"Avoid relegation", target:"safe" };
}

/* ----------------------------- news ------------------------------------ */
function logNews(G, type, msg, teamId){
  if(!G) return;
  if(!Array.isArray(G.news)) G.news=[];
  G.news.unshift({ season:G.season, day:(G.day||0)+1, phase:G.phase, type, msg, teamId: teamId==null?null:teamId });
  if(G.news.length>250) G.news.length=250;
}

/* ----------------------------- save / load ----------------------------- */
const SAVE_VERSION = 3;
const SLOT_INDEX = "pgsoccer_slots";
const slotKey = id => "pgsoccer_slot_" + id;
function listSlots(){
  try{ const a = JSON.parse(localStorage.getItem(SLOT_INDEX)||"[]"); return Array.isArray(a)?a.sort((x,y)=>y.updated-x.updated):[]; }
  catch(e){ return []; }
}
function saveGame(G){
  try{
    if(!G.slotId) G.slotId = "s" + Date.now() + Math.floor(Math.random()*999);
    localStorage.setItem(slotKey(G.slotId), JSON.stringify(G));
    const u = G.clubs[G.userTeamId];
    const idx = listSlots().filter(s=>s.id!==G.slotId);
    idx.push({ id:G.slotId, club:u?u.name:"—", abbr:u?u.abbr:"", season:G.season, day:(G.day||0)+1, phase:G.phase, updated:Date.now() });
    localStorage.setItem(SLOT_INDEX, JSON.stringify(idx));
    return true;
  }catch(e){ return false; }
}
function loadSlot(id){
  try{ const g = JSON.parse(localStorage.getItem(slotKey(id))); return g?migrate(g):null; }catch(e){ return null; }
}
function deleteSlot(id){
  try{ localStorage.removeItem(slotKey(id)); localStorage.setItem(SLOT_INDEX, JSON.stringify(listSlots().filter(s=>s.id!==id))); }catch(e){}
}
function migrate(G){
  if(!G || !Array.isArray(G.clubs)) return G;
  try{
    let maxId=0; Object.values(G.players||{}).forEach(p=>{ if(typeof p.id==="number"&&p.id>maxId) maxId=p.id; });
    (G.freeAgents||[]).forEach(p=>{ if(p&&typeof p.id==="number"&&p.id>maxId) maxId=p.id; });
    uid.atLeast(maxId);
    if(!Array.isArray(G.news)) G.news=[];
    if(!Array.isArray(G.freeAgents)) G.freeAgents=[];
    if(!Array.isArray(G.transferOffers)) G.transferOffers=[];
    if(!Array.isArray(G.champions)) G.champions=[];
    if(!Array.isArray(G.contChampions)) G.contChampions=[];
    if(!Array.isArray(G.awardHistory)) G.awardHistory=[];
    if(!Array.isArray(G.hof)) G.hof=[];
    if(!G.settings) G.settings={ injuries:true };
    // multi-country migration: default legacy clubs to country 0, build per-country cups
    G.clubs.forEach(c=>{ if(c.country==null) c.country=0; });
    if(!Array.isArray(G.cups)){ if(G.cup){ G.cup.country=0; G.cups=[G.cup]; } else initCups(G); delete G.cup; }
    G.cups.forEach(cup=>{ if(cup.country==null) cup.country=0; if(cup.runnerUp===undefined) cup.runnerUp=null; });
    if(!G.contCup || !G.contCup.phase) initContCup(G);   // (re)build into the group-stage format
    // backfill newer per-player stat fields (shots, key passes, xG, saves, bans)
    const fill = s => { if(s){ ["SH","SOT","KP","xG","Sv"].forEach(k=>{ if(s[k]==null) s[k]=0; }); } };
    Object.values(G.players||{}).forEach(p=>{ fill(p.stats); fill(p.career); if(p.susp==null) p.susp=0; if(p.ycCount==null) p.ycCount=0; });
    (G.freeAgents||[]).forEach(p=>{ fill(p.stats); fill(p.career); });
    G.clubs.forEach(c=>{ if(!c.formation) c.formation="4-3-3"; if(!c.tactic) c.tactic="balanced"; if(!c.academy) c.academy={level:1}; if(!Array.isArray(c.honours)) c.honours=[]; ensureXI(c, G.players); });
    if(!G.expectation) setOwnerExpectation(G);
    G.version = SAVE_VERSION;
  }catch(e){}
  return G;
}
function exportSave(G){
  try{
    const blob = new Blob([JSON.stringify(G)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const u = G.clubs[G.userTeamId];
    a.href=url; a.download=`pocketgm-soccer-${u?u.abbr:"save"}-${G.season}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000); return true;
  }catch(e){ return false; }
}
function importSave(file, onLoad){
  const r = new FileReader();
  r.onload = e=>{ try{ const g=migrate(JSON.parse(e.target.result)); if(g&&Array.isArray(g.clubs)) onLoad(g); else alert("Not a valid Pocket GM Soccer save."); }catch(err){ alert("Couldn't read that save file."); } };
  r.readAsText(file);
}

/* ----------------------------- new game -------------------------------- */
function newGame(userTeamId, opts={}){
  const { clubs, players } = generateLeague(userTeamId, opts);
  const G = {
    season: 2026, day: 0, phase: "regular", version: SAVE_VERSION,
    seed: (opts && opts.seed!=null && !Number.isNaN(opts.seed)) ? (opts.seed>>>0) : null,
    userTeamId, clubs, players,
    schedule: buildSchedule(clubs),
    freeAgents: [], transferOffers: [], news: [], champions: [], contChampions: [], awardHistory: [], hof: [],
    cups: null, contCup: null, lastMatch: null, settings: { injuries:true },
  };
  // seed a free-agent pool sized for a bigger world
  for(let i=0;i<90;i++){ const p=makePlayer(pick(ALL_POS),[20,33],-4); p.teamId=null; G.freeAgents.push(p); }
  initCups(G);
  initContCup(G);
  setOwnerExpectation(G);
  return G;
}

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

/* ----------------------------- hub ------------------------------------- */
function Hub({G, commit, tShow, setTab}){
  const user = G.clubs[G.userTeamId];
  const round = G.schedule[G.day] || [];
  const userGame = round.find(g=>g.home===G.userTeamId||g.away===G.userTeamId);
  const table = tableFor(G, user.div, user.country||0);
  const pos = table.findIndex(c=>c.id===user.id)+1;
  const doSim = fn => { fn(G); commit(G); };
  const offseason = G.phase==="offseason";
  return (
    <div className="space-y-4">
      <Card>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="text-xl font-bold">{user.name}</div>
            <div className="text-sm text-slate-400">{COUNTRIES[user.country||0].flag} {divName(user.country||0,user.div)} · {pos>0?ordinal(pos):"—"} place · {user.pts} pts · GD {gd(user)>=0?"+":""}{gd(user)}</div>
            <div className="text-xs text-amber-300/90 mt-1">Board: {G.expectation?G.expectation.text:"—"}</div>
          </div>
          <div className="text-right">
            <div className="text-3xl font-black">{clubStrength(user, G.players)}</div>
            <div className="text-xs text-slate-400">squad rating</div>
          </div>
        </div>
      </Card>

      {!offseason && (
        <Card>
          <div className="text-sm text-slate-400 mb-2">Matchday {G.day+1}</div>
          {userGame ? (
            <div className="flex items-center justify-between">
              <div className="font-semibold">
                {userGame.home===G.userTeamId
                  ? <span><span className="text-emerald-300">{user.abbr}</span> vs {G.clubs[userGame.away].abbr}</span>
                  : <span>{G.clubs[userGame.home].abbr} vs <span className="text-emerald-300">{user.abbr}</span></span>}
                <span className="text-slate-500 text-sm"> ({userGame.home===G.userTeamId?"H":"A"})</span>
              </div>
              <div className="text-sm text-slate-400">{userGame.home===G.userTeamId?G.clubs[userGame.away].name:G.clubs[userGame.home].name}</div>
            </div>
          ) : <div className="text-slate-400">No fixture this matchday (bye).</div>}
          <div className="flex flex-wrap gap-2 mt-3">
            <button onClick={()=>doSim(simRound)} className="px-4 py-2 rounded-lg bg-emerald-500 text-slate-900 font-semibold">Play Matchday</button>
            <button onClick={()=>doSim(simToNextUserMatch)} className="px-4 py-2 rounded-lg bg-[#16213a] text-slate-200">Sim to Next Match</button>
            <button onClick={()=>{ for(let i=0;i<7 && G.phase==="regular";i++) simRound(G); commit(G); }} className="px-4 py-2 rounded-lg bg-[#16213a] text-slate-200">Sim 7 MD</button>
            <button onClick={()=>{ generateTransferOffers(G); commit(G); tShow("Checked the market"); }} className="px-4 py-2 rounded-lg bg-[#16213a] text-slate-200">Check Market</button>
          </div>
        </Card>
      )}
      {offseason && (
        <Card>
          <div className="font-semibold mb-1">Season complete</div>
          <div className="text-sm text-slate-400 mb-3">Review awards, the transfer market, your youth intake, then start the next season.</div>
          <button onClick={()=>setTab("offseason")} className="px-4 py-2 rounded-lg bg-emerald-500 text-slate-900 font-semibold">Go to Offseason</button>
        </Card>
      )}

      {G.lastMatch && <Card><div className="text-sm text-slate-400 mb-2">Your last result</div><BoxScore m={G.lastMatch} G={G} /></Card>}

      {G.contCup && (()=>{
        const cc=G.contCup;
        const qualified=(cc.qualifiers||[]).includes(user.id);
        const alive=(cc.alive||[]).includes(user.id);

        let status;
        if(cc.winner===user.id) status=<span className="text-amber-300 font-semibold">Champions of {CONT_CUP_NAME}! 🏆</span>;
        else if(!qualified) status=<span className="text-slate-400">Not qualified this season — finish top 3 or win the {cupName(user.country||0)}.</span>;
        else if(cc.winner!=null) status=<span className="text-slate-400">Eliminated · won by {G.clubs[cc.winner]?G.clubs[cc.winner].abbr:"—"}.</span>;
        else if(alive) status=<span className="text-emerald-300">In the hunt · {roundLabel[cc.round]||cc.round} ({cc.alive.length} left)</span>;
        else status=<span className="text-slate-400">Knocked out of the {roundLabel[cc.round]||cc.round}.</span>;

          <Card>
            <div className="flex items-center justify-between mb-1">

          <div className="space-y-1 text-sm">

            {!(G.news||[]).length && <div className="text-slate-500">No news yet.</div>}
          </div>
        </Card>
      </div>
    </div>
  );
}
const ordinal = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const gd = c => c.gf - c.ga;
function MiniTable({G, rows, highlight}){
  return (
    <table className="w-full text-sm tnum">

          <td>{i+1}</td><td className="text-left">{c.abbr}</td><td className="text-center">{c.pld}</td>
          <td className="text-center">{gd(c)>=0?"+":""}{gd(c)}</td><td className="text-center font-semibold">{c.pts}</td>

/* ----------------------------- squad ----------------------------------- */

  squad.sort((a,b)=> sort==="ovr"? b.ovr-a.ovr : sort==="pos"? BAND[a.pos]-BAND[b.pos]||b.ovr-a.ovr : sort==="age"? a.age-b.age : b.value-a.value);

        </div>
        <div className="flex gap-2 mt-2 text-xs">
          {[["ovr","Rating"],["pos","Position"],["age","Age"],["val","Value"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSort(k)} className={"px-2 py-1 rounded "+(sort===k?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l}</button>
