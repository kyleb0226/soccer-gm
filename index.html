}
// Swap a starter (xi index) for a bench player on the user's club, mid-match.
function liveSub(club, players, outId, inId){
  const xi=(club.xi||[]).slice(), bench=(club.bench||[]).slice();
  const xiPos=xi.indexOf(outId), bPos=bench.indexOf(inId);
  if(xiPos<0||bPos<0) return false;
  xi[xiPos]=inId; bench[bPos]=outId;
  club.xi=xi; club.bench=bench; return true;
}

/* ----------------------------- offseason ------------------------------- */
function finalizeSeason(G){
  // league champion of every country
  G.champions = G.champions || [];
  COUNTRIES.forEach((C,ci)=>{
    const champ = tableFor(G, 0, ci)[0];
    if(!champ) return;
    G.champions.unshift({ season:G.season, id:champ.id, abbr:champ.abbr, country:ci });
    logNews(G, "title", `🏆 ${champ.name} are champions of the ${divName(ci,0)}!`, champ.id);
    addHonour(G.clubs[champ.id], G.season, "league", `${divName(ci,0)} champions`);
    // THE TREBLE: same club wins its league, its national cup AND the continental cup
    const cup = (G.cups||[]).find(x=>x.country===ci);
    const wonCup = cup && cup.winner===champ.id;
    const wonCont = G.contCup && G.contCup.winner===champ.id;
    if(wonCup && wonCont){
      addHonour(G.clubs[champ.id], G.season, "treble", `🌟 The Treble — ${divName(ci,0)}, ${cupName(ci)} & ${CONT_CUP_NAME}`);
      logNews(G, "title", `🌟🏆 ${champ.name} complete an historic TREBLE — league, cup and ${CONT_CUP_NAME}!`, champ.id);
      G.trebles = G.trebles || [];
      G.trebles.unshift({ season:G.season, id:champ.id, abbr:champ.abbr, country:ci });
    }
  });
  computeAwards(G);
  evaluateBoardSeasonEnd(G);
  G.phase = "offseason";
}
// End-of-season verdict: did the manager meet the owner's expectation? Adjust
// confidence sharply, then sack an underperformer or field a poaching approach.
function evaluateBoardSeasonEnd(G){
  if(!jobSecurityOn(G) || G.pendingSack) return;
  const user = G.clubs[G.userTeamId];
  const pos = leaguePos(G, user) || 12;
  const target = expTargetPos(G);
  if(G.boardConfidence==null) G.boardConfidence=60;
  const beat = target - pos;   // >0 = exceeded expectation
  G.boardConfidence = clamp(G.boardConfidence + beat*5, 0, 100);
  const div0 = user.div===0;
  const relegated = div0 && pos > (tableFor(G,0,user.country||0).length - 3);
  if((relegated && G.boardConfidence<45) || G.boardConfidence<=12){
    G.pendingSack = true;
    G.jobOffers = generateJobOffers(G, "sack");
    logNews(G, "job", `❗ The ${user.name} board has parted ways with you after the season.`, user.id);
  } else if(beat>=4 && G.boardConfidence>=70){
    // overperformed — a bigger club may come calling (optional move)
    const offers = generateJobOffers(G, "approach");
    if(offers.length){ G.jobOffers = offers; logNews(G, "job", `📈 Your work has attracted interest from bigger clubs.`, user.id); }
  }
}
function computeAwards(G){
  // a per-country award set (top flight only)
  G.awardHistory = G.awardHistory || [];
  const entry = { season:G.season, countries: [] };
  COUNTRIES.forEach((C,ci)=>{
    const all = Object.values(G.players).filter(p=>p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].country===ci && G.clubs[p.teamId].div===0 && p.stats.App>=10);
    if(!all.length){ entry.countries.push({ country:ci, pots:null, boot:null, glove:null, young:null }); return; }
    const boot = all.slice().sort((a,b)=>b.stats.G-a.stats.G)[0];
    const glove = all.filter(p=>p.pos==="GK").sort((a,b)=>b.stats.CS-a.stats.CS)[0];
    const pots = all.slice().sort((a,b)=>(avgRating(b.stats)+b.stats.G*0.03+b.stats.A*0.02)-(avgRating(a.stats)+a.stats.G*0.03+a.stats.A*0.02))[0];
    const yng = all.filter(p=>p.age<=21).sort((a,b)=>avgRating(b.stats)-avgRating(a.stats))[0];
    entry.countries.push({ country:ci,
      pots: pots?{id:pots.id,name:pots.name,team:G.clubs[pots.teamId].abbr,r:+avgRating(pots.stats).toFixed(2)}:null,
      boot: boot?{id:boot.id,name:boot.name,team:G.clubs[boot.teamId].abbr,g:boot.stats.G}:null,
      glove: glove?{id:glove.id,name:glove.name,team:G.clubs[glove.teamId].abbr,cs:glove.stats.CS}:null,
      young: yng?{id:yng.id,name:yng.name,team:G.clubs[yng.teamId].abbr,r:+avgRating(yng.stats).toFixed(2)}:null });
    if(pots){ pots.awards=(pots.awards||0)+1; }
    if(boot){ boot.golden=(boot.golden||0)+1; }
  });
  // Ballon d'Or: world's best player across all leagues, weighted by league prestige
  // (top-flight scores higher) + goals + assists + caps + intl goals + club honours
  const candidates = Object.values(G.players).filter(p=>p.teamId!=null && G.clubs[p.teamId] && G.clubs[p.teamId].div===0 && p.stats.App>=10);
  const ballon = candidates.slice().sort((a,b)=>{
    const score = p => {
      const r = avgRating(p.stats), ca = p.career||{};
      return r*2.5 + (p.stats.G||0)*0.35 + (p.stats.A||0)*0.18 + (p.caps||0)*0.04 + (p.intlG||0)*0.08
           + (p.awards||0)*0.3 + (p.golden||0)*0.25 + ((ca.App||0)/300);
    };
    return score(b)-score(a);
  })[0];
  if(ballon){
    ballon.ballonDor = (ballon.ballonDor||0)+1;
    const club = G.clubs[ballon.teamId];
    entry.ballonDor = { id:ballon.id, name:ballon.name, pos:ballon.pos, team:club?club.abbr:"—", r:+avgRating(ballon.stats).toFixed(2), g:ballon.stats.G||0 };
    logNews(G,"award",`🌟 ${ballon.name} wins the Ballon d'Or (${ballon.stats.G}g, ${avgRating(ballon.stats).toFixed(2)} avg)`, ballon.teamId);
  }
  G.awardHistory.unshift(entry);
}
// Roll the franchise into the next season: archive stats, age & develop players, expire
// contracts, promotion/relegation, youth intake, finances, fresh fixtures + cup.
function startNextSeason(G){
  ensureCareer(G); G.career.seasonsManaged++;
  returnLoans(G);   // loanees go back to their owners before aging/contracts
  // archive each player's season into history + career, then reset season stats
  Object.values(G.players).forEach(p=>{
    if(p.stats.App>0){
      p.history = p.history || [];
      const club = p.teamId!=null && G.clubs[p.teamId] ? G.clubs[p.teamId] : null;
      if(p.debutSeason==null) p.debutSeason = G.season;
      // Full season record: every stat field + league/club context so it can be
      // sliced by competition later. ratingSum/ratingN are kept so per-league
      // averages and rating-value can be recomputed from any subset of seasons.
      p.history.push({ season:G.season,
        team: club ? club.abbr : "—", teamId: p.teamId,
        country: club ? club.country : null, div: club ? club.div : null,
        league: club ? divName(club.country, club.div) : "—",
        age: p.age, ovr: p.ovr,
        ...p.stats, r:+avgRating(p.stats).toFixed(2) });
      // Keep a long history for players the user cares about; trim the AI filler
      // to a few recent seasons so saves stay small over many decades.
      const notable = (club && club.userControlled) || (p.peakOvr||0)>=80 || (p.caps||0)>0 || (p.career.G||0)>=40;
      const capH = notable ? 22 : 3;
      if(p.history.length>capH) p.history = p.history.slice(-capH);
      for(const k in p.stats) p.career[k] = (p.career[k]||0) + p.stats[k];
      // accumulate per-competition career totals (League / Cup / Champs Cup) so
      // all-time stats can be sliced by competition just like the season view
      p.careerComp = p.careerComp || {};
      for(const ck in (p.compStats||{})){
        if(!p.careerComp[ck]) p.careerComp[ck] = emptyStats();
        const src = p.compStats[ck];
        for(const k in src) p.careerComp[ck][k] = (p.careerComp[ck][k]||0) + src[k];
      }
    }
    p.stats = emptyStats(); p.compStats = {};
    p.susp = 0; p.ycCount = 0; p.fitness = 100; p.seasonDev = 0; p.injury = null;   // bans/yellows clear; preseason rest heals everyone; reset in-season growth tally
  });
  // record club season history + reset table
  G.clubs.forEach(c=>{
    c.history = c.history || [];
    c.history.push({ season:G.season, div:c.div, pos:leaguePos(G,c), w:c.w, d:c.d, l:c.l, gf:c.gf, ga:c.ga, pts:c.pts });
    if(c.history.length>40) c.history = c.history.slice(-40);
  });
  // age + develop everyone (rostered players AND the existing free-agent pool, once each —
  // do FAs here BEFORE expiries add new names so the just-released don't age twice)
  Object.values(G.players).forEach(p=>developPlayer(p));
  (G.freeAgents||[]).forEach(p=>developPlayer(p));
  // Academy players auto-graduate to the senior squad once they're 20+ (they've
  // aged out of youth football) so prospects never get stuck in the academy.
  Object.values(G.players).forEach(p=>{
    if(!p.youth) return;
    const club = p.teamId!=null ? G.clubs[p.teamId] : null;
    // everyone auto-graduates at 20; AI clubs also fast-track standout teen
    // prospects (already senior-quality or high-ceiling) straight into the squad
    const aiFastTrack = club && !club.userControlled && p.age>=17 && (p.ovr>=62 || (p.pot||0)>=78);
    if(p.age>=20 || aiFastTrack){
      p.youth = false;
      if(club && club.userControlled){
        logNews(G,"youth",`🎓 ${p.name} (${p.pos} ${p.ovr}) graduates from the academy to the senior squad`, p.teamId);
      }
    }
  });
  hallOfFameCheck(G);
  updateRecords(G);   // snapshot careers into the persistent all-time records (before retirements delete anyone)
  // contracts: decrement, expiries become free agents
  G.freeAgents = G.freeAgents || [];
  Object.values(G.players).forEach(p=>{
    if(p.teamId==null) return;
    p.years = (p.years||1) - 1;
    const club = G.clubs[p.teamId];
    if(p.years<=0){
      // AI clubs re-sign most of their useful players (at the player's demand); the rest hit the market
      if(club && club.userControlled){
        // First expiry = one season of grace with a clear warning. If still not
        // re-signed by the NEXT rollover, he leaves on a free (Bosman).
        if(p.expiredGrace){
          logNews(G,"transfer",`🚪 ${p.name} (${p.pos} ${p.ovr}) left ${club.abbr} on a free transfer — his expired contract was never renewed`, club.id);
          releaseToFA(G, p);
        } else {
          p.years=0; p.unhappy=true; p.expiredGrace=true;
          logNews(G,"contract",`⏳ ${p.name}'s contract has expired — re-sign him now or he walks away on a free next season`, club.id);
        }
      }
      else {
        // AI re-signs smartly: keep the players you can afford and your key men;
        // let the rest walk so the wage bill stays inside income.
        const incomeEst = aiIncomeEstimate(G, club);
        const wageRoom = incomeEst*0.78 - wageBill(G, club.id);   // headroom under a sane wage:income ratio
        const demand = wageDemand(p);
        const keyMan = p.ovr>=72;                                  // genuine first-teamers are kept harder
        const affordable = demand <= Math.max(wageRoom, 0) + (keyMan?1.5:0.4);
        if(p.ovr>=58 && (keyMan || affordable) && chance(keyMan?0.94:0.80)){
          p.years=rint(2,4); p.salary=demand; p.unhappy=false;
        } else { releaseToFA(G, p); }
      }
    } else if(p.years<=1 && club && club.userControlled && p.ovr>=60){
      p.unhappy=true;   // wants a new deal before running down (Bosman risk next year)
    } else { p.unhappy=false; }
  });
  // retirements (old, low-rated) — move to G.retired so history is preserved
  G.retired = G.retired || {};
  Object.values(G.players).forEach(p=>{
    if(p.age>=34 && (p.ovr<62 || p.age>=39) && chance(p.age>=37?0.55:0.22)){
      if(p.teamId!=null){ logNews(G,"retire",`${p.name} (${p.pos}) retires at ${p.age}`, p.teamId); }
      p.retired = true; p.retiredAge = p.age; p.retiredSeason = G.season; p.teamId = null; p.years = 0; p.salary = 0;
      G.retired[p.id] = p;
      delete G.players[p.id];
    }
  });
  // promotion / relegation WITHIN each country: bottom 3 of the top flight swap
  // with the top 3 of the second tier.
  COUNTRIES.forEach((C,ci)=>{
    const prem = tableFor(G,0,ci), champ = tableFor(G,1,ci);
    prem.slice(-3).forEach(c=>{ c.div=1; logNews(G,"releg",`⬇️ ${c.name} are relegated to the ${divName(ci,1)}`, c.id); });
    champ.slice(0,3).forEach(c=>{ c.div=0; logNews(G,"promo",`⬆️ ${c.name} are promoted to the ${divName(ci,0)}`, c.id); addHonour(c, G.season, "promo", `Promoted to ${divName(ci,0)}`); });
  });
  // finances: settle the season P&L for every club.
  G.clubs.forEach(c=>{
    const pos = leaguePos(G,c);
    const base = c.div===0 ? 30 : 13;
    const prize = c.div===0 ? clamp((21-pos)*1.7, 4, 34) : clamp((21-pos)*0.6, 1, 13);
    // Gate is now accrued per home match across the season (league + cup + UCL),
    // flexing with attendance/price. AI clubs are simmed the same way, so any club
    // with no recorded gate (shouldn't happen) falls back to a full-season estimate.
    let gate = round((c.seasonGate||0)*10)/10;
    if(gate<=0){ gate = round(c.capacity/1000 * (c.div===0?0.028:0.017) * facilityGateMult(c) * 0.85 * 19 *10)/10; }
    const homeGames = (c.gateLog||[]).length;
    let conc = round((c.seasonConcession||0)*10)/10;
    if(conc<=0 && homeGames===0){ conc = round((c.capacity/1000)*(c.div===0?0.009:0.006)*facilityGateMult(c)*0.85*19*10)/10; }
    const wages = wageBill(G, c.id);
    c.budget = round((c.budget + base + prize + gate + conc - wages) * 10)/10;
    c.gatePerGame = homeGames>0 ? round(gate/homeGames*10)/10 : gate;
    if(!c.lastPnl) c.lastPnl={};
    c.lastPnl.tv=base; c.lastPnl.prize=prize; c.lastPnl.gate=gate; c.lastPnl.conc=conc; c.lastPnl.gateGames=homeGames; c.lastPnl.wages=wages;
    // commercial income (shirt + sponsors + cup prizes) — merges into c.lastPnl below
    processCommercials(G, c);
    // reset the season matchday accruals for the new campaign
    c.seasonGate=0; c.seasonConcession=0; c.gateLog=[];
    c.pld=0;c.w=0;c.d=0;c.l=0;c.gf=0;c.ga=0;c.pts=0;
  });
  // Keep AI wage bills sane relative to their actual income BEFORE they go
  // into crisis — without this, wages drift up via renewals every season
  // while income stays roughly flat, and the whole league's budgets erode
  // year over year (not just a few badly-run clubs).
  G.clubs.forEach(c=>capAIWageBill(G, c));
  // financial distress: a club that's badly run can't just spiral forever.
  // AI clubs get force-restructured (fire-sale a player, or release expensive
  // wages); the user's club instead takes a real consequence — board confidence.
  G.clubs.forEach(c=>relieveFinancialDistress(G, c));
  // youth intake into every club, refill thin squads
  G.clubs.forEach(c=>youthIntake(G, c));
  G.clubs.forEach(c=>refillSquad(G, c));
  // trim bloated AI squads so the world (and the save) stays bounded over decades:
  // surplus seniors go to free agency, surplus youth are released entirely.
  G.clubs.forEach(c=>{
    if(c.userControlled) return;
    const sen = Object.values(G.players).filter(p=>p.teamId===c.id && !p.youth).sort((a,b)=>b.ovr-a.ovr);
    sen.slice(24).forEach(p=>releaseToFA(G, p));
    const yth = Object.values(G.players).filter(p=>p.teamId===c.id && p.youth).sort((a,b)=>(b.pot||b.ovr)-(a.pot||a.ovr));
    yth.slice(7).forEach(p=>retireOrDrop(G, p));
  });
  // thin the free-agent pool (already aged above + the just-released surplus).
  // Anyone purged here who had a real career is preserved in G.retired so old
  // legends never silently disappear from the world.
  G.retired = G.retired || {};
  const keepFA = [], dropFA = [];
  G.freeAgents.forEach(p=>{ (p.ovr>=48 || p.age<=23) ? keepFA.push(p) : dropFA.push(p); });
  dropFA.forEach(p=>retireOrDrop(G, p));
  keepFA.sort((a,b)=>b.ovr-a.ovr);
  keepFA.slice(300).forEach(p=>retireOrDrop(G, p));
  G.freeAgents = keepFA.slice(0,300);
  // fresh fixtures + cups + reset XIs
  G.season++; G.day=0; G.phase="regular";
  G.schedule = buildSchedule(G.clubs);
  initContCup(G);   // seed continental cup from LAST season's standings + national cups (still on G.cups)
  initCups(G);      // then reset the national cups for the new season
  G.clubs.forEach(c=>autoPickXI(c, G.players));
  G.transferOffers = [];
  G.lastMatch = null; G.lastMatches = [];
  setOwnerExpectation(G);
}
// In-season development: a small, age-curved + FORM-driven nudge a few times a season, so players
// progress THROUGH the year (a hot young player climbs as he performs), not only at the rollover.
// Offseason growth is reduced (×0.55) to compensate — development is spread out, not piled on.
function inSeasonDev(G){
  Object.values(G.players).forEach(p=>{
    if(p.teamId==null || (p.stats.App||0)<3) return;   // needs game time
    const r = avgRating(p.stats), room = (p.pot||p.ovr) - p.ovr;
    let center;
    if(p.age<=21)      center = 0.07 + Math.max(0,room)*0.010;
    else if(p.age<=25) center = 0.03 + Math.max(0,room)*0.006;
    else if(p.age<=29) center = -0.02;
    else if(p.age<=32) center = -0.08;
    else               center = -0.16;
    const perf = clamp((r-6.7)*0.5, -0.6, 0.7);        // form modulates growth (6.7 ≈ neutral)
    if(p.age<=27 && center>0) center *= clamp(1+perf, 0.2, 1.9);
    else center += perf*0.12;
    center = clamp(center, -0.45, 0.6);
    const keys=["pac","sho","pas","dri","def","phy","gk"], w=POS_W[p.pos]||{};
    const rel=keys.filter(k=>(w[k]||0)>0.05);
    const before=p.ovr;
    (rel.length?rel:keys).forEach(k=>{ if(p[k]!=null && chance(0.5)) p[k]=clamp(round(p[k]+gauss(center,0.6)),20,99); });
    computeOvr(p); p.peakOvr=Math.max(p.peakOvr||p.ovr, p.ovr);
    if(p.ovr!==before){ p.seasonDev=(p.seasonDev||0)+(p.ovr-before); p.salary=wageFor(p); p.value=playerValue(p); }
  });
}
function developPlayer(p){
  p.age++;
  // `delta` is the intended OVR change this year. Young players with headroom to
  // their potential grow; older players decline. (Growth is capped by remaining room.)
  const room = (p.pot||p.ovr) - p.ovr;
  let delta = 0;
  if(p.age<=23) delta = room>0 ? rint(2,5) : rint(0,1);
  else if(p.age<=27) delta = room>0 ? rint(0,3) : 0;
  else if(p.age<=30) delta = -rint(0,1);
  else delta = -rint(1,3);
  // Academy players develop FAST while they're young — they don't earn senior
  // appearances (so they get no in-season growth), so the rollover does the work.
  // The boost is age-gated: big at 16-18, fading out, gone by ~22.
  const inAcademy = !!p.youth;
  if(p.age<=21 && room>0){
    const ya = p.youthApps||0;
    if(inAcademy){
      delta += p.age<=18 ? 4 : p.age<=20 ? 3 : 1;       // intensive academy training
      delta += ya>=24 ? 2 : ya>=12 ? 1 : 0;             // plus game time in the youth league
    } else {
      delta += ya>=18 ? 2 : ya>=8 ? 1 : 0;
    }
  }
  p.youthApps = 0; p.youthG = 0;
  // Senior players have most growth happen in-season, so the rollover is damped (×0.45).
  // Academy youngsters get no in-season growth, so keep almost all of theirs here.
  if(delta>0) delta = (inAcademy && p.age<=21) ? Math.max(2, Math.round(delta*0.9)) : Math.max(1, Math.round(delta*0.45));
  if(delta>0) delta = Math.min(delta, room);   // never overshoot potential
  // OVR is a weighted average of attributes, so bump attributes until the OVR
  // actually moves by ~delta (the old code added raw points that averaged away to ~0).
  const keys = ["pac","sho","pas","dri","def","phy","gk"];
  const w = POS_W[p.pos]||{};
  const relevant = keys.filter(k=>(w[k]||0)>0.05);
  const target = clamp(p.ovr + delta, 20, 99);
  const dir = delta>0 ? 1 : -1;
  let guard = 0;
  while(delta!==0 && guard++ < 120){
    if(dir>0 ? p.ovr>=target : p.ovr<=target) break;
    let k = relevant.length?pick(relevant):pick(keys);
    let nv = clamp(p[k] + dir, 20, 99);
    if(nv===p[k]){ k = pick(keys); nv = clamp(p[k] + dir, 20, 99); }   // attr capped — try another
    p[k] = nv;
    computeOvr(p);
  }
  // pace fades fastest with age
  if(p.age>=30){ p.pac = clamp(p.pac - rint(0,2), 20, 99); computeOvr(p); }
  p.peakOvr = Math.max(p.peakOvr||p.ovr, p.ovr);
  p.salary = wageFor(p); p.value = playerValue(p);
}
function releaseToFA(G, p){
  p.teamId = null; p.years = 0; p.injury = null; p.wantsOut = false; p.listed = false;
  G.freeAgents = G.freeAgents || [];
  if(!G.freeAgents.some(x=>x.id===p.id)) G.freeAgents.push(p);
  // keep in G.players so they're still visible in the world — just teamId=null
}
// Called when a player would otherwise be permanently purged from the world
// (surplus youth, or overflow/low-quality free agents trimmed at the rollover).
// Anyone with a real footprint — a career, decent peak, or who ever played for
// the user — is preserved in G.retired instead of being deleted, so old players
// and legends never silently disappear. Only true filler is dropped, to keep
// the save bounded over decades.
function retireOrDrop(G, p){
  G.retired = G.retired || {};
  const ca = p.career || {};
  const notable = (ca.App||0)>=30 || (ca.G||0)>=15 || (p.peakOvr||p.ovr||0)>=72
    || (p.caps||0)>0 || p.hof || (p.history && p.history.some(h=>h.userClub));
  // remove from any live collections
  if(G.players[p.id]===p || G.players[p.id]) delete G.players[p.id];
  G.freeAgents = (G.freeAgents||[]).filter(x=>x.id!==p.id);
  if(notable){
    p.retired = true;
    if(p.retiredAge==null) p.retiredAge = p.age;
    if(p.retiredSeason==null) p.retiredSeason = G.season;
    p.teamId = null; p.years = 0; p.salary = 0;
    G.retired[p.id] = p;
  }
  // else: genuinely anonymous filler — let it go.
}
function youthIntake(G, club){
  const lvl = (club.academy && club.academy.level) || 1;
  const n = 3 + (chance(0.4+lvl*0.1)?1:0) + (lvl>=3&&chance(0.5)?1:0) + (lvl>=4&&chance(0.5)?1:0);
  const intake = [];
  for(let i=0;i<n;i++){
    const pos = pick(ALL_POS);
    const p = makePlayer(pos, [16,18], -10 + lvl*1.5);
    // give academy prospects real headroom (better academies -> higher ceilings)
    p.pot = clamp(Math.max(p.pot, p.ovr + rint(8, 14+lvl*3)), p.ovr, 99);
    p.teamId = club.id; p.salary = Math.min(p.salary, 0.4); p.years = rint(2,4); p.youth = true;
    G.players[p.id] = p; intake.push(p);
  }
  if(club.userControlled){
    G.youthIntake = intake.map(p=>({ id:p.id, name:p.name, pos:p.pos, ovr:p.ovr, pot:p.pot }));
    if(intake.length) logNews(G,"youth",`🎓 Youth intake: ${intake.map(p=>p.name+" ("+p.pos+" "+p.ovr+"→"+p.pot+")").join(", ")}`, club.id);
  }
}
// Refill a thin squad, targeting positional NEEDS (so every club keeps enough
// keepers, defenders, midfielders and forwards to field its formation naturally).
function refillSquad(G, club){
  let squad = Object.values(G.players).filter(p=>p.teamId===club.id && !p.youth);
  const adj = club.div===0 ? -2 : -8;
  const add = pos => { const p=makePlayer(pos,[18,29],adj); p.teamId=club.id; p.years=rint(1,3); G.players[p.id]=p; squad.push(p); };
  const has = arr => squad.filter(p=>arr.includes(p.pos)).length;
  const DEF=["RB","LB","CB","RWB","LWB"], MID=["CDM","CM","CAM","RM","LM"], ATT=["RW","LW","ST"];
  let guard=0;
  while(has(["GK"])<3 && guard++<40) add("GK");
  guard=0; while(has(DEF)<7 && guard++<40) add(pick(["CB","CB","RB","LB"]));
  guard=0; while(has(MID)<7 && guard++<40) add(pick(["CM","CM","CDM","CAM"]));
  guard=0; while(has(ATT)<5 && guard++<40) add(pick(["ST","RW","LW"]));
  guard=0; while(squad.length<23 && guard++<40) add(pick(ALL_POS));
  autoPickXI(club, G.players);
}

/* ----------------------------- youth (5v5) ----------------------------- */
// A lightweight youth setup: every club fields a small-sided youth side of its
// academy prospects (age <= 19). Game time accrues (youthApps) and accelerates
// their development at the season rollover. The user's youth game is simmed in
// detail each matchday for flavour; AI clubs just bank the game time.
// Academy membership is the p.youth flag (NOT age) so a player is only ever in
// the youth squad OR the senior squad, never both.
function youthProspects(G, clubId){
  return Object.values(G.players).filter(p=>p.teamId===clubId && p.youth)
    .sort((a,b)=> b.pot-a.pot || b.ovr-a.ovr);
}
// The 5-a-side youth XI: best keeper + four best outfielders.
function youthFive(G, clubId){
  const pros = youthProspects(G, clubId);
  const gk = pros.find(p=>p.pos==="GK");
  const out = pros.filter(p=>p.pos!=="GK").slice(0, gk?4:5);
  return (gk?[gk]:[]).concat(out);
}
function youthStrength(G, clubId){
  const five = youthFive(G, clubId);
  if(!five.length) return 45;
  return five.reduce((s,p)=>s+p.ovr,0)/five.length;
}
function simYouthMatch(G, home, away){
  const sh = youthStrength(G, home.id), sa = youthStrength(G, away.id);
  const xgH = clamp(1.5*Math.exp(0.045*(sh-sa)), 0.3, 4.5), xgA = clamp(1.5*Math.exp(0.045*(sa-sh)), 0.3, 4.5);
  const hs = poisson(xgH), as = poisson(xgA);
  const attackers = youthFive(G, home.id).filter(p=>p.pos!=="GK");
  const scorers = [];
  for(let i=0;i<hs;i++){ const sc = attackers.length?pick(attackers):youthFive(G,home.id)[0]; if(sc){ sc.youthG=(sc.youthG||0)+1; scorers.push(sc.name); } }
  return { opp: away.abbr, oppName: away.name, hs, as, scorers, day: G.day+1 };
}
function accrueYouth(G){
  // bank a youth appearance for each club's playing prospects
  G.clubs.forEach(c=>{ youthFive(G, c.id).forEach(p=>{ p.youthApps=(p.youthApps||0)+1; }); });
  // detailed youth fixture for the user's club
  const u = G.clubs[G.userTeamId];
  const pool = G.clubs.filter(c=>c.id!==u.id && c.country===u.country);
  if(pool.length) G.youthLast = simYouthMatch(G, u, pick(pool));
}

/* ----------------------------- hall of fame ---------------------------- */
function hallOfFameCheck(G){
  G.hof = G.hof || [];
  Object.values(G.players).forEach(p=>{
    if(p.age>=34 && (p.career.G>=120 || (p.peakOvr>=88 && p.career.App>=250) || (p.awards||0)>=2)){
      if(!p.hof){ p.hof=true; G.hof.unshift({ id:p.id, name:p.name, pos:p.pos, G:p.career.G, A:p.career.A, App:p.career.App, peak:p.peakOvr, season:G.season }); }
    }
  });
  if(G.hof.length>120) G.hof.length=120;
}

/* ----------------------------- internationals -------------------------- */
// A compact 4-nation tournament played in the international break (offseason).
// National teams are picked from every player by nationality (nat), independent
// of club. Caps & international goals persist on players. Toggle: internationals.
function intlOn(G){ return !G.settings || G.settings.internationals!==false; }
function eligibleNationals(G, country){
  return Object.values(G.players).filter(p=>p.nat===country && p.teamId!=null).sort((a,b)=>b.ovr-a.ovr);
}
// Pick a best XI ([{p,slot}]) from an explicit squad for a formation.
function pickXIFrom(squad, formation){
  const slots = FORMATIONS[formation] || FORMATIONS["4-3-3"];
  const used = new Set(); const out = new Array(slots.length).fill(null);
  const isKeeper = p => p.pos==="GK" || (p.positions||[]).includes("GK");
  const canPlay = (p,slot) => (p.positions||[p.pos]).includes(slot);
  const avail = () => squad.filter(p=>!used.has(p.id));
  slots.forEach((slot,i)=>{ if(slot!=="GK") return;
    const ks = avail().filter(isKeeper).sort((a,b)=>b.gk-a.gk);
    const pk = ks[0] || avail().sort((a,b)=>effRating(b,slot)-effRating(a,slot))[0];
    if(pk){ used.add(pk.id); out[i]={p:pk,slot}; } });
  const naturalCount = i => avail().filter(p=>canPlay(p,slots[i])).length;
  const outIdx = slots.map((s,i)=>i).filter(i=>slots[i]!=="GK").sort((a,b)=>naturalCount(a)-naturalCount(b));
  outIdx.forEach(i=>{ const slot=slots[i], pool=avail().filter(p=>!isKeeper(p));   // a keeper is never fielded outfield
    const nat = pool.filter(p=>canPlay(p,slot));
    const pk = nat.length ? nat.sort((a,b)=>b.ovr-a.ovr)[0] : pool.sort((a,b)=>effRating(b,slot)-effRating(a,slot))[0];
    if(pk){ used.add(pk.id); out[i]={p:pk,slot}; } });
  return out.filter(Boolean);
}
function unitFromLineup(lineup){
  let dS=0,dN=0,mS=0,mN=0,aS=0,aN=0,gk=50;
  lineup.forEach(({p,slot})=>{ const er=effRating(p,slot), b=BAND[slot];
    if(slot==="GK"){ gk=p.gk; return; }
    if(b<=2){ dS+=er; dN++; } else if(b===3){ mS+=er; mN++; } else { aS+=er; aN++; }
    if(b===2){ mS+=er*0.5; mN+=0.5; } });
  return { DEF:(dN?dS/dN:50)*0.7+gk*0.3, MID:mN?mS/mN:50, ATT:aN?aS/aN:50, gk };
}
// Sim one national-team match between two {ci,name,flag,xi} sides. Credits caps to
// everyone who played and international goals to scorers. Returns the result + scorers.
function simNationMatch(A, B, opts={}){
  MORALE_ON = false;   // internationals ignore club morale/form for a neutral feel
  const uA=unitFromLineup(A.xi), uB=unitFromLineup(B.xi);
  const aAtt=(0.55*n01(uA.ATT)+0.30*n01(uA.MID)+0.15*n01(uA.DEF));
  const aDef=(0.55*n01(uA.DEF)+0.30*n01(uA.MID)+0.15*n01(uA.ATT));
  const bAtt=(0.55*n01(uB.ATT)+0.30*n01(uB.MID)+0.15*n01(uB.DEF));
  const bDef=(0.55*n01(uB.DEF)+0.30*n01(uB.MID)+0.15*n01(uB.ATT));
  const xgA=clamp(1.32*Math.exp(1.7*(aAtt-bDef))*(opts.neutral?1:1.06),0.15,5.5);
  const xgB=clamp(1.32*Math.exp(1.7*(bAtt-aDef))*(opts.neutral?1:0.96),0.15,5.5);
  let hs=poisson(xgA), as=poisson(xgB);
  if(opts.mustDecide && hs===as){ if(chance(clamp(0.5+(uA.ATT-uB.ATT)/40,0.1,0.9))) hs++; else as++; }
  A.xi.concat(B.xi).forEach(({p})=>{ p.caps=(p.caps||0)+1; });
  const scorersOf=(side,n)=>{ const out=[]; for(let i=0;i<n;i++){ const sc=wpick(side,o=>(SCORE_W[o.slot]||0)*(0.5+n01(o.p.sho))*(hasTrait(o.p,"poacher")?1.5:1)); if(sc){ sc.p.intlG=(sc.p.intlG||0)+1; out.push(sc.p.name); } } return out; };
  return { hs, as, aScorers:scorersOf(A.xi,hs), bScorers:scorersOf(B.xi,as) };
}
// Finish the round-robin (remaining fixtures) then play a final between top 2.
function playIntlTournament(G){
  const cycle = ensureIntlCycle(G);
  // play any remaining in-season fixtures not yet done (in case offseason button pressed early)
  while(cycle.breaksPlayed < 2) playIntlBreak(G);
  // remaining round-robin fixtures (fixtures 4,5 of 6)
  const nations = COUNTRIES.map((C,ci)=>({ ci, name:C.name, flag:C.flag,
    xi: pickXIFrom(eligibleNationals(G,ci).slice(0,23), "4-3-3"),
    pld:cycle.nations[ci].pld, w:cycle.nations[ci].w, d:cycle.nations[ci].d,
    l:cycle.nations[ci].l, pts:cycle.nations[ci].pts, gf:cycle.nations[ci].gf, ga:cycle.nations[ci].ga }));
  const remaining = [[0,3],[1,2]];
  const group = cycle.nations.flatMap(n=>n.results.map(r=>({a:n.ci,b:r.vs,hs:r.hs,as:r.as})));
  remaining.forEach(([i,j])=>{ const a=nations[i], b=nations[j]; const r=simNationMatch(a,b,{});
    a.pld++; b.pld++; a.gf+=r.hs; a.ga+=r.as; b.gf+=r.as; b.ga+=r.hs;
    if(r.hs>r.as){ a.w++; a.pts+=3; b.l++; } else if(r.hs<r.as){ b.w++; b.pts+=3; a.l++; } else { a.d++; b.d++; a.pts++; b.pts++; }
    group.push({ a:a.ci, b:b.ci, hs:r.hs, as:r.as });
    logNews(G,"intl",`🌐 Intl Cup: ${COUNTRIES[i].flag} ${COUNTRIES[i].name} ${r.hs}-${r.as} ${COUNTRIES[j].flag} ${COUNTRIES[j].name}`,null);
  });
  const rank = nations.slice().sort((a,b)=>b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
  const fr = simNationMatch(rank[0], rank[1], { mustDecide:true, neutral:true });
  const champ = fr.hs>=fr.as ? rank[0] : rank[1];
  const runner = champ===rank[0] ? rank[1] : rank[0];
  G.intl = G.intl || { history:[], lastPlayed:null };
  const entry = { season:G.season, champ:champ.ci, runnerUp:runner.ci,
    table: rank.map(n=>({ ci:n.ci, pld:n.pld, w:n.w, d:n.d, l:n.l, gf:n.gf, ga:n.ga, pts:n.pts })),
    group, final:{ a:rank[0].ci, b:rank[1].ci, hs:fr.hs, as:fr.as, aScorers:fr.aScorers, bScorers:fr.bScorers } };
  G.intl.history.unshift(entry);
  if(G.intl.history.length>60) G.intl.history.length=60;
  G.intl.lastPlayed = G.season;
  G.intlCycle = null;   // reset for the next season's breaks
  const userCountry = (G.clubs[G.userTeamId]||{}).country||0;
  logNews(G, "intl", `🌐 ${COUNTRIES[champ.ci].flag} ${COUNTRIES[champ.ci].name} win the International Cup!`, null);
  if(champ.ci===userCountry) logNews(G, "intl", `🎉 Your nation are international champions!`, G.userTeamId);
  return entry;
}

// International break: each nation plays two fixtures (round-robin of 4 nations,
// 3 matchdays total split across the two in-season breaks + offseason final).
// Break 1 (MD10): fixtures 0,1 (N1vsN2, N3vsN4)
// Break 2 (MD26): fixtures 2,3 (N1vsN3, N2vsN4)
// Offseason: fixtures 4,5 (N1vsN4, N2vsN3) + final (top2)
// Caps + intl goals accrue each time.
function intlBreakFixtures(breakNum){ return breakNum===0?[[0,1],[2,3]]:[[0,2],[1,3]]; }
function ensureIntlCycle(G){
  if(!G.intlCycle || G.intlCycle.season!==G.season){
    G.intlCycle = {
      season: G.season,
      nations: COUNTRIES.map((_,ci)=>({ ci, pld:0,w:0,d:0,l:0,gf:0,ga:0,pts:0, results:[] })),
      breaksPlayed: 0
    };
  }
  return G.intlCycle;
}
function playIntlBreak(G){
  const cycle = ensureIntlCycle(G);
  const breakIdx = cycle.breaksPlayed;
  const fx = intlBreakFixtures(breakIdx);
  const userCountry = (G.clubs[G.userTeamId]||{}).country||0;
  const label = breakIdx===0 ? "Intl Break 1" : "Intl Break 2";
  fx.forEach(([ai,bi])=>{
    const a = { ci:ai, xi: pickXIFrom(eligibleNationals(G,ai).slice(0,23),"4-3-3"), pld:0,w:0,d:0,l:0,gf:0,ga:0,pts:0 };
    const b = { ci:bi, xi: pickXIFrom(eligibleNationals(G,bi).slice(0,23),"4-3-3"), pld:0,w:0,d:0,l:0,gf:0,ga:0,pts:0 };
    const r = simNationMatch(a, b, {});
    const ta=cycle.nations[ai], tb=cycle.nations[bi];
    ta.pld++; tb.pld++; ta.gf+=r.hs; ta.ga+=r.as; tb.gf+=r.as; tb.ga+=r.hs;
    if(r.hs>r.as){ta.w++;ta.pts+=3;tb.l++;}else if(r.hs<r.as){tb.w++;tb.pts+=3;ta.l++;}else{ta.d++;tb.d++;ta.pts++;tb.pts++;}
    ta.results.push({vs:bi,hs:r.hs,as:r.as}); tb.results.push({vs:ai,hs:r.as,as:r.hs});
    const aC=COUNTRIES[ai], bC=COUNTRIES[bi];
    if(ai===userCountry||bi===userCountry){
      const userHome=ai===userCountry;
      const hs=userHome?r.hs:r.as, as=userHome?r.as:r.hs;
      const m={season:G.season,comp:label,homeName:aC.flag+" "+aC.name,awayName:bC.flag+" "+bC.name,
               home:aC.flag+aC.name.slice(0,3),away:bC.flag+bC.name.slice(0,3),
               hs:r.hs,as:r.as,hScorers:[],aScorers:[],motm:null,stat:null,timeline:[]};
      if(G._lmDay!==G.day){G.lastMatches=[];G._lmDay=G.day;}
      G.lastMatches.push(m); G.lastMatch=m;
    }
    logNews(G,"intl",`🌐 ${label}: ${aC.flag} ${aC.name} ${r.hs}-${r.as} ${bC.flag} ${bC.name}`,null);
  });
  cycle.breaksPlayed++;
  G.intlCycle = cycle;
}

/* ----------------------------- preseason ------------------------------- */
// Optional preseason tour played in the offseason: four friendlies for flavour,
// tour income, and a small morale/form lift heading into the new campaign.
// Friendlies don't touch league tables or season stats.
function playPreseason(G){
  const user = G.clubs[G.userTeamId];
  const opps = G.clubs.filter(c=>c.id!==user.id).slice().sort(()=>_rng()-0.5).slice(0,4);
  const results = opps.map(o=>{
    const sh=clubStrength(user,G.players), sa=clubStrength(o,G.players);
    const xgH=clamp(1.4*Math.exp(0.05*(sh-sa)),0.3,4.5), xgA=clamp(1.4*Math.exp(0.05*(sa-sh)),0.3,4.5);
    return { opp:o.abbr, oppName:o.name, hs:poisson(xgH), as:poisson(xgA) };
  });
  const income = round(stadiumCapacity(user)/1000 * (user.div===0?0.9:0.5) *10)/10;
  user.budget = round((user.budget + income)*10)/10;
  Object.values(G.players).filter(p=>p.teamId===user.id).forEach(p=>{
    p.morale = clamp((p.morale==null?70:p.morale)+5, 0, 100);
    p.form = clamp((p.form==null?6.7:p.form)+0.3, 4, 10);
  });
  G.preseason = { season:G.season, results, income };
  logNews(G, "finance", `🏝️ Preseason tour earned ${money(income)} and sharpened the squad.`, user.id);
  return G.preseason;
}

/* ----------------------------- transfers ------------------------------- */
// Buy a player from another club: pay the fee from your budget; he joins your squad.
// Paid transfers (buy/sell) + AI bids only happen in the summer or January window.
// Free agents (out-of-contract) can still be signed any time, as in real football.
function transferWindowOpen(G){
  if(G.phase==="offseason") return true;
  if(G.phase!=="regular") return false;
  return G.day<=2 || (G.day>=18 && G.day<=21);   // summer tail + January
}
function transferWindowLabel(G){
  if(G.phase==="offseason") return "🟢 Summer transfer window open";
  if(transferWindowOpen(G)) return G.day<=2 ? "🟢 Summer window — closes after matchday 3" : "🟢 January window — closes after matchday 22";
  if(G.day<18) return `🔴 Window closed — January opens at matchday 19 (in ${19-G.day})`;
  return "🔴 Window closed — reopens in the summer";
}
function buyPlayer(G, p, fee, opts={}){
  const buyer = G.clubs[G.userTeamId];
  if(!transferWindowOpen(G)) return { ok:false, msg:"The transfer window is closed." };
  if(buyer.budget < fee) return { ok:false, msg:"Not enough budget for that fee." };
  const seller = p.teamId!=null ? G.clubs[p.teamId] : null;
  buyer.budget = round((buyer.budget - fee)*10)/10;
  if(seller){ seller.budget = round((seller.budget + fee)*10)/10; }
  // a sell-on agreed with the selling club is owed on our NEXT sale of this player
  p.sellOn = (opts.sellOnPct && seller) ? { pct:opts.sellOnPct, toClubId:seller.id } : null;
  p.teamId = buyer.id; p.years = Math.max(p.years||0, rint(2,4)); p.salary = wageFor(p);
  p.release = opts.release!=null ? opts.release : round(playerValue(p)*2*10)/10;   // new deal carries a fresh release clause
  autoPickXI(buyer, G.players);
  logNews(G,"transfer",`➡️ Signed ${p.pos} ${p.name} (${p.ovr}) for ${money(fee)}${opts.via==="release"?" (release clause)":""}`, buyer.id);
  ensureCareer(G); G.career.transferSpend = round((G.career.transferSpend+fee)*10)/10;
  return { ok:true };
}
// Sell one of your players to an AI club for a fee. Honors any sell-on owed to a former club.
function sellPlayer(G, p, fee, toClubId){
  if(!transferWindowOpen(G)) return false;
  const seller = G.clubs[G.userTeamId];
  const buyer = toClubId!=null ? G.clubs[toClubId] : null;
  let proceeds = fee;
  if(p.sellOn && G.clubs[p.sellOn.toClubId] && p.sellOn.toClubId!==seller.id){
    const cut = round(fee*(p.sellOn.pct/100)*10)/10;
    proceeds = round((fee-cut)*10)/10;
    G.clubs[p.sellOn.toClubId].budget = round((G.clubs[p.sellOn.toClubId].budget+cut)*10)/10;
    logNews(G,"transfer",`💸 ${money(cut)} of the ${p.name} fee went to ${G.clubs[p.sellOn.toClubId].abbr} (sell-on)`, seller.id);
  }
  seller.budget = round((seller.budget + proceeds)*10)/10;
  p.sellOn = null;
  if(buyer){ buyer.budget = round(Math.max(0, buyer.budget - fee)*10)/10; p.teamId = buyer.id; autoPickXI(buyer, G.players); }
  else { p.teamId = null; G.freeAgents=G.freeAgents||[]; G.freeAgents.push(p); }
  autoPickXI(seller, G.players);
  logNews(G,"transfer",`⬅️ Sold ${p.pos} ${p.name} (${p.ovr}) for ${money(fee)}`, seller.id);
  ensureCareer(G); G.career.transferIncome = round((G.career.transferIncome+proceeds)*10)/10;
}
// AI clubs occasionally bid for your best/surplus players.
function generateTransferOffers(G){
  G.transferOffers = G.transferOffers || [];
  if(!transferWindowOpen(G)) return;
  if(G.transferOffers.length>=4) return;
  const squad = Object.values(G.players).filter(p=>p.teamId===G.userTeamId && !p.youth);
  if(squad.length<=18) return;
  // unsettled or transfer-listed players attract far more interest
  const target = wpick(squad, p=>p.value * (p.wantsOut?6:1) * (p.listed?4:1));
  if(!target) return;
  const suitors = G.clubs.filter(c=>c.id!==G.userTeamId && c.budget>target.value*1.1);
  if(!suitors.length) return;
  const by = pick(suitors);
  // if the player has a release clause a suitor can afford, they'll often just meet it
  const clauseMet = target.release!=null && by.budget>=target.release && chance(0.6);
  const fee = clauseMet ? target.release : round(target.value * ((target.wantsOut||target.listed?0.8:0.9) + _rng()*0.6) *10)/10;
  G.transferOffers.push({ id:"of"+Date.now()+Math.floor(_rng()*999), playerId:target.id, by:by.id, fee, release:clauseMet });
  logNews(G,"offer",`💬 ${by.name} ${clauseMet?"triggered the release clause for":"bid "+money(fee)+" for"} ${target.name}`, G.userTeamId);
}
// Sign an out-of-contract free agent (no fee; wage only). Squad cap keeps it sane.
function signFreeAgent(G, p){
  const club = G.clubs[G.userTeamId];
  const squad = Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth);
  if(squad.length>=30) return { ok:false, msg:"Senior squad is full (30)." };
  G.freeAgents = (G.freeAgents||[]).filter(x=>x.id!==p.id);
  p.teamId = club.id; p.years = rint(1,3); p.salary = wageFor(p);
  G.players[p.id] = p;
  autoPickXI(club, G.players);
  logNews(G,"sign",`✍️ Signed free agent ${p.pos} ${p.name} (${p.ovr})`, club.id);
  return { ok:true };
}
function wageBill(G, clubId){
  return round(Object.values(G.players).filter(p=>p.teamId===clubId).reduce((s,p)=>s+(p.salary||0),0)*10)/10;
}

/* ----------------------------- loans ----------------------------------- */
// A loaned player plays for (and develops at) the destination club this season, then returns to
// his owner at the rollover. p.loanOwner = the club he belongs to; p.teamId = where he's playing now.
function isLoaned(p){ return p && p.loanOwner!=null; }
function loanOut(G, p, toClubId){
  if(!transferWindowOpen(G)) return { ok:false, msg:"Loans only happen in the transfer window." };
  if(p.teamId!==G.userTeamId || isLoaned(p)) return { ok:false, msg:"Can't loan that player out." };
  const to = G.clubs[toClubId]; if(!to || to.id===G.userTeamId) return { ok:false, msg:"No club to loan to." };
  if(p.youth) return { ok:false, msg:"Promote him to the senior squad before loaning him out." };
  if(Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth).length<=16) return { ok:false, msg:"Senior squad too thin to loan anyone out." };
  p.loanOwner = G.userTeamId; p.loanUntil = G.season; p.teamId = to.id;
  autoPickXI(G.clubs[G.userTeamId], G.players); autoPickXI(to, G.players);
  logNews(G,"loan",`📤 Loaned ${p.pos} ${p.name} (${p.ovr}) to ${to.name} for the season`, G.userTeamId);
  return { ok:true };
}
// pick a sensible destination — a weaker club that will actually play him
function loanOutAuto(G, p){
  const cands = G.clubs.filter(c=>c.id!==G.userTeamId && Object.values(G.players).filter(x=>x.teamId===c.id && !x.youth).length<30);
  if(!cands.length) return { ok:false, msg:"No club available to take him." };
  cands.sort((a,b)=>clubStrength(a,G.players)-clubStrength(b,G.players));
  const to = cands[rint(0, Math.min(7, cands.length-1))];
  return loanOut(G, p, to.id);
}
function loanIn(G, p){
  if(!transferWindowOpen(G)) return { ok:false, msg:"Loans only happen in the transfer window." };
  if(p.teamId==null || p.teamId===G.userTeamId || isLoaned(p)) return { ok:false, msg:"Can't loan that player in." };
  if(Object.values(G.players).filter(x=>x.teamId===G.userTeamId && !x.youth).length>=30) return { ok:false, msg:"Senior squad is full (30)." };
  const from = G.clubs[p.teamId];
  p.loanOwner = p.teamId; p.loanUntil = G.season; p.teamId = G.userTeamId;
  autoPickXI(G.clubs[G.userTeamId], G.players); if(from) autoPickXI(from, G.players);
  logNews(G,"loan",`📥 Loaned in ${p.pos} ${p.name} (${p.ovr}) from ${from?from.name:"?"} for the season`, G.userTeamId);
  return { ok:true };
}
// Return all loanees to their owners (run at the rollover, before develop/contracts).
function returnLoans(G){
  Object.values(G.players).forEach(p=>{
    if(p.loanOwner==null) return;
    const ownerId = p.loanOwner, involvedUser = (p.teamId===G.userTeamId || ownerId===G.userTeamId);
    if(G.clubs[ownerId]){ p.teamId = ownerId; if(involvedUser) logNews(G,"loan",`🔙 ${p.pos} ${p.name} returns from loan`, ownerId); }
    p.loanOwner = null; p.loanUntil = null;
  });
}

/* ----------------------------- owner ----------------------------------- */
function setOwnerExpectation(G){
  const c = G.clubs[G.userTeamId];
  if(c.div===1){ G.expectation = { text:"Win promotion back to the "+divName(c.country||0,0), target:"promo" }; return; }
  const last = (c.history||[]).slice(-1)[0];
  const lastPos = last ? last.pos : 12;
  if(lastPos<=4) G.expectation = { text:"Challenge for the title (top 3)", target:"top3" };
  else if(lastPos<=10) G.expectation = { text:"Finish in the top half", target:"top10" };
  else G.expectation = { text:"Avoid relegation", target:"safe" };
}

/* ----------------------------- job security ---------------------------- */
// Board confidence (0-100) reacts to match results during the season and to
// whether the club meets its owner's expectation. Bottom out → sacked, with
// job offers to continue a career elsewhere. All gated by settings.jobSecurity.
function jobSecurityOn(G){ return !G.settings || G.settings.jobSecurity!==false; }
function expTargetPos(G){
  const t=(G.expectation||{}).target;
  if(t==="promo"||t==="top3") return 3;
  if(t==="top10") return 10;
  return 17;   // "safe" — anything above the drop zone
}
function confLabel(c){ return c>=80?"Secure":c>=60?"Backed":c>=40?"Watching":c>=20?"Under pressure":"On the brink"; }
function bumpConfidenceForResult(G, win, draw, mult=1){
  if(!jobSecurityOn(G)) return;
  if(G.boardConfidence==null) G.boardConfidence=60;
  G.boardConfidence = clamp(G.boardConfidence + (win?4: draw?0.5: -4)*mult, 0, 100);
}
// Pick clubs that would hire the user right now (a sacking) or come calling
// (a poaching approach when overperforming). Returns up to 3 offers.
function generateJobOffers(G, kind){
  const cur = G.clubs[G.userTeamId];
  const curStr = clubStrength(cur, G.players);
  let pool = G.clubs.filter(c=>c.id!==G.userTeamId && !c.userControlled);
  if(kind==="approach"){
    // bigger / stronger clubs poaching an overperformer
    pool = pool.filter(c=>clubStrength(c,G.players) > curStr+3).sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players));
  } else {
    // after a sacking: clubs roughly at or below the user's level, vacancy-style
    pool = pool.filter(c=>clubStrength(c,G.players) <= curStr+4).sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players));
    if(pool.length<3) pool = G.clubs.filter(c=>c.id!==G.userTeamId && !c.userControlled).sort((a,b)=>clubStrength(b,G.players)-clubStrength(a,G.players));
  }
  return pool.slice(0,3).map(c=>({ id:c.id, name:c.name, div:c.div, country:c.country||0, str:clubStrength(c,G.players), kind }));
}
// Unhappy players agitate to leave; a settled one withdraws. Gated by morale setting.
// A good player left out of the XI grows restless ("play me or sell me").
function processTransferRequests(G){
  if(!G.settings || G.settings.morale===false) return;
  if(G.day<6) return;   // give the season a few games before anyone agitates
  const user = G.clubs[G.userTeamId];
  const inXI = new Set(user.xi||[]);
  Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth).forEach(p=>{
    const benchedStar = p.ovr>=70 && !inXI.has(p.id) && !isInjured(p);
    if(benchedStar){ p.morale = clamp((p.morale==null?60:p.morale)-2, 0, 100); }   // wants first-team football
    if(p.wantsOut){
      p.morale = clamp((p.morale==null?60:p.morale)-1, 0, 100);   // unrest festers until resolved
      if((p.morale||60) >= 60){ p.wantsOut=false; logNews(G,"morale",`🙂 ${p.name} has settled and withdrawn his transfer request.`, user.id); }
    } else if(((p.morale==null?60:p.morale) < 32 || (benchedStar && (p.morale||60)<45)) && p.ovr>=64 && chance(0.07)){
      p.wantsOut=true; logNews(G,"morale",`📨 ${p.name} has handed in a transfer request — sell him or win him back with game time.`, user.id);
    }
  });
}
function takeJob(G, clubId){
  const old=G.clubs[G.userTeamId]; if(old) old.userControlled=false;
  G.userTeamId=clubId;
  const nc=G.clubs[clubId]; nc.userControlled=true;
  G.boardConfidence=58; G.pendingSack=false; G.jobOffers=null; G.lastMatch=null; G.lastMatches=[];
  setOwnerExpectation(G);
  logNews(G,"job",`📝 Appointed manager of ${nc.name}`, clubId);
  ensureCareer(G);
  const cur=G.career.clubsManaged[G.career.clubsManaged.length-1];
  if(cur && cur.to==null) cur.to=G.season;
  G.career.clubsManaged.push({ id:clubId, name:nc.name, abbr:nc.abbr, from:G.season, to:null });
}

/* ----------------------------- manager career / legacy ------------------ */
// Tracks the human manager's WHOLE career, independent of which club they're
// currently at — survives job changes via takeJob. Trophies are derived (not
// counted live) by scanning each managed club's honours within the season
// range the user was actually in charge there, so nothing can drift out of sync.
function ensureCareer(G){
  if(!G.career){
    const c=G.clubs[G.userTeamId];
    G.career={ seasonsManaged:0, transferSpend:0, transferIncome:0, academyGraduates:0,
      clubsManaged: c ? [{ id:c.id, name:c.name, abbr:c.abbr, from:G.season, to:null }] : [] };
  }
  if(!Array.isArray(G.career.clubsManaged)) G.career.clubsManaged=[];
}
function careerTrophies(G){
  ensureCareer(G);
  let trophies=[];
  G.career.clubsManaged.forEach(span=>{
    const club=G.clubs[span.id]; if(!club) return;
    (club.honours||[]).forEach(h=>{ if(h.season>=span.from && (span.to==null||h.season<=span.to)) trophies.push({...h, club:club.abbr}); });
  });
  return trophies;
}

/* ----------------------------- news ------------------------------------ */
function logNews(G, type, msg, teamId){
  if(!G) return;
  if(!Array.isArray(G.news)) G.news=[];
  G.news.unshift({ season:G.season, day:(G.day||0)+1, phase:G.phase, type, msg, teamId: teamId==null?null:teamId });
  if(G.news.length>250) G.news.length=250;
}

const LZ_PREFIX = "~LZ~";

function listSlots(){
  try{ const a = JSON.parse(localStorage.getItem(SLOT_INDEX)||"[]"); return Array.isArray(a)?a.sort((x,y)=>y.updated-x.updated):[]; }
  catch(e){ return []; }
}
function saveGame(G){
  try{
    if(!G.slotId) G.slotId = "s" + Date.now() + Math.floor(Math.random()*999);
    const blob = encodeSave(G);
    try{ localStorage.setItem(slotKey(G.slotId), blob); }
    catch(quota){ // storage near full (e.g. a legacy uncompressed save) — free the old value first, then retry
      try{ localStorage.removeItem(slotKey(G.slotId)); localStorage.setItem(slotKey(G.slotId), blob); }
      catch(e2){ return false; }
    }
    const u = G.clubs[G.userTeamId];
    const idx = listSlots().filter(s=>s.id!==G.slotId);
    idx.push({ id:G.slotId, club:u?u.name:"—", abbr:u?u.abbr:"", season:G.season, day:(G.day||0)+1, phase:G.phase, updated:Date.now() });
    localStorage.setItem(SLOT_INDEX, JSON.stringify(idx));
    return true;
  }catch(e){ return false; }
}
function loadSlot(id){
  try{ const g = decodeSave(localStorage.getItem(slotKey(id))); return g?migrate(g):null; }catch(e){ return null; }
}
function deleteSlot(id){
  try{ localStorage.removeItem(slotKey(id)); localStorage.setItem(SLOT_INDEX, JSON.stringify(listSlots().filter(s=>s.id!==id))); }catch(e){}
}
function migrate(G){
  if(!G || !Array.isArray(G.clubs)) return G;
  try{
    let maxId=0; Object.values(G.players||{}).forEach(p=>{ if(typeof p.id==="number"&&p.id>maxId) maxId=p.id; });
    (G.freeAgents||[]).forEach(p=>{ if(p&&typeof p.id==="number"&&p.id>maxId) maxId=p.id; });
    Object.values(G.retired||{}).forEach(p=>{ if(p&&typeof p.id==="number"&&p.id>maxId) maxId=p.id; });
    uid.atLeast(maxId);
    if(!Array.isArray(G.news)) G.news=[];
    if(!Array.isArray(G.freeAgents)) G.freeAgents=[];
    if(!Array.isArray(G.transferOffers)) G.transferOffers=[];
    if(!Array.isArray(G.champions)) G.champions=[];
    if(!Array.isArray(G.contChampions)) G.contChampions=[];
    if(!Array.isArray(G.awardHistory)) G.awardHistory=[];
    if(!Array.isArray(G.hof)) G.hof=[];
    if(!G.settings) G.settings={ injuries:true };
    Object.values(G.players||{}).forEach(p=>{ if(p.fitness==null) p.fitness=100; });
    // multi-country migration: default legacy clubs to country 0, build per-country cups
    G.clubs.forEach(c=>{ if(c.country==null) c.country=0; });
    if(!Array.isArray(G.cups)){ if(G.cup){ G.cup.country=0; G.cups=[G.cup]; } else initCups(G); delete G.cup; }
    G.cups.forEach(cup=>{ if(cup.country==null) cup.country=0; if(cup.runnerUp===undefined) cup.runnerUp=null; });
    if(!G.contCup || !G.contCup.phase) initContCup(G);   // (re)build into the group-stage format
    // backfill newer per-player stat fields (shots, key passes, xG, saves, bans)
    const fill = s => { if(s){ NEW_STAT_KEYS.forEach(k=>{ if(s[k]==null) s[k]=0; }); } };
    const fillP = p => { if(p.nat==null) p.nat=rint(0,NUM_COUNTRIES-1); if(!Array.isArray(p.history)) p.history=[]; if(p.youth && p.age>=20) p.youth=false; if(!Array.isArray(p.traits)) p.traits=rollTraits(p); if(p.form==null) p.form=6.7; if(p.morale==null) p.morale=rint(60,80); };
    const fillCS = p => { if(p.compStats) for(const k in p.compStats) fill(p.compStats[k]); };
    // Seed per-competition career totals. Pre-feature saves have no comp split, so
    // assume the accumulated career was league play (Cup/Champs Cup start fresh and
    // grow from here); fill each comp bucket's newer stat fields.
    const fillCareerComp = p => {
      if(!p.careerComp){ p.careerComp = { L: Object.assign(emptyStats(), p.career||{}) }; }
      for(const k in p.careerComp) fill(p.careerComp[k]);
    };
    Object.values(G.players||{}).forEach(p=>{ fill(p.stats); fill(p.career); fillCS(p); fillCareerComp(p); if(p.susp==null) p.susp=0; if(p.ycCount==null) p.ycCount=0; fillP(p); });
    (G.freeAgents||[]).forEach(p=>{ fill(p.stats); fill(p.career); fillCS(p); fillCareerComp(p); fillP(p); });
    G.clubs.forEach(c=>{ if(!c.formation) c.formation="4-3-3"; if(!c.tactic) c.tactic="balanced"; if(!c.academy) c.academy={level:1}; if(!Array.isArray(c.honours)) c.honours=[]; ensureStands(c); c.capacity=stadiumCapacity(c); ensureCommercials(G,c); if(!c.setPieces) c.setPieces={pen:null,fk:null,corner:null}; if(c.ticketTier==null) c.ticketTier=1; if(c.concessionTier==null) c.concessionTier=1; if(c.seasonGate==null) c.seasonGate=0; if(c.seasonConcession==null) c.seasonConcession=0; if(!Array.isArray(c.gateLog)) c.gateLog=[]; ensureXI(c, G.players); });
    if(!G.clubs.some(c=>c.rivalId!=null)) assignRivals(G.clubs);
    if(!G.expectation) setOwnerExpectation(G);
    // history/records + feature-toggle backfill
    if(!Array.isArray(G.finalsArchive)) G.finalsArchive = [];
    if(!G.records || typeof G.records!=="object") G.records = { players:{}, biggestWin:null };
    if(!G.records.players) G.records.players = {};
    G.settings = G.settings || {};
    const defs = { injuries:true, jobSecurity:true, morale:true, internationals:true, watchMatches:false };
    for(const k in defs){ if(G.settings[k]==null) G.settings[k]=defs[k]; }
    if(G.boardConfidence==null) G.boardConfidence=60;
    if(G.pendingSack==null) G.pendingSack=false;
    if(!G.intl || typeof G.intl!=="object") G.intl={ history:[], lastPlayed:null };
    if(!Array.isArray(G.intl.history)) G.intl.history=[];
    if(!Array.isArray(G.trebles)) G.trebles=[];
    if(G.intlCycle===undefined) G.intlCycle=null;
    if(!G.retired || typeof G.retired!=="object") G.retired={};
    ensureCareer(G);
    G.version = SAVE_VERSION;
  }catch(e){}
  return G;
}
function exportSave(G){
  try{
    const blob = new Blob([JSON.stringify(G)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const u = G.clubs[G.userTeamId];
    a.href=url; a.download=`pocketgm-soccer-${u?u.abbr:"save"}-${G.season}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000); return true;
  }catch(e){ return false; }
}
function importSave(file, onLoad){
  const r = new FileReader();
  r.onload = e=>{ try{ const g=migrate(JSON.parse(e.target.result)); if(g&&Array.isArray(g.clubs)) onLoad(g); else alert("Not a valid Pocket GM Soccer save."); }catch(err){ alert("Couldn't read that save file."); } };
  r.readAsText(file);
}

/* ----------------------------- new game -------------------------------- */
function newGame(userTeamId, opts={}){
  const { clubs, players } = generateLeague(userTeamId, opts);
  const G = {
    season: 2026, day: 0, phase: "regular", version: SAVE_VERSION,
    seed: (opts && opts.seed!=null && !Number.isNaN(opts.seed)) ? (opts.seed>>>0) : null,
    userTeamId, clubs, players,
    schedule: buildSchedule(clubs),
    freeAgents: [], transferOffers: [], news: [], champions: [], contChampions: [], awardHistory: [], hof: [],
    cups: null, contCup: null, lastMatch: null, lastMatches: [],
    finalsArchive: [], records: { players:{}, biggestWin:null }, trebles: [],
    intl: { history:[], lastPlayed:null },
    boardConfidence: 60, pendingSack: false, jobOffers: null,
    career: { seasonsManaged:0, transferSpend:0, transferIncome:0, academyGraduates:0,
      clubsManaged: [{ id:userTeamId, name:clubs[userTeamId].name, abbr:clubs[userTeamId].abbr, from:2026, to:null }] },
    settings: { injuries:true, jobSecurity:true, morale:true, internationals:true, watchMatches:false },
  };
  // seed a free-agent pool sized for a bigger world
  for(let i=0;i<90;i++){ const p=makePlayer(pick(ALL_POS),[20,33],-4); p.teamId=null; G.freeAgents.push(p); }
  initCups(G);
  initContCup(G);
  setOwnerExpectation(G);
  return G;
}

function Badge({children}){ return <span className="px-2 py-1 rounded bg-[#16213a] text-slate-200 tnum text-xs">{children}</span>; }
function Card({children, className=""}){ return <div className={"bg-[#101a30] border border-[#1d2940] rounded-xl p-4 "+className}>{children}</div>; }
function OvrPill({v}){
  const c = v>=80?"bg-emerald-500 text-slate-900":v>=70?"bg-lime-500 text-slate-900":v>=60?"bg-yellow-500 text-slate-900":v>=50?"bg-orange-500 text-slate-900":"bg-slate-600 text-slate-100";
  return <span className={"inline-block w-8 text-center rounded font-bold text-xs py-0.5 "+c}>{v}</span>;
}
function PotPill({v}){ return <span className="inline-block w-8 text-center rounded font-semibold text-xs py-0.5 border border-amber-500/50 text-amber-300/90" title="Potential">{v}</span>; }
// ---- Scouting fog: unproven players (youth, low pro experience) show a SCOUTED rating that can be
// off and converges to the truth as they rack up appearances. Deterministic per id; AI/sim use TRUE.
function scoutApps(p){ return ((p.career&&p.career.App)||0) + ((p.stats&&p.stats.App)||0); }
function scoutConf(p){ if(!p) return 1; let c=clamp(scoutApps(p)/55, 0, 1); if(p.youth) c=Math.min(c,0.30); c=clamp(c+(p.age-17)*0.025, 0, 1); return c; }
function scoutBias(p){ return (mulberry32((p.id>>>0)||1)()*2-1)*8; }
function scoutedOvr(p){ const c=scoutConf(p); return clamp(Math.round(p.ovr + scoutBias(p)*(1-c)), 20, 99); }
function scoutedPot(p){ const c=scoutConf(p); return clamp(Math.round(p.pot + scoutBias(p)*(1-c)*1.1), 20, 99); }
function ScoutOvrPill({p}){ const c=scoutConf(p); if(c>=0.85) return <OvrPill v={p.ovr} />;
  return <span className="inline-flex items-center" title={`Scouted ~${Math.round(c*100)}% — firms up with appearances`}><OvrPill v={scoutedOvr(p)} /><span className="text-slate-500 text-[9px] ml-0.5">~</span></span>; }
function ScoutPotPill({p}){ const c=scoutConf(p); if(c>=0.85) return <PotPill v={p.pot} />;
  return <span className="inline-flex items-center" title={`Scouted ceiling ~${Math.round(c*100)}%`}><PotPill v={scoutedPot(p)} /><span className="text-amber-500/60 text-[9px] ml-0.5">~</span></span>; }
function PName({p, className=""}){
  const open = React.useContext(PlayerCtx);
  return <button onClick={()=>open&&open(p)} className={"text-left hover:text-emerald-300 "+className}>{p.name}</button>;
}

function Squad({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];

  // Senior squad only — academy players live in the Youth tab.
  let squad = Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth);
  squad.sort((a,b)=> sort==="ovr"? b.ovr-a.ovr : sort==="pos"? BAND[a.pos]-BAND[b.pos]||b.ovr-a.ovr : sort==="age"? a.age-b.age : b.value-a.value);
  const inXI = new Set(user.xi||[]);
  const release = p => {
    if(!confirm(`Release ${p.name}? They'll become a free agent.`)) return;
    releaseToFA(G, p);
    autoPickXI(user, G.players);
    logNews(G, "transfer", `❌ Released ${p.pos} ${p.name} (${p.ovr})`, user.id);
    commit(G); tShow(`${p.name} released`);
  };
  const sendDown = p => {
    if(p.age>21){ tShow("Only players aged 21 or under can drop to the academy."); return; }
    if(squad.length<=16){ tShow("Senior squad too thin to send anyone down."); return; }
    p.youth = true;
    autoPickXI(user, G.players);
    logNews(G, "youth", `🔽 ${p.name} (${p.pos} ${p.ovr}) sent down to the academy`, user.id);
    commit(G); tShow(`${p.name} sent to the academy`);
  };
  const toggleList = p => { p.listed = !p.listed; logNews(G,"transfer",p.listed?`🏷️ ${p.name} added to the transfer list`:`${p.name} taken off the transfer list`, user.id); commit(G); tShow(p.listed?`${p.name} listed for transfer`:`${p.name} unlisted`); };

    <div className="space-y-3">
      <Card>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="font-semibold">{user.name} — {squad.length} players</div>

        <div className="flex gap-2 mt-2 text-xs">
          {[["ovr","Rating"],["pos","Position"],["age","Age"],["val","Value"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSort(k)} className={"px-2 py-1 rounded "+(sort===k?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l}</button>
          ))}
        </div>
      </Card>
      <Card className="p-0 overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="text-slate-500 text-xs border-b border-[#1d2940]">
            <th className="text-left p-2">Player</th><th className="p-2">Pos</th><th className="p-2">OVR</th><th className="p-2">Pot</th>
            <th className="p-2">Age</th><th className="p-2">Wage</th><th className="p-2">Yrs</th><th className="p-2">Value</th><th className="p-2"></th><th className="p-2"></th><th className="p-2"></th><th className="p-2"></th>
          </tr></thead>
          <tbody>
            {squad.map(p=>(
              <tr key={p.id} className="border-b border-[#15203a]">
                <td className="p-2 text-left">
                  {inXI.has(p.id) && <span className="text-emerald-400 mr-1" title="In starting XI">●</span>}

                <td className="p-2 text-center"><button onClick={()=>setRenewP(p)} className={"px-2 py-1 rounded text-xs font-semibold "+(p.years<=0?"bg-emerald-500 text-slate-900":p.unhappy?"bg-orange-500 text-slate-900":"bg-[#16213a] text-slate-300 hover:bg-[#1d2940]")}>{p.years<=0?"Re-sign":"Renew"}</button></td>
                <td className="p-2 text-center"><button onClick={()=>release(p)} className="px-2 py-1 rounded text-xs font-semibold bg-[#16213a] text-red-400 hover:bg-red-900/40">Release</button></td>
                <td className="p-2 text-center">{p.age<=21 && <button onClick={()=>sendDown(p)} className="px-2 py-1 rounded text-xs font-semibold bg-[#16213a] text-amber-300 hover:bg-[#1d2940]" title="Move to the academy to develop faster">↓ Youth</button>}</td>
                <td className="p-2 text-center"><button onClick={()=>toggleList(p)} className={"px-2 py-1 rounded text-xs font-semibold "+(p.listed?"bg-indigo-500 text-white":"bg-[#16213a] text-slate-300 hover:bg-[#1d2940]")} title="Transfer-list to invite bids">{p.listed?"Listed":"List"}</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
      {renewP && <RenewModal G={G} p={renewP} commit={commit} tShow={tShow} onClose={()=>setRenewP(null)} />}
    </div>
  );
}
// Contract negotiation: the player names a wage demand (ability + ambition + form);
// the user picks a term length. Longer deals carry a small per-year premium for security.
function RenewModal({G, p, commit, tShow, onClose}){
  const user = G.clubs[G.userTeamId];
  const demand = wageDemand(p);
  const termPremium = { 1:1.0, 2:1.0, 3:1.05, 4:1.10 };
  const [rel, setRel] = useState(p.release!=null ? String(p.release) : "");
  const sign = yrs => {
    p.salary = clamp(round(demand*termPremium[yrs]*10)/10, 0.2, 40);
    p.years = yrs; p.unhappy = false; p.expiredGrace = false;
    const rv = parseFloat(rel);
    p.release = (rel==="" || isNaN(rv)) ? null : round(Math.max(0,rv)*10)/10;
    commit(G); tShow(`${p.name} signed for ${yrs}y at ${money(p.salary)}/yr`); onClose();
  };
  const bill = wageBill(G, user.id);
  return (
    <div className="fixed inset-0 z-40 bg-black/60 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-2xl p-5 w-full max-w-md" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <div className="font-bold text-lg">{p.name}</div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-200">✕</button>
        </div>
        <div className="text-sm text-slate-400 mb-3">{p.pos} · {p.age}y · OVR {p.ovr} · Pot {p.pot}</div>
        <div className="grid grid-cols-2 gap-2 text-sm mb-4">
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Current wage</div><div className="font-semibold tnum">{money(p.salary)}/yr</div></div>
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Wage demand</div><div className="font-semibold tnum text-amber-300">{money(demand)}/yr</div></div>
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Club wage bill</div><div className="font-semibold tnum">{money(bill)}/yr</div></div>
          <div className="bg-[#0d1526] rounded-lg p-2"><div className="text-xs text-slate-500">Transfer budget</div><div className="font-semibold tnum">{money(user.budget)}</div></div>
        </div>
        <div className="flex items-center justify-between gap-2 mb-3">
          <div className="text-xs text-slate-400">Release clause (£M, blank = none)</div>
          <input value={rel} onChange={e=>setRel(e.target.value.replace(/[^0-9.]/g,""))} placeholder="none" inputMode="decimal" className="w-24 bg-[#0d1526] rounded px-2 py-1 text-sm text-right tnum" />
        </div>
        <div className="text-xs text-slate-400 mb-2">Offer a contract length (sets the clause above):</div>
        <div className="grid grid-cols-4 gap-2">
          {[1,2,3,4].map(yrs=>(
            <button key={yrs} onClick={()=>sign(yrs)}
              className="px-2 py-2 rounded-lg bg-emerald-500 text-slate-900 font-semibold text-sm">
              {yrs}y<div className="text-[10px] font-normal">{money(round(demand*termPremium[yrs]*10)/10)}/yr</div>
            </button>
          ))}
        </div>
        <div className="text-[11px] text-slate-500 mt-3">A lower release clause makes the player easier for rivals to buy; leave it blank for none. Let a deal run down and a rival can poach him on a free.</div>
      </div>
    </div>
  );
}

/* ----------------------------- tactics / formation --------------------- */
function Tactics({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  const slots = FORMATIONS[user.formation] || FORMATIONS["4-3-3"];
  const coords = pitchCoords(slots);
  const [pickSlot, setPickSlot] = useState(null);   // slot index being assigned
  ensureXI(user, G.players);
  const squad = Object.values(G.players).filter(p=>p.teamId===user.id && !isInjured(p));
  const setFormation = f => { user.formation=f; autoPickXI(user, G.players); commit(G); };
  const setTactic = t => { user.tactic=t; commit(G); };
  const assign = (slotIdx, pid) => {
    const xi = (user.xi||[]).slice();
    const existing = xi.indexOf(pid);
    if(existing>=0){ const tmp=xi[slotIdx]; xi[slotIdx]=pid; xi[existing]=tmp; }  // swap
    else xi[slotIdx]=pid;
    user.xi = xi; autoFillBench(user, G.players); commit(G); setPickSlot(null);
  };
  const u = unitRatings(user, G.players);
  return (
    <div className="space-y-3">
      <Card>
        <div className="flex flex-wrap items-center gap-2">
          <span className="text-sm text-slate-400">Formation</span>
          <select value={user.formation} onChange={e=>setFormation(e.target.value)} className="bg-[#16213a] rounded px-2 py-1 text-sm">
            {FORMATION_NAMES.map(f=><option key={f} value={f}>{f}</option>)}
          </select>

function SetPieceCard({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  ensureSetPieces(user, G.players);
  const squad = Object.values(G.players).filter(p=>p.teamId===user.id && !p.youth && p.pos!=="GK").sort((a,b)=>b.ovr-a.ovr);
  const ROLES = [["pen","Penalties","🎯"],["fk","Free Kicks","🥅"],["corner","Corners","🚩"]];
  const setTaker = (role, pid) => { user.setPieces=user.setPieces||{}; user.setPieces[role]=pid; commit(G); tShow(`${ROLES.find(r=>r[0]===role)[1]} taker set`); };
  const autoAssign = () => { ["pen","fk","corner"].forEach(role=>{ user.setPieces[role]=bestSetPieceTaker(user, G.players, role); }); commit(G); tShow("Set-piece takers auto-assigned"); };
  return (
    <Card>
      <div className="flex items-center justify-between mb-2">
        <div className="font-semibold">Set-Piece Takers</div>
        <button onClick={autoAssign} className="px-2 py-1 rounded bg-[#16213a] text-slate-300 text-xs">Auto-assign</button>
      </div>
      <div className="grid sm:grid-cols-3 gap-2">
        {ROLES.map(([role,label,emoji])=>{
          const curId = user.setPieces && user.setPieces[role];
          const cur = curId!=null ? G.players[curId] : null;
          return (
            <div key={role} className="bg-[#0d1526] rounded-lg p-2">
              <div className="text-xs text-slate-400 mb-1">{emoji} {label}</div>
              <select value={curId||""} onChange={e=>setTaker(role, e.target.value?Number(e.target.value):null)} className="w-full bg-[#16213a] rounded px-2 py-1 text-sm">
                <option value="">— none —</option>
                {squad.map(p=><option key={p.id} value={p.id}>{p.name} ({p.ovr})</option>)}
              </select>
              {cur && <div className="text-[11px] text-slate-500 mt-1">{cur.pos} · Sho {cur.sho} · Pas {cur.pas}</div>}
            </div>
          );
        })}
      </div>
    </Card>
  );
}
function autoFillBench(club, players){
  const used = new Set(club.xi||[]);
  const rest = Object.values(players).filter(p=>p.teamId===club.id && !used.has(p.id) && !isInjured(p)).sort((a,b)=>b.ovr-a.ovr);
  club.bench = rest.slice(0,9).map(p=>p.id);
}
function SlotPicker({G, slot, squad, xi, onPick, onClose}){
  const ranked = squad.slice().sort((a,b)=>effRating(b,slot)-effRating(a,slot));
  return (
    <div className="fixed inset-0 bg-black/60 z-40 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-xl w-full max-w-md max-h-[70vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-3 border-b border-[#1d2940] flex items-center justify-between sticky top-0 bg-[#101a30]">
          <div className="font-semibold">Assign at <span className="text-emerald-300">{slot}</span></div>
          <button onClick={onClose} className="text-slate-400">✕</button>
        </div>
        <div className="p-2 space-y-1">
          {ranked.map(p=>{
            const pen = posPenalty(p, slot); const eff = effRating(p,slot);
            const inXi = xi.includes(p.id);
            return (
              <button key={p.id} onClick={()=>onPick(p.id)} className="w-full flex items-center gap-2 p-2 rounded hover:bg-[#16213a] text-left">
                <OvrPill v={p.ovr} />
                <div className="flex-1">
                  <div className="font-medium">{p.name} {inXi&&<span className="text-xs text-emerald-400">(in XI)</span>}</div>
                  <div className="text-xs text-slate-400">{posLabel(p)} · {p.age}y</div>
                </div>
                <div className={"text-sm font-semibold "+(pen>0?"text-orange-400":"text-emerald-300")}>{pen>0?`${eff} (-${pen})`:"natural"}</div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

        {board("📈 Expected Goals (xG)", pool.slice().sort((a,b)=>(b.stats.xG||0)-(a.stats.xG||0)), p=>(p.stats.xG||0).toFixed(1))}
        {board("🧤 Clean Sheets", pool.filter(p=>p.pos==="GK").sort((a,b)=>b.stats.CS-a.stats.CS), p=>p.stats.CS)}
        {board("🥅 GK Saves", pool.filter(p=>p.pos==="GK").sort((a,b)=>(b.stats.Sv||0)-(a.stats.Sv||0)), p=>p.stats.Sv||0)}
        {board("🛡️ Tackles", pool.slice().sort((a,b)=>(b.stats.Tkl||0)-(a.stats.Tkl||0)), p=>p.stats.Tkl||0)}
        {board("🧠 Interceptions", pool.slice().sort((a,b)=>(b.stats.Int||0)-(a.stats.Int||0)), p=>p.stats.Int||0)}
        {board("🚧 Clearances", pool.slice().sort((a,b)=>(b.stats.Clr||0)-(a.stats.Clr||0)), p=>p.stats.Clr||0)}
        {board("💪 Duel % (min 30)", pool.filter(p=>(p.stats.DuT||0)>=30).sort((a,b)=>duelPct(b.stats)-duelPct(a.stats)), p=>duelPct(p.stats)+"%")}
        {board("🎯 Progressive Passes", pool.slice().sort((a,b)=>(b.stats.PrgP||0)-(a.stats.PrgP||0)), p=>p.stats.PrgP||0)}
        {board("🏰 Ball-Winner (Def. Value)", pool.filter(minApp).sort((a,b)=>defContribution(b.stats)-defContribution(a.stats)), p=>defContribution(p.stats))}
        {board("⭐ Avg Rating", pool.filter(minApp).sort((a,b)=>avgRating(b.stats)-avgRating(a.stats)), p=>avgRating(p.stats).toFixed(2))}
        {board("💎 Rating Value", pool.filter(minApp).sort((a,b)=>ratingValue(b.stats)-ratingValue(a.stats)), p=>ratingValue(p.stats))}
      </div>
    </div>
  );
}

/* ----------------------------- fixtures -------------------------------- */
// Build the user's full season fixture feed across ALL competitions, tagged by
// competition so league / national cup / continental can be told apart.
const COMP_META = {
  league: { sym:"⚽", label:"League",   cls:"text-slate-400" },
  cup:    { sym:"🏆", label:"Nat. Cup", cls:"text-amber-300" },
  cont:   { sym:"🌍", label:CONT_CUP_NAME, cls:"text-indigo-300" },
};
function userFixtureFeed(G){
  const uid = G.userTeamId, out = [];
  // league
  G.schedule.forEach((round, md)=>{
    const g = round.find(x=>x.home===uid||x.away===uid);
    if(!g) return;
    const home = g.home===uid, oppId = home?g.away:g.home, opp = G.clubs[oppId];
    out.push({ md:md+1, comp:"league", home, oppName:opp?opp.name:"?", played:!!g.played,
      gf:home?g.hs:g.as, ga:home?g.as:g.hs, round:"League", derby:isDerby(G, uid, oppId) });
  });
  // domestic cup (current season)
  const cup = (G.cups||[]).find(c=>c.country===(G.clubs[uid].country||0));
  if(cup){
    // played ties
    CUP_ORDER.forEach(r=>{
      const ties = (cup.results||{})[r]; if(!ties) return;
      const t = ties.find(x=>x.home===uid||x.away===uid); if(!t) return;
      const home = t.home===uid;
      out.push({ md:CUP_MD_REV[r], comp:"cup", home, oppName:(G.clubs[home?t.away:t.home]||{}).name||"?",
        played:true, gf:home?t.hs:t.as, ga:home?t.as:t.hs, round:r });
    });
    // all future rounds the user is still in (show as upcoming)
    if(cup.winner==null && (cup.alive||[]).includes(uid)){
      const doneRounds=new Set(Object.keys(cup.results||{}));
      CUP_ORDER.filter(r=>!doneRounds.has(r)).forEach(r=>{
        out.push({ md:CUP_MD_REV[r], comp:"cup", home:null, oppName:"TBD", played:false, round:r });
      });
    }
  }
  // continental (current season)
  const cc = G.contCup;
  const contQual = cc && (cc.qualifiers||[]).includes(uid);
  if(cc && contQual){
    // played group results
    (cc.groups||[]).forEach(grp=>{
      (grp.results||[]).forEach(res=>{
        if(res.home!==uid && res.away!==uid) return;
        const home = res.home===uid; const mdName = ["G1","G2","G3","G4","G5","G6"][res.md];
        out.push({ md:CONT_MD_REV[mdName], comp:"cont", home, oppName:(G.clubs[home?res.away:res.home]||{}).name||"?",
          played:true, gf:home?res.hs:res.as, ga:home?res.as:res.hs, round:"Group" });
      });
    });
    // remaining group matchdays (not yet played)
    if(cc.phase==="group"){
      const doneMds=new Set((cc.groups||[]).flatMap(g=>(g.results||[]).map(r=>r.md)));
      [0,1,2,3,4,5].filter(m=>!doneMds.has(m)).forEach(m=>{
        const mdName=["G1","G2","G3","G4","G5","G6"][m];
        out.push({ md:CONT_MD_REV[mdName], comp:"cont", home:null, oppName:"TBD", played:false, round:"Group MD"+(m+1) });
      });
    }
    // played KO ties
    const alive=(cc.alive||[]).includes(uid);
    CONT_ORDER.forEach(r=>{
      const ties=(cc.results||{})[r]; if(!ties) return;
      const t=ties.find(x=>x.home===uid||x.away===uid); if(!t) return;
      const home=t.home===uid;
      out.push({ md:CONT_MD_REV[r], comp:"cont", home, oppName:(G.clubs[home?t.away:t.home]||{}).name||"?",
        played:true, gf:home?t.hs:t.as, ga:home?t.as:t.hs, round:r });
    });
    // upcoming KO rounds
    if(alive && cc.phase==="ko"){
      const doneKO=new Set(Object.keys(cc.results||{}));
      CONT_ORDER.filter(r=>!doneKO.has(r)).forEach(r=>{
        out.push({ md:CONT_MD_REV[r], comp:"cont", home:null, oppName:"TBD", played:false, round:r });
      });
    }
  }
  return out.sort((a,b)=> a.md-b.md || (a.comp==="league"?-1:1));
}

  const [mode, setMode] = useState("user");   // user | all

      </div>
      {mode==="user" ? (
        <>
        <Card className="py-2"><div className="flex gap-4 text-xs text-slate-400 flex-wrap">{Object.values(COMP_META).map(m=><span key={m.label}>{m.sym} <span className={m.cls}>{m.label}</span></span>)}</div></Card>
        <Card className="p-0 overflow-hidden">
          {feed.map((f,i)=>{

              <div key={i} className={"flex items-center gap-2 px-3 py-2 border-b border-[#15203a] text-sm "+(f.md===G.day+1?"bg-emerald-500/10":"")}>
                <span className="text-slate-500 w-10 text-xs">MD{f.md}</span>

                {f.comp!=="league" && <span className={"text-[10px] w-8 "+m.cls}>{f.round}</span>}
                <span className="w-5 text-slate-400 text-xs">{f.home==null?"":f.home?"H":"A"}</span>
                <span className="flex-1">{f.oppName}{f.derby&&<span className="ml-1 text-orange-400" title="Derby vs your rivals">🔥</span>}</span>
                {f.played
