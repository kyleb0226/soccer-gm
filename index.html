/* ----------------------------- stadium --------------------------------- */
const STAND_KEYS = [["N","North"],["E","East"],["S","South"],["W","West"]];
const STAND_STEP = 3000;   // seats added per expansion
function ensureStands(c){ if(!c.stands){ const each=Math.round((c.capacity||30000)/4/500)*500; c.stands={N:each,E:each,S:each,W:each}; } return c.stands; }
function stadiumCapacity(c){ const s=c.stands; return s ? (s.N+s.E+s.S+s.W) : (c.capacity||0); }
function standExpandCost(seats){ return round(((seats/1000)*0.7 + 3)*10)/10; }   // £M for +STAND_STEP, scales with size

/* ----------------------------- stadium facility tiers ------------------- */
// A separate axis from raw capacity: the QUALITY of the venue (hospitality,
// premium seating, media facilities). Each tier raises the per-seat gate rate
// and the max capacity any single stand can reach, and improves sponsor appeal.
const FACILITY_TIERS = [
  { name:"Basic Ground",      maxStand:15000, gateMult:1.00, cost:0  },
  { name:"Modern Stadium",    maxStand:22000, gateMult:1.12, cost:18 },
  { name:"Premium Arena",     maxStand:30000, gateMult:1.26, cost:45 },
  { name:"Elite Showcase",    maxStand:40000, gateMult:1.42, cost:90 },
  { name:"Iconic Venue",      maxStand:55000, gateMult:1.60, cost:170 },
];
function ensureFacility(c){ if(c.facilityTier==null) c.facilityTier=0; return c.facilityTier; }
function facilityInfo(c){ return FACILITY_TIERS[clamp(c.facilityTier||0,0,FACILITY_TIERS.length-1)]; }
function facilityGateMult(c){ return facilityInfo(c).gateMult; }
function facilityMaxStand(c){ return facilityInfo(c).maxStand; }

/* ----------------------------- matchday gate income ---------------------- */
// Per-home-match gate receipts. Replaces the old flat "capacity × rate × 19"
// season lump with a live, performance-driven model: every home game (league,
// cup AND continental) sells tickets based on how full you can keep the ground,
// which depends on form, league standing, the occasion, and the price you set.
// Receipts accrue into c.seasonGate through the year and settle at the rollover.
const TICKET_TIERS = [
  { name:"Cheap",    priceMult:0.72, demandMult:1.12, blurb:"Pack them in — low prices, near-full grounds, less per head." },
  { name:"Standard", priceMult:1.00, demandMult:1.00, blurb:"Balanced pricing." },
  { name:"Premium",  priceMult:1.32, demandMult:0.86, blurb:"More per seat, but a tougher sell when results dip." },
  { name:"Elite",    priceMult:1.70, demandMult:0.70, blurb:"Top-dollar tickets — only sustainable while you're winning." },
];
function ticketTier(c){ return TICKET_TIERS[clamp(c.ticketTier??1, 0, TICKET_TIERS.length-1)]; }
// Food & drink concessions — a second matchday stream. Price drives spend-per-head
// up but fewer fans buy when it's dear; unlike tickets, the people already in the
// ground still eat, so concession demand barely moves with results.
const CONCESSION_TIERS = [
  { name:"Budget",   priceMult:0.80, uptakeMult:1.16, blurb:"Cheap eats — everyone grabs something, low margin per head." },
  { name:"Standard", priceMult:1.00, uptakeMult:1.00, blurb:"Normal concession pricing." },
  { name:"Premium",  priceMult:1.32, uptakeMult:0.86, blurb:"Pricier menu — more per head, a few fans bring their own." },
  { name:"Gourmet",  priceMult:1.65, uptakeMult:0.72, blurb:"Top-end food & hospitality — big spend from those who do buy." },
];
function concessionTier(c){ return CONCESSION_TIERS[clamp(c.concessionTier??1, 0, CONCESSION_TIERS.length-1)]; }
// How full the ground gets for one home match: base demand by tier, lifted by a
// strong league position and recent winning, dampened by losing form and by a
// premium ticket price. Big nights (continental, derbies) pull a bigger crowd.
function homeFillRate(G, c, opts={}){
  const tier = ticketTier(c);
  let fill = [0.84,0.72,0.62,0.55][c.div] || 0.55;
  const table = tableFor(G,0,c.country||0);
  const n = table.length || 20;
  const pos = leaguePos(G,c) || Math.round(n/2);
  fill += (1 - (pos-1)/Math.max(1,n-1)) * 0.20 - 0.10;      // +0.10 top of table .. -0.10 bottom
  const played = (c.w||0)+(c.d||0)+(c.l||0);
  if(played>0){ const winRate=(c.w||0)/played; fill += (winRate-0.40)*0.30; }   // hot/cold form swing
  if(opts.cont) fill += 0.10;          // continental glamour nights
  else if(opts.cup) fill += 0.02;
  if(opts.derby) fill += 0.08;         // rivalry sell-out push
  if(c.userControlled && G.fanConfidence!=null) fill += (G.fanConfidence-65)/100*0.12;   // happy fans turn up
  fill *= tier.demandMult;             // pricing suppresses (or lifts) demand
  return clamp(fill, 0.28, 1.0);
}
// Receipts for a single home match, credited to seasonGate (settled at rollover).
// Per-seat economics match the old model (£≈28/seat top flight, £17 lower) so the
// season total stays balanced — it just now flexes with attendance and price.
function recordHomeGate(G, club, opts={}){
  if(!club || opts.neutral) return 0;   // neutral-venue finals: no home gate
  const cap = stadiumCapacity(club);
  const rate = [0.040,0.023,0.013,0.007][club.div] || 0.006;
  const tier = ticketTier(club);
  // Season-ticket holders are loyal — they show up regardless of form (an
  // attendance FLOOR) but pay a discounted rate, so a big allocation stabilises
  // your gate when results dip at the cost of some upside on those seats.
  const stPct = clamp((club.seasonTicketPct||0)/100, 0, 0.7);
  let fill = homeFillRate(G, club, opts);
  fill = Math.max(fill, stPct);
  const att = Math.round(cap * fill);
  const stSeats = Math.round(cap * stPct);
  const walkup = Math.max(0, att - stSeats);
  const gate = round(((stSeats*0.8 + walkup)/1000) * rate * facilityGateMult(club) * tier.priceMult * 10)/10;
  club.seasonGate = round(((club.seasonGate||0) + gate)*10)/10;
  // food & drink concessions: spend-per-head from everyone in the ground
  const ct = concessionTier(club);
  const spendPerK = [0.009,0.006,0.004,0.0025][club.div] || 0.0025;   // £M per 1,000 fans at standard price
  const conc = round((att/1000) * spendPerK * facilityGateMult(club) * ct.priceMult * ct.uptakeMult * 10)/10;
  club.seasonConcession = round(((club.seasonConcession||0) + conc)*10)/10;
  // hospitality boxes: premium corporate seats sold every home game (big nights pay extra)
  if(club.boxes){
    const boxInc = round(boxIncomePerGame(club) * ((opts.cup||opts.cont)?1.15:1) * (opts.derby?1.1:1) * 1000)/1000;
    club.seasonBoxes = round(((club.seasonBoxes||0) + boxInc)*1000)/1000;
  }
  // keep a short per-match ledger for the user's club so they can see weekly takings
  if(club.userControlled){
    club.gateLog = club.gateLog || [];
    club.gateLog.unshift({ day:G.day+1, comp: opts.cont?"UCL":opts.cup?"Cup":"League",
      opp: opts.oppAbbr||"", att, cap, gate, conc, derby: !!opts.derby });
    if(club.gateLog.length>40) club.gateLog.length=40;
  }
  return gate;
}

/* ----------------------------- merchandise ------------------------------ */
// Jersey & merch sales: a matchday portion (sold at the ground — scales with
// crowds & how many home games you play) plus an online store (year-round,
// global — driven by the club's popularity, and boosted by store upgrades).
const STORE_TIERS = [
  { name:"Club Shop",    mult:1.00, cost:0   },
  { name:"Megastore",    mult:1.30, cost:28  },
  { name:"Online Store", mult:1.65, cost:65  },
  { name:"Global Brand", mult:2.05, cost:140 },
];
function storeTierOf(c){ return STORE_TIERS[clamp(c.storeTier||0,0,STORE_TIERS.length-1)]; }
function clubPopularity(G, c){
  const str = clubStrength(c, G.players), hon = (c.honours||[]).length;
  return ([1,0.45,0.2,0.1][c.div]||0.1) * (0.55 + str/110) * (1 + Math.min(hon,50)*0.014);
}
function merchIncome(G, c, gate){
  const matchday = round((gate||0)*0.16*10)/10;                                  // shirts/scarves/food sold at games
  const online = round(clubPopularity(G,c) * 5.5 * storeTierOf(c).mult * 10)/10;  // online shop, year-round
  return { matchday, online, total: round((matchday+online)*10)/10 };
}
// Annual RUNNING COSTS every club has to cover on top of wages — backroom/medical/
// academy staff (scale with the wage bill), stadium operations, facility upkeep and
// admin. Well-run, well-supported clubs cover it comfortably; a club that slips down
// the table (smaller gate, no prize money) can fall short and start losing money,
// which is what forces sales / wage cuts. Also stops budgets ballooning forever.
function runningCosts(G, c, wages){
  const staff   = (wages||0) * 0.22;                                             // staff wages scale with the playing budget
  const stadium = (stadiumCapacity(c)/1000) * ([0.15,0.09,0.06,0.04][c.div]||0.04) * facilityGateMult(c);
  const facils  = (((c.facilityTier||0)) + ((c.academy&&c.academy.level)||1) + (c.trainTier||0) + (c.scoutTier||0) + (c.pitchTier||0)) * 2
                + (c.boxes||0)*0.05;                                             // upkeep on every built tier + box maintenance
  const admin   = [10,4,2,1][c.div] || 1;
  const coaches = coachWageBill(c);                                              // specialist coaching staff on yearly wages
  return round((staff + stadium + facils + admin + coaches)*10)/10;
}

/* ----------------------------- stadium naming rights --------------------- */
// Sell the stadium name to a sponsor for season income (the ground gets
// renamed), or keep the traditional name for free — purely a flavor/honor
// choice with a real financial trade-off, like real-world football grounds.
const NAMING_SUFFIXES = ["Arena","Stadium","Park","Dome","Field","Centre"];
function generateNamingOffer(G, club){
  const str=clubStrength(club,G.players);
  const val=round((1.5+str/40+(club.honours||[]).length*0.3+_rng()*2)*10)/10;
  const yrs=rint(3,6);
  const sponsor=pick(SPONSOR_NAMES);
  return { sponsor, name:`${sponsor} ${pick(NAMING_SUFFIXES)}`, val, yrs, offered:G.season };
}
function sellNamingRights(G, club, offer){
  if(!club.traditionalStadiumName) club.traditionalStadiumName=club.stadium;
  club.namingRights={ sponsor:offer.sponsor, name:offer.name, val:offer.val, yrs:offer.yrs };
  club.stadium=offer.name;
  club.namingOffers=(club.namingOffers||[]).filter(o=>o!==offer);
  logNews(G,"finance",`🏷️ Sold naming rights — ${club.stadium} (${offer.sponsor}, ${money(offer.val)}/yr for ${offer.yrs}y)`, club.id);
}
function keepTraditionalName(G, club){
  if(club.traditionalStadiumName) club.stadium=club.traditionalStadiumName;
  club.namingRights=null;
  logNews(G,"finance",`🏟️ ${club.name} keep the traditional name of ${club.stadium} — fans are proud.`, club.id);
}

/* ========================= FINANCES ENGINE ============================== */
// Shirt deal: a kit partnership that pays per season. Better clubs attract better brands.
const SHIRT_BRANDS = ["SportMax","ProKit","KickOn","NovaSport","StrikeWear","AeroKit","FieldEdge","PeakGear","ZenithKit","ApexSport"];
const SHIRT_TIERS = [
  { label:"Regional",   min:0,  max:55,  base:1,  step:0.4 },
  { label:"National",   min:55, max:68,  base:3,  step:0.8 },
  { label:"Continental",min:68, max:78,  base:7,  step:1.5 },
  { label:"Global",     min:78, max:99,  base:14, step:2.5 },
];
function shirtDealValue(clubStr, honsCount){ const tier=SHIRT_TIERS.find(t=>clubStr<t.max)||SHIRT_TIERS[SHIRT_TIERS.length-1]; return round((tier.base + honsCount*tier.step)*10)/10; }

// Sponsor: a commercial partner that pays a fixed annual fee for a set number of years.
const SPONSOR_NAMES=["ArrowBank","FusionEnergy","NexaTech","SkyPulse","CrestBrew","Goldarch","TerraMotors","PinnacleFX","StarlinkAir","BlueHarbour","QuestCapital","VortexMedia"];
const SPONSOR_TIERS=[
  { label:"Local",     maxStr:55,  minVal:0.8,  maxVal:2.5  },
  { label:"Regional",  maxStr:67,  minVal:2,    maxVal:6    },
  { label:"National",  maxStr:77,  minVal:5,    maxVal:14   },
  { label:"Global",    maxStr:99,  minVal:12,   maxVal:30   },
];
function sponsorTierFor(str){ return SPONSOR_TIERS.find(t=>str<t.maxStr)||SPONSOR_TIERS[SPONSOR_TIERS.length-1]; }
function generateSponsorOffer(G, club){
  const str=clubStrength(club, G.players), hon=(club.honours||[]).length;
  const tier=sponsorTierFor(str);
  const val=round((tier.minVal + (tier.maxVal-tier.minVal)*_rng() + hon*0.3)*10)/10;
  const yrs=rint(2,4);
  return { name:pick(SPONSOR_NAMES), tier:tier.label, val, yrs, offered:G.season };
}

// Prize money: cup progress bonuses paid at the rollover.
// League prize money: a per-position merit payment PLUS a proper placement bonus
// so winning the title (and finishing in the European places) actually pays off,
// instead of 1st barely beating 2nd.
const LEAGUE_TITLE_BONUS = { 1:55, 2:30, 3:22, 4:16, 5:12, 6:9, 7:6, 8:4 };  // top flight: champion + European places
const LEAGUE_TITLE_BONUS_D1 = { 1:16, 2:11, 3:7 };                       // 2nd tier: promotion payments
function leaguePrize(div, pos){
  // per-position merit money (every place is worth more than the one below) PLUS a
  // placement bonus, so winning the league — and finishing in the continental spots —
  // is a serious financial reward that compounds the strong clubs' advantage.
  if(div===0){ const merit = clamp((21-pos)*2.6, 6, 52); return round((merit + (LEAGUE_TITLE_BONUS[pos]||0))*10)/10; }
  if(div===1){ const merit = clamp((21-pos)*1.0, 2, 22); return round((merit + (LEAGUE_TITLE_BONUS_D1[pos]||0))*10)/10; }
  if(div===2){ const merit = clamp((21-pos)*0.35, 0.8, 7); return round((merit + ({1:4,2:2.5,3:1.6}[pos]||0))*10)/10; }
  const merit = clamp((21-pos)*0.18, 0.3, 3.6); return round((merit + ({1:2,2:1.2,3:0.8}[pos]||0))*10)/10;
}
// Cup & continental prize money — rewards a good run AND, crucially, pays extra
// for actually winning (lifting the trophy beats losing the final).
function cupPrizeMoney(G, clubId){
  let total=0;
  const wealth = (COUNTRIES[(G.clubs[clubId]||{}).country||0]||{}).wealth || 1;
  (G.cups||[]).forEach(cup=>{
    if(cup.country!==((G.clubs[clubId]||{}).country||0)) return;
    if(cup.winner===clubId){ total+=14; return; }              // winners
    if(cup.runnerUp===clubId){ total+=6; return; }             // beaten finalists
    const r=Object.keys(cup.results||{}).filter(k=>(cup.results[k]||[]).some(t=>t.home===clubId||t.away===clubId)).pop();
    total += ({PR:0.1,R64:0.2,R32:0.5,R16:1.2,QF:3,SF:6}[r]||0);   // paid by furthest round reached
  });
  if(G.contCup){
    // The Champions Cup is a financial game-changer — just qualifying is a windfall,
    // and a deep run funds a squad. This is the engine of the big-club dynasty.
    const cc=G.contCup;
    if(cc.winner===clubId) total+=90;                          // continental champions
    else if(cc.runnerUp===clubId) total+=55;                   // beaten finalists
    else if((cc.alive||[]).includes(clubId)) total+=32;        // reached the knockouts (R16+)
    else if((cc.qualifiers||[]).includes(clubId)) total+=18;   // group-stage participation fee
    // per-group-game win/draw bonuses reward a strong group campaign
    (cc.groups||[]).forEach(grp=>(grp.results||[]).forEach(res=>{
      if(res.home===clubId){ total += res.hs>res.as?1.5 : res.hs===res.as?0.6:0; }
      else if(res.away===clubId){ total += res.as>res.hs?1.5 : res.as===res.hs?0.6:0; }
    }));
  }
  return round(total*wealth*10)/10;   // richer nations' clubs earn more from the same run
}

// Rough estimate of a club's annual income, from last season's settled P&L
// (falls back to a division baseline for a club with no history yet). Used by
// the AI to make affordability-aware contract and wage decisions.
function aiIncomeEstimate(G, club){
  const p=club.lastPnl||{};
  const inc=(p.tv||0)+(p.prize||0)+(p.gate||0)+(p.conc||0)+(p.merch||0)+(p.shirt||0)+(p.sleeve||0)+(p.sponsor||0)+(p.cup||0)+(p.naming||0);
  return inc>5 ? inc : ([70,30,12,6][club.div]||6);
}
// AI clubs grow their commercial income so they can compete financially: they
// keep a sponsor portfolio topped up (scaled by prestige/division) and bigger
// clubs may sell stadium naming rights. New deals start paying next season.
function aiManageCommercials(G, club){
  const str=clubStrength(club, G.players);
  const target = club.div===0 ? (str>=74?3:str>=66?2:1) : 1;
  club.sponsors = club.sponsors || [];
  let guard=0;
  while(club.sponsors.length < target && guard++<4){
    const o=generateSponsorOffer(G, club);
    club.sponsors.push({ name:o.name, tier:o.tier, val:o.val, yrs:o.yrs });
  }
  if(!club.namingRights && chance([0.18,0.08,0.03,0.01][club.div]||0.01)){
    const o=generateNamingOffer(G, club);
    if(!club.traditionalStadiumName) club.traditionalStadiumName=club.stadium;
    club.namingRights={ sponsor:o.sponsor, name:o.name, val:o.val, yrs:o.yrs };
    club.stadium=o.name;
  }
}

// Ensure club has shirt/sponsor data (backfill & first-time init).
const SLEEVE_BRANDS = ["Voltix","Cintra","Aerolux","Trailhead","Nordwave","Solara","Quantic","Verdano","Halcyon","Brava"];
function ensureCommercials(G, club){
  if(!club.shirt){ const str=clubStrength(club,G.players); club.shirt={ brand:pick(SHIRT_BRANDS), value:shirtDealValue(str,(club.honours||[]).length), yrs:rint(2,4) }; }
  if(!club.sleeve){ const str=clubStrength(club,G.players); club.sleeve={ brand:pick(SLEEVE_BRANDS), value:round(shirtDealValue(str,(club.honours||[]).length)*0.35*10)/10, yrs:rint(2,4) }; }
  if(!Array.isArray(club.sponsors)) club.sponsors=[];
  if(!club.sponsorOffers) club.sponsorOffers=[];
  if(!Array.isArray(club.namingOffers)) club.namingOffers=[];
  if(club.namingRights===undefined) club.namingRights=null;
  ensureFacility(club);
}

// Called at the rollover — pays out shirt/sponsor income and renegotiates expiring deals.
function processCommercials(G, club){
  ensureCommercials(G, club);
  const isUser = !!club.userControlled && !AUTO_MANAGE;   // auto-managed → grow commercials like an AI club
  // shirt deal
  let shirtIncome=0;
  if(club.shirt){
    shirtIncome = club.shirt.value;
    club.shirt.yrs--;
    if(club.shirt.yrs<=0){
      // renegotiate: better clubs get better deals
      const str=clubStrength(club,G.players), hon=(club.honours||[]).length;
      const newVal=shirtDealValue(str,hon);
      club.shirt={ brand:club.shirt.brand, value:newVal, yrs:rint(2,4) };
      if(isUser) logNews(G,"finance",`👕 Shirt deal with ${club.shirt.brand} renewed at ${money(newVal)}/yr`, club.id);
    }
  }
  // sleeve / training-kit sponsor (a smaller, separate kit deal)
  let sleeveIncome=0;
  if(club.sleeve){
    sleeveIncome = club.sleeve.value;
    club.sleeve.yrs--;
    if(club.sleeve.yrs<=0){
      const str=clubStrength(club,G.players), hon=(club.honours||[]).length;
      const newVal=round(shirtDealValue(str,hon)*0.35*10)/10;
      club.sleeve={ brand:pick(SLEEVE_BRANDS), value:newVal, yrs:rint(2,4) };
      if(isUser) logNews(G,"finance",`🩳 New sleeve & training-kit sponsor ${club.sleeve.brand} at ${money(newVal)}/yr`, club.id);
    }
  }
  // active sponsor payouts
  let sponsorIncome=0;
  club.sponsors=(club.sponsors||[]).filter(s=>s.yrs>0);
  club.sponsors.forEach(s=>{ sponsorIncome=round((sponsorIncome+s.val)*10)/10; s.yrs--; if(s.yrs<=0 && isUser) logNews(G,"finance",`🤝 Sponsorship with ${s.name} has ended.`, club.id); });
  club.sponsors=club.sponsors.filter(s=>s.yrs>0);
  // cup prizes
  const cupPrize=cupPrizeMoney(G, club.id);
  // naming rights payout
  let namingIncome=0;
  if(club.namingRights){
    namingIncome=club.namingRights.val;
    club.namingRights.yrs--;
    if(club.namingRights.yrs<=0){
      if(isUser) logNews(G,"finance",`🏟️ The naming-rights deal at ${club.stadium} has expired.`, club.id);
      keepTraditionalName(G, club);
      namingIncome=0;
    }
  }
  // total commercial income applied to budget
  const total=round((shirtIncome+sleeveIncome+sponsorIncome+cupPrize+namingIncome)*10)/10;
  club.budget=round((club.budget+total)*10)/10;
  // store breakdown for the P&L display (MERGE — keep tv/prize/gate/wages set by
  // the season settlement above; replacing the object wiped them and made AI
  // income look near-zero to capAIWageBill)
  club.lastPnl = { ...(club.lastPnl||{}), shirt:shirtIncome, sleeve:sleeveIncome, sponsor:sponsorIncome, cup:cupPrize, naming:namingIncome };
  // AI clubs proactively grow commercial income so they can compete to pay players
  if(!isUser) aiManageCommercials(G, club);
  // generate a new sponsor offer for the user
  if(isUser && chance(0.6) && (club.sponsorOffers||[]).length<3){
    const offer=generateSponsorOffer(G, club);
    club.sponsorOffers=[...(club.sponsorOffers||[]), offer];
    logNews(G,"finance",`📩 ${offer.name} (${offer.tier}) want to sponsor ${club.name}: ${money(offer.val)}/yr for ${offer.yrs} years`, club.id);
  }
  // generate a new naming-rights offer for the user (only when not already sold)
  if(isUser && !club.namingRights && chance(0.4) && (club.namingOffers||[]).length<2){
    const offer=generateNamingOffer(G, club);
    club.namingOffers=[...(club.namingOffers||[]), offer];
    logNews(G,"finance",`📩 ${offer.sponsor} want naming rights to your stadium: "${offer.name}" for ${money(offer.val)}/yr (${offer.yrs}y)`, club.id);
  }
}
// Preventative check: an AI club's wage bill shouldn't run far ahead of its
// actual income (TV+prize+gate+commercial). Real clubs operate under FFP-style
// constraints; without this, renewals quietly inflate every club's wages each
// season while income stays flat, and the whole league's finances erode over
// a long save. Releases the worst value-for-wage player until back in line.
function capAIWageBill(G, club, sellCtx){
  if(club.userControlled && !AUTO_MANAGE) return;
  const pnl = club.lastPnl||{};
  const income = (pnl.tv||0)+(pnl.prize||0)+(pnl.gate||0)+(pnl.conc||0)+(pnl.merch||0)+(pnl.shirt||0)+(pnl.sleeve||0)+(pnl.sponsor||0)+(pnl.cup||0);
  // prestigious clubs sustain a payroll smaller clubs can't (their commercial
  // income is bigger too, so this compounds) — up to +15% wage headroom
  const prest = Math.min(((club.honours||[]).filter(h=>h.type==="league"||h.type==="continental").length), 30);
  const cap = income*(0.52 + prest*0.006);   // wages stay well under income, leaving room for overhead AND a surplus
  // one squad scan, then maintain the bill locally (a wageBill() world-scan per
  // release was O(world²) across 640 clubs)
  const mine = teamPlayersOf(G.players, club.id);
  let bill = mine.reduce((s,p)=>s+(p.salary||0),0);
  let squad = mine.filter(p=>!p.youth);
  let guard=0;
  while(bill > cap && guard++<14){
    if(squad.length<=16) break;
    const worst = squad.slice().sort((a,b)=>(b.salary/(b.ovr||1))-(a.salary/(a.ovr||1)))[0];
    bill -= (worst.salary||0);
    squad = squad.filter(p=>p!==worst);
    shedPlayer(G, worst, sellCtx);   // sell for a fee where there's a market, else free
  }
}
// A badly-run club can't spiral into bottomless debt forever — that's not how
// football clubs actually work (administration, FFP, forced sales kick in).
// AI clubs in crisis get force-restructured; the user instead faces a real
// consequence (board confidence hit) so financial mismanagement has teeth
// without taking away the user's agency over their own transfers.
const FINANCIAL_CRISIS = -25;     // budget below this triggers action
function relieveFinancialDistress(G, club){
  if(club.budget >= FINANCIAL_CRISIS) return;
  if(club.userControlled && !AUTO_MANAGE){
    if(jobSecurityOn(G)){
      G.boardConfidence = clamp((G.boardConfidence==null?60:G.boardConfidence) - 12, 0, 100);
      logNews(G,"finance",`⚠️ The board is alarmed by the club's finances (${money(club.budget)}). Balance the books or risk your job.`, club.id);
    }
    return;   // no auto-rescue for the user — they must fix it themselves
  }
  // AI fire-sale: sell the most valuable player to whichever solvent club can
  // afford it; if nobody can, release the highest earners to cut the wage bill.
  // Exclude players who already moved this season — a club shouldn't immediately
  // fire-sell someone it just signed (that's a same-window bounce).
  const settled = p => !(p.transfers||[]).some(t=>t.s===G.season);
  let squad = Object.values(G.players).filter(p=>p.teamId===club.id && !p.youth && settled(p)).sort((a,b)=>b.value-a.value);
  let guard=0;
  while(club.budget < FINANCIAL_CRISIS && squad.length>14 && guard++<10){
    const target = squad[0];
    const fee = round(target.value*0.75*10)/10;
    const buyer = G.clubs.filter(c=>c.id!==club.id && c.budget>=fee+10
      && Object.values(G.players).filter(p=>p.teamId===c.id && !p.youth).length<26)
      .sort((a,b)=>b.budget-a.budget)[0];
    if(buyer){
      buyer.budget = round((buyer.budget-fee)*10)/10;
      club.budget = round((club.budget+fee)*10)/10;
      logMove(G, target, "buy", club.id, buyer.id, fee);
      target.teamId = buyer.id; autoPickXI(buyer, G.players);
      logNews(G,"finance",`💰 Financial trouble forces ${club.name} to sell ${target.name} to ${buyer.name} for ${money(fee)}`, club.id);
    } else {
      // no buyer — release the most expensive wage instead, to cut costs
      const cutSquad = Object.values(G.players).filter(p=>p.teamId===club.id && !p.youth).sort((a,b)=>b.salary-a.salary);
      if(!cutSquad.length) break;
      releaseToFA(G, cutSquad[0]);
      logNews(G,"finance",`📉 ${club.name} release ${cutSquad[0].name} to cut their wage bill amid financial trouble`, club.id);
    }
    squad = Object.values(G.players).filter(p=>p.teamId===club.id && !p.youth).sort((a,b)=>b.value-a.value);
  }
  // last resort: if fire-sales alone couldn't fully recover, a board loan/admin
  // restructuring normalizes them so no AI club ends a season bottomlessly broke
  if(club.budget < FINANCIAL_CRISIS) club.budget = round((FINANCIAL_CRISIS+rint(2,8))*10)/10;
  autoPickXI(club, G.players);
}

const ACADEMY_UPGRADE_COST = [0, 5, 12, 25, 50];  // cost to go from level N to N+1 (£M)
const ACADEMY_LEVEL_NAME = ["","Basic","Standard","Advanced","Elite","World Class"];
function Finances({G, commit, tShow}){
  const user = G.clubs[G.userTeamId];
  ensureCommercials(G, user);
  const bill = wageBill(G, user.id);
  const squad = Object.values(G.players).filter(p=>p.teamId===user.id).sort((a,b)=>b.salary-a.salary);
  const lvl = (user.academy && user.academy.level) || 1;
  const upgradeCost = ACADEMY_UPGRADE_COST[lvl];
  const canUpgrade = lvl < 5 && user.budget >= upgradeCost;
  const doUpgrade = () => {
    user.budget = round((user.budget - upgradeCost)*10)/10;
    user.academy = { ...(user.academy||{}), level: lvl+1 };
    logNews(G, "youth", `🏗️ Academy upgraded to ${ACADEMY_LEVEL_NAME[lvl+1]}`, user.id);
    commit(G); tShow(`Academy upgraded to ${ACADEMY_LEVEL_NAME[lvl+1]}`);
  };
  const stands = ensureStands(user);
  const cap = stadiumCapacity(user);
  const maxStandSize = facilityMaxStand(user);
  const expand = key => {
    if(stands[key] >= maxStandSize){ tShow(`${key} stand is at the limit for your current facility tier — upgrade facilities to expand further.`); return; }
    const cost = standExpandCost(stands[key]);
    if(user.budget < cost){ tShow("Not enough budget for that expansion."); return; }
    user.budget = round((user.budget - cost)*10)/10;
    stands[key] = Math.min(maxStandSize, stands[key]+STAND_STEP); user.capacity = stadiumCapacity(user);
    logNews(G, "finance", `🏟️ Expanded the ${key} stand at ${user.stadium} (+${STAND_STEP.toLocaleString()} seats)`, user.id);
    commit(G); tShow(`${key} stand expanded — ${stadiumCapacity(user).toLocaleString()} total seats`);
  };
  const flvl = ensureFacility(user);
  const fInfo = FACILITY_TIERS[flvl];
  const fNext = FACILITY_TIERS[flvl+1];
  const upgradeFacility = () => {
    if(!fNext) return;
    if(user.budget < fNext.cost){ tShow("Not enough budget to upgrade facilities."); return; }
    user.budget = round((user.budget - fNext.cost)*10)/10;
    user.facilityTier = flvl+1;
    logNews(G,"finance",`🏗️ ${user.stadium} upgraded to ${fNext.name} status`, user.id);
    commit(G); tShow(`Facilities upgraded to ${fNext.name}`);
  };
  const namingYrly = (user.namingRights||{}).val||0;
  const sellNaming = o => { sellNamingRights(G, user, o); commit(G); tShow(`Sold naming rights to ${o.sponsor}`); };
  const declineNaming = o => { user.namingOffers=(user.namingOffers||[]).filter(x=>x!==o); commit(G); };
  const restoreName = () => { keepTraditionalName(G, user); commit(G); tShow("Traditional name restored"); };
  // Commercials
  const shirtYrly = ((user.shirt||{}).value||0) + ((user.sleeve||{}).value||0);
  const sponsorYrly = (user.sponsors||[]).reduce((s,x)=>s+x.val,0);
  const tier = ticketTier(user);
  const gateSoFar = round((user.seasonGate||0)*10)/10;
  const gateLog = user.gateLog||[];
  const lastAtt = gateLog[0]||null;
  // a rough full-season projection at the current price/standing (19 league homes
  // + a few cup/UCL nights), used only for the headline "net commercial" tile
  const projFill = homeFillRate(G, user, {});
  const gateYrly = round(cap/1000*([0.040,0.023,0.013,0.007][user.div]||0.006)*facilityGateMult(user)*projFill*tier.priceMult*21*10)/10;
  const setTicket = i => { user.ticketTier=i; commit(G); tShow(`Tickets set to ${TICKET_TIERS[i].name}`); };
  const ctier = concessionTier(user);
  const concSoFar = round((user.seasonConcession||0)*10)/10;
  const concYrly = round((cap*projFill/1000)*([0.009,0.006,0.004,0.0025][user.div]||0.0025)*facilityGateMult(user)*ctier.priceMult*ctier.uptakeMult*21*10)/10;
  const setConc = i => { user.concessionTier=i; commit(G); tShow(`Food & drink set to ${CONCESSION_TIERS[i].name}`); };
  const merchYrly = round((gateYrly*0.16 + clubPopularity(G,user)*5.5*storeTierOf(user).mult)*10)/10;
  const storeLvl = clamp(user.storeTier||0,0,STORE_TIERS.length-1);
  const storeNext = STORE_TIERS[storeLvl+1];
  const upgradeStore = () => { if(!storeNext) return; if(user.budget<storeNext.cost){ tShow("Not enough budget to upgrade the store."); return; } user.budget=round((user.budget-storeNext.cost)*10)/10; user.storeTier=storeLvl+1; logNews(G,"finance",`🛍️ Club shop upgraded to ${storeNext.name}`, user.id); commit(G); tShow(`Store upgraded to ${storeNext.name}`); };
  const pnl = user.lastPnl||{};
  const acceptSponsor = o => {
    user.sponsors=[...(user.sponsors||[]),{name:o.name,tier:o.tier,val:o.val,yrs:o.yrs}];
    user.sponsorOffers=(user.sponsorOffers||[]).filter(x=>x!==o);
    logNews(G,"finance",`🤝 Signed ${o.yrs}-year sponsorship with ${o.name}: ${money(o.val)}/yr`, user.id);
    commit(G); tShow(`Signed with ${o.name}`);
  };
  const declineSponsor = o => { user.sponsorOffers=(user.sponsorOffers||[]).filter(x=>x!==o); commit(G); };
  // Stand diagram
  const maxStand = Math.max(stands.N, stands.E, stands.S, stands.W, 1);
  const depth = s => 14 + 26*(s/maxStand);
  return (
    <div className="space-y-3">
      {user.budget < FINANCIAL_CRISIS && (
        <Card className="border-red-500/50 bg-red-900/20">
          <div className="font-semibold text-red-300">⚠️ Financial crisis</div>
          <div className="text-sm text-slate-300 mt-1">The board won't bail you out — sell players, cut wages, or sign a sponsor before they lose patience with you.</div>
        </Card>
      )}
      {/* top-line budget */}
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <Card><div className="text-xs text-slate-400">Transfer Budget</div><div className={"text-2xl font-bold "+(user.budget<0?"text-red-400":"")}>{money(user.budget)}</div></Card>
        <Card><div className="text-xs text-slate-400">Wage Bill / yr</div><div className="text-2xl font-bold text-red-400">-{money(bill)}</div></Card>
        <Card><div className="text-xs text-slate-400">Net Commercial / yr</div><div className="text-2xl font-bold text-emerald-400">+{money(round((gateYrly+concYrly+merchYrly+shirtYrly+sponsorYrly+namingYrly)*10)/10)}</div><div className="text-xs text-slate-500">gate + food + merch + shirt + sponsors + naming</div></Card>
      </div>

      {/* last season P&L */}
      {pnl.tv!=null && (
        <Card>
          <div className="font-semibold mb-2">📊 Last season — P&L</div>
          <div className="space-y-1 text-sm">
            {[
              ["📺 TV & distribution", pnl.tv, true],
              ["🏆 League prize money", pnl.prize, true],
              [`🏟️ Gate income (${pnl.gateGames||0} home games)`, pnl.gate, true],
              ["🍔 Food & drink", pnl.conc||0, true],
              ...(pnl.boxes?[["🥂 Hospitality boxes", pnl.boxes, true]]:[]),
              [`🛍️ Merchandise${pnl.merchOnline!=null?` (£${(pnl.merchMatch||0).toFixed(1)}m matchday + £${(pnl.merchOnline||0).toFixed(1)}m online)`:""}`, pnl.merch||0, true],
              ["👕 Shirt deal", pnl.shirt||0, true],
              ["🩳 Sleeve/training kit", pnl.sleeve||0, true],
              ["🤝 Sponsor income", pnl.sponsor||0, true],
              ["🏷️ Naming rights", pnl.naming||0, true],
              ["🏅 Cup prize money", pnl.cup||0, true],
              ["💸 Wages", pnl.wages, false],

            ].map(([label,val,pos])=>(
              <div key={label} className="flex justify-between">
                <span className="text-slate-400">{label}</span>

            </div>

      {/* ticket pricing + live gate ledger */}

        </div>

        <div className="mx-auto" style={{maxWidth:"360px"}}>
          {/* top-down view: 4 stands around the pitch, thickness scales with seats */}

function Stand({k, name, seats, cost, budget, onExpand, vertical, bar}){
  const can = budget>=cost;
  const barStyle = vertical ? {width:bar.width, minHeight:"56px"} : {height:bar.height};
  return (
    <div className="flex flex-col items-center justify-center gap-1 h-full">
      <div className={"bg-[#1d2b47] border border-[#27406b] rounded flex items-center justify-center text-[9px] text-slate-200 font-semibold "+(vertical?"":"w-full")} style={barStyle} title={name+" Stand · "+seats.toLocaleString()+" seats"}>{(seats/1000).toFixed(1)}k</div>
      <button onClick={()=>onExpand(k)} disabled={!can} className={"text-[9px] px-1.5 py-0.5 rounded whitespace-nowrap font-semibold "+(can?"bg-emerald-600 text-white":"bg-[#16213a] text-slate-500 cursor-not-allowed")} title={"Expand "+name+" stand (+"+STAND_STEP.toLocaleString()+" seats)"}>+{money(cost)}</button>
    </div>
  );
}

/* ----------------------------- awards / hof ---------------------------- */
function AwardsView({G}){
  const hist = G.awardHistory||[];
  const [country, setCountry] = useState(G.clubs[G.userTeamId].country||0);
  const awardSet = (a, ci) => {
    // new shape: a.countries[]; legacy shape: flat a.pots/boot/... (treat as country 0)
    if(a.countries) return a.countries.find(x=>x.country===ci) || null;
    return ci===0 ? a : null;
  };
  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap">
        {COUNTRIES.map((C,ci)=>(
          <button key={ci} onClick={()=>setCountry(ci)} className={"px-3 py-1.5 rounded text-sm "+(country===ci?"bg-indigo-500 text-white font-semibold":"bg-[#16213a] text-slate-300")}>{C.flag} {C.name}</button>
        ))}
      </div>
      {!hist.length && <Card><div className="text-slate-400 text-sm">No awards yet — finish a season.</div></Card>}
      {hist.filter(a=>a.ballonDor).length>0 && (
        <Card>
          <div className="font-semibold mb-2">🏆 Ballon d'Or — World's Best</div>
          <div className="space-y-1 text-sm">
            {hist.filter(a=>a.ballonDor).map(a=>(
              <div key={a.season} className="flex items-center gap-2 bg-[#0d1526] rounded p-2">
                <span className="text-amber-300 font-bold w-12 tnum">{a.season}</span>
                <span className="flex-1 font-semibold">{a.ballonDor.name}</span>
                <span className="text-slate-400 text-xs">{a.ballonDor.pos} · {a.ballonDor.team}</span>
                <span className="text-slate-400 text-xs tnum">{a.ballonDor.g}g · {a.ballonDor.r} avg</span>
              </div>
            ))}
          </div>
        </Card>
      )}
      {hist.map(a=>{
        const s = awardSet(a, country);
        if(!s) return null;
        return (
        <Card key={a.season}>
          <div className="font-semibold mb-2">{a.season} {divName(country,0)} Awards</div>
          {a.ballonDor && <div className="text-xs text-amber-300/80 mb-2">🏆 Ballon d'Or: {a.ballonDor.name} ({a.ballonDor.team})</div>}
          <div className="grid sm:grid-cols-2 gap-2 text-sm">
            <AwardRow label="🏅 Player of the Season" v={s.pots} extra={s.pots?`${s.pots.r} avg`:""} G={G} />
            <AwardRow label="⚽ Golden Boot" v={s.boot} extra={s.boot?`${s.boot.g} goals`:""} G={G} />
            <AwardRow label="🧤 Golden Glove" v={s.glove} extra={s.glove?`${s.glove.cs} CS`:""} G={G} />
            <AwardRow label="🌟 Young Player" v={s.young} extra={s.young?`${s.young.r} avg`:""} G={G} />
          </div>
          {Array.isArray(s.tots) && s.tots.length>0 && (
            <div className="mt-3">
              <div className="text-xs text-slate-400 mb-1">⭐ Team of the Season</div>
              <div className="grid sm:grid-cols-2 gap-1 text-sm">
                {s.tots.map(p=>(
                  <div key={p.id} className="flex items-center gap-2 bg-[#0d1526] rounded px-2 py-1">
                    <span className="text-slate-500 text-xs w-8">{p.pos}</span>
                    <span className="flex-1 font-medium">{p.name}</span>
                    <span className="text-xs text-slate-400">{p.team}</span>
                    <span className="text-xs text-slate-400 tnum">{p.pos==="GK"||p.g+p.a===0?`${p.r}`:`${p.g}g ${p.a}a`}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </Card>
        );
      })}
    </div>
  );
}
function AwardRow({label, v, extra, G}){
  return (
    <div className="bg-[#16213a] rounded p-2">
      <div className="text-xs text-slate-400">{label}</div>
      {v ? <div className="font-medium">{v.name} <span className="text-xs text-slate-400">{v.team} · {extra}</span></div> : <div className="text-slate-500">—</div>}
    </div>
  );
}
function HallOfFame({G}){
  const hof = G.hof||[];
  const ctxOpen = React.useContext(PlayerCtx);
  return (
    <div className="space-y-3">
      <Card><div className="font-semibold">Hall of Fame</div><div className="text-sm text-slate-400">Club legends inducted on retirement. Tap any to see their full career stats.</div></Card>
      {!hof.length && <Card><div className="text-slate-400 text-sm">No inductees yet.</div></Card>}
      <div className="grid sm:grid-cols-2 gap-3">
        {hof.map(h=>(
          <Card key={h.id} className="cursor-pointer hover:bg-[#16213a]" onClick={()=>ctxOpen&&ctxOpen(resolveRecordPlayer(G, h))}>

/* ----------------------------- player modal ---------------------------- */
// Resolve a records/HOF summary entry to the best available player object for the
// profile modal: the live player if still active, else the (slimmed) retired
// archive entry, else a synthesized object from the recorded career totals. Always
// returns something with stats/career/history present so PlayerModal is safe.
function resolveRecordPlayer(G, rec){
  const live = (G.players||{})[rec.id];
  if(live) return live;
  const ret = (G.retired||{})[rec.id];
  const base = ret ? { ...ret } : {
    id:rec.id, name:rec.name, pos:rec.pos, nat:rec.nat, retired:true, hof:!!rec.hof,
    ovr:rec.peak||0, pot:rec.peak||0, peakOvr:rec.peak,
    caps:rec.caps||0, intlG:rec.intlG||0, ballonDor:rec.ballonDor||0, golden:rec.golden||0,
    career: Object.assign(emptyStats(), { G:rec.G||0, A:rec.A||0, App:rec.App||0, CS:rec.CS||0, MOTM:rec.MOTM||0, Sv:rec.Sv||0, Tkl:rec.Tkl||0, Int:rec.Int||0, Clr:rec.Clr||0, Blk:rec.Blk||0, Aer:rec.Aer||0, PrgP:rec.PrgP||0 }),
  };
  base.retired = true;
  // HOF entries carry their own history/comp snapshot (rec.hist / rec.cc) — use
  // it whenever the live/retired object lacks one, so season-by-season always shows
  if((!Array.isArray(base.history) || !base.history.length) && Array.isArray(rec.hist) && rec.hist.length) base.history = rec.hist;
  if(!base.careerComp && rec.cc) base.careerComp = rec.cc;
  if(base.nat==null && rec.nat!=null) base.nat = rec.nat;
  if(!base.stats) base.stats = emptyStats();
  if(!base.career) base.career = emptyStats();
  if(!Array.isArray(base.history)) base.history = [];
  return base;
}
function PlayerModal({p, G, onClose}){
  const club = p.teamId!=null && G.clubs[p.teamId] ? G.clubs[p.teamId] : null;
  const attrs = p.pos==="GK"
    ? [["GK",p.gk],["Phy",p.phy],["Pas",p.pas],["Pac",p.pac]]
    : [["Pac",p.pac],["Sho",p.sho],["Pas",p.pas],["Dri",p.dri],["Def",p.def],["Phy",p.phy]];
  // retired/archived players carry no live season state — default everything
  const st = p.stats || emptyStats(), ca = p.career || emptyStats();
  const [lg, setLg] = useState("all");
  const [comp, setComp] = useState("all");     // this-season competition filter
  const [ccomp, setCcomp] = useState("all");   // career competition filter
  const hist = p.history || [];
  // Distinct leagues this player has appeared in, newest-first by last season seen.
  const lkey = h => h.country!=null ? h.country+"-"+h.div : "_";
  const leagues = []; const seen = {};
  hist.forEach(h=>{ const k=lkey(h); if(!seen[k]){ seen[k]=1; leagues.push({ key:k, label:h.league||"—", flag:(COUNTRIES[h.country]||{}).flag||"" }); } });
  const histShown = lg==="all" ? hist : hist.filter(h=>lkey(h)===lg);
  const careerShown = lg==="all" ? ca : sumStats(histShown);
  const sel = leagues.find(l=>l.key===lg);
  const careerLabel = lg==="all" ? "Career (all leagues)" : `Career — ${sel?sel.flag+" "+sel.label:""}`;
  const nat = COUNTRIES[p.nat]||null;
  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-xl w-full max-w-lg max-h-[85vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-4 border-b border-[#1d2940] flex items-start gap-3 sticky top-0 bg-[#101a30]">
          <ScoutOvrPill p={p} />
          <div className="flex-1">
            <div className="font-bold text-lg">{nat&&<span className="mr-1" title={nat.name}>{nat.flag}</span>}{p.name}{scoutConf(p)<0.85&&<span className="text-[10px] text-slate-500 font-normal ml-2">scouted ~{Math.round(scoutConf(p)*100)}%</span>}{p.seasonDev?<span className={"text-[11px] font-semibold ml-2 "+(p.seasonDev>0?"text-emerald-400":"text-red-400")} title="OVR change this season">{p.seasonDev>0?"↗ +":"↘ "}{p.seasonDev}</span>:null}</div>
            <div className="text-sm text-slate-400">{posLabel(p)}{p.age?` · ${p.age}y`:""}{p.foot?` · ${p.foot==="B"?"Both":p.foot==="L"?"Left":"Right"} footed`:""}{club?` · ${club.name}`:p.retired?" · Retired":" · Free agent"}</div>
            {p.retired
              ? <div className="text-xs text-slate-500 mt-0.5">Retired{p.retiredSeason!=null?` in ${p.retiredSeason}`:""}{p.retiredAge!=null?` at ${p.retiredAge}`:""}{p.debutSeason!=null&&p.retiredSeason!=null?` · ${p.retiredSeason-p.debutSeason} season career`:""}</div>
              : <div className="text-xs text-slate-500 mt-0.5">Potential {scoutConf(p)>=0.85?p.pot:scoutedPot(p)+"~"} · Value {money(p.value)} · Wage {money(p.salary)}/yr{p.years>0?` · ${p.years}y left`:""}{p.fitness!=null&&p.fitness<100?` · ${p.fitness}% fit`:""}</div>}
            <div className="text-xs text-slate-500 mt-0.5">{p.peakOvr?`Peak OVR ${p.peakOvr}`:""}{p.debutSeason!=null?` · Debut ${p.debutSeason}`:""}{p.hof?" · 🏅 Hall of Fame":""}{(p.awards||0)>0?` · ${p.awards}× POTS`:""}{(p.tots||0)>0?` · ${p.tots}× Team of the Season`:""}{(p.golden||0)>0?` · ${p.golden}× Golden Boot`:""}{(p.ballonDor||0)>0?` · 🏆 ${p.ballonDor}× Ballon d'Or`:""}{(p.caps||0)>0?` · ${p.caps} caps`:""}{(p.intlG||0)>0?` · ${p.intlG} intl goals`:""}</div>
            {(formTag(p.form)||moraleTag(p.morale))&&<div className="text-xs mt-0.5">{formTag(p.form)&&<span className={formTag(p.form).c}>{formTag(p.form).t}</span>}{formTag(p.form)&&moraleTag(p.morale)&&<span className="text-slate-600"> · </span>}{moraleTag(p.morale)&&<span className={moraleTag(p.morale).c}>{moraleTag(p.morale).t}</span>}</div>}
            {(p.release!=null||p.sellOn)&&<div className="text-xs mt-0.5 text-slate-500">{p.release!=null?`Release ${money(p.release)}`:""}{p.release!=null&&p.sellOn?" · ":""}{p.sellOn?`${p.sellOn.pct}% sell-on → ${(G.clubs[p.sellOn.toClubId]||{}).abbr||"?"}`:""}</div>}
            {p.wantsOut&&<div className="text-xs mt-0.5 text-orange-400">✈️ Has requested a transfer</div>}
            {p.listed&&!p.wantsOut&&<div className="text-xs mt-0.5 text-indigo-300">🏷️ Transfer-listed</div>}
            {p.traits&&p.traits.length>0&&<div className="mt-1 flex flex-wrap gap-1">{p.traits.map(t=>TRAITS[t]&&<span key={t} className={"text-[11px] px-1.5 py-0.5 rounded "+(TRAITS[t].bad?"bg-red-900/40 text-red-300":"bg-[#16213a] text-slate-300")} title={TRAITS[t].bad?"Negative trait":"Special trait"}>{TRAITS[t].emoji} {TRAITS[t].name}</span>)}</div>}
            {(isInjured(p)||isSuspended(p))&&<div className="text-xs mt-0.5">{isInjured(p)&&<span className="text-red-400">✚ {p.injury.type} ({p.injury.weeks}w)</span>}{isInjured(p)&&isSuspended(p)&&" · "}{isSuspended(p)&&<span className="text-orange-400">⛔ banned {p.susp} match{p.susp>1?"es":""}</span>}</div>}
          </div>
          <button onClick={onClose} className="text-slate-400">✕</button>
        </div>
        <div className="p-4 space-y-4">
          <div className="grid grid-cols-3 gap-2">
            {attrs.map(([k,v])=>(
              <div key={k} className="bg-[#16213a] rounded p-2 text-center">
                <div className="text-xs text-slate-400">{k}</div>
                <div className="text-xl font-bold tnum">{v}</div>
              </div>
            ))}
          </div>
          {!p.retired && <div>
            <div className="text-sm font-semibold mb-1">This season</div>
            {/* per-competition filter for this season's stats */}
            {(()=>{
              const cs = p.compStats||{};
              const comps = [["all","All",st],["L","⚽ League",cs.L],["C","🏆 Cup",cs.C],["CC","🌍 Champs Cup",cs.CC]].filter(([k,_,s])=>k==="all"||(s&&s.App>0));
              const dispSt = comp==="all"?st:(cs[comp]||emptyStats());
              return <>
                {comps.length>1 && <div className="flex gap-1 flex-wrap mb-2">{comps.map(([k,l])=><button key={k} onClick={()=>setComp(k)} className={"px-2 py-1 rounded text-xs font-semibold "+(comp===k?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l}</button>)}</div>}
                <StatLine s={dispSt} gk={p.pos==="GK"} />
              </>;
            })()}
          </div>}
          {leagues.length>1 && (
            <div className="flex gap-1 flex-wrap">
              <button onClick={()=>setLg("all")} className={"px-2 py-1 rounded text-xs font-semibold "+(lg==="all"?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>All</button>
              {leagues.map(l=>(
                <button key={l.key} onClick={()=>setLg(l.key)} className={"px-2 py-1 rounded text-xs font-semibold "+(lg===l.key?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l.flag} {l.label}</button>
              ))}
            </div>
          )}
          <div>
            {/* all-time career, sliceable by competition (All / League / Cup / Champs Cup) */}
            {(()=>{
              const cc = p.careerComp||{};
              const comps = [["all","All",ca],["L","⚽ League",cc.L],["C","🏆 Cup",cc.C],["CC","🌍 Champs Cup",cc.CC]].filter(([k,_,s])=>k==="all"||(s&&s.App>0));
              const dispCa = ccomp==="all" ? careerShown : (cc[ccomp]||emptyStats());
              const cLbl = ccomp==="all" ? careerLabel : ("All-time — "+(comps.find(c=>c[0]===ccomp)||[])[1]);
              return <>
                <div className="text-sm font-semibold mb-1">{cLbl}</div>
                {comps.length>1 && <div className="flex gap-1 flex-wrap mb-2">{comps.map(([k,l])=><button key={k} onClick={()=>setCcomp(k)} className={"px-2 py-1 rounded text-xs font-semibold "+(ccomp===k?"bg-emerald-500 text-slate-900":"bg-[#16213a] text-slate-300")}>{l}</button>)}</div>}
                <StatLine s={dispCa} gk={p.pos==="GK"} />
              </>;
            })()}
          </div>
          {histShown.length>0 && (
            <div>
              <div className="text-sm font-semibold mb-1">Season-by-season{lg!=="all"&&sel?` · ${sel.flag} ${sel.label}`:""}</div>
              <div className="overflow-x-auto">
              <table className="w-full text-xs tnum">
                <thead><tr className="text-slate-500"><th className="text-left">Yr</th><th className="text-left">Club</th><th>Age</th><th>App</th><th title="Starts">St</th><th title="Minutes">Min</th><th>G</th><th>A</th><th>KP</th><th>CS</th><th>YC</th><th>RC</th><th>Rtg</th></tr></thead>
                <tbody>
                  {histShown.slice().reverse().map((h,i)=>(
                    <tr key={i} className="border-t border-[#15203a]">
                      <td className="text-left">{h.season}</td>
                      <td className="text-left whitespace-nowrap">{h.country!=null&&<span className="mr-0.5">{(COUNTRIES[h.country]||{}).flag}</span>}{h.team}{h.div>0&&<span className="text-slate-600 text-[9px]">{divSup(h.div)}</span>}{h.loan&&<span className="ml-0.5 text-sky-300 text-[10px]" title="Loan spell">🔁</span>}</td>
                      <td className="text-center">{h.age!=null?h.age:"—"}</td><td className="text-center">{h.App}</td>
                      <td className="text-center text-slate-400">{h.Start||0}</td><td className="text-center text-slate-400">{(h.Min||0).toLocaleString()}</td>
                      <td className="text-center">{h.G}</td><td className="text-center">{h.A}</td><td className="text-center">{h.KP||0}</td>
                      <td className="text-center">{h.CS}</td><td className="text-center">{h.YC||0}</td><td className="text-center">{h.RC||0}</td><td className="text-center">{h.r}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              </div>
            </div>
          )}
          {Array.isArray(p.transfers) && p.transfers.length>0 && (()=>{
            const fees = p.transfers.filter(t=>t.t==="buy" && t.fee!=null);
            const total = round(fees.reduce((s,t)=>s+t.fee,0)*10)/10;
            const label = t => t.t==="buy" ? null : t.t==="free" ? "Free transfer" : t.t==="rel" ? "Released" : t.t==="loan" ? "Loan" : t.t==="loanret" ? "End of loan" : t.t==="unret" ? "Out of retirement" : t.t;
            return (
              <div>
                <div className="text-sm font-semibold mb-1">💸 Transfer history{fees.length>1?<span className="text-xs text-slate-400 font-normal"> · {money(total)} in career fees</span>:null}</div>
                <div className="space-y-0.5 text-sm">
                  {p.transfers.slice().reverse().map((t,i)=>(
                    <div key={i} className="flex items-center gap-2">
                      <span className="text-slate-500 tnum text-xs w-10">{t.s}</span>
                      <span className="flex-1 text-slate-300">{t.from||"—"} <span className="text-slate-500">→</span> {t.to||"Free agency"}</span>
                      {t.t==="buy"
                        ? <span className="font-semibold tnum text-emerald-300">{t.fee!=null?money(t.fee):"Undisclosed"}</span>
                        : <span className="text-xs text-slate-500">{label(t)}</span>}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}
// xG Prevented: shot-stopping above/below what an average keeper would allow
// given the xG they actually faced (PSxG-style metric: xGA - GA). Positive =
// better than expected, negative = worse. Needs a few appearances to be meaningful.
function xgPrevented(s){ return s && s.App ? +((s.xGA||0)-(s.GA||0)).toFixed(2) : null; }
function StatLine({s, gk}){
  const xgp = gk ? xgPrevented(s) : null;
  const dq = duelPct(s), pq = passPct(s), sq = savePct(s);
  const starts=s.Start||0, subApps=Math.max(0,(s.App||0)-starts);
  const cells = [["App",s.App||0],["Starts",starts],["Sub apps",subApps],
    ["Minutes",(s.Min||0).toLocaleString()],
    ["Goals",s.G||0],["Assists",s.A||0],
    ["Shots",s.SH||0],["On tgt",s.SOT||0],["xG",(s.xG||0).toFixed(1)],
    ["Key Pass",s.KP||0],
    gk?["Saves",s.Sv||0]:["MOTM",s.MOTM||0],
    ["Clean Sh",s.CS||0],["Yellow",s.YC||0],["Red",s.RC||0],
    ["Pens",s.PK||0],["Pens Missed",s.PKM||0],["Free Kicks",s.FK||0],
    // defensive
    ["Tackles",s.Tkl||0],["Interc.",s.Int||0],["Clearances",s.Clr||0],
    ["Blocks",s.Blk||0],["Aerials",s.Aer||0],["Duel %",dq==null?"—":dq+"%"],
    ["Errors",s.Err||0],
    // possession
    ["Passes",s.Pass||0],["Pass %",pq==null?"—":pq+"%"],["Prog. Pass",s.PrgP||0],
    ["Dribbles",s.Drb||0],["Crosses",s.Crs||0],
    ...(gk?[["Sweeper",s.Swp||0],["Pen Saves",s.PKSv||0],["Save %",sq==null?"—":sq+"%"],
      ["xG Faced",(s.xGA||0).toFixed(1)],["Goals Allowed",s.GA||0],["xG Prevented",xgp==null?"—":(xgp>0?"+":"")+xgp]]:[]),
    ["Def. Value",defContribution(s)],
    ["Rating",avgRating(s)?avgRating(s).toFixed(2):"—"],["Value",ratingValue(s)]];
  return (
    <div className="grid grid-cols-3 gap-2 text-center">
      {cells.map(([k,v])=>(
        <div key={k} className="bg-[#16213a] rounded p-2">
          <div className="text-[11px] text-slate-400">{k}</div>
          <div className={"font-bold tnum "+(k==="xG Prevented"&&typeof v==="string"&&v[0]==="+"?"text-emerald-400":k==="xG Prevented"&&typeof v==="string"&&v[0]==="-"?"text-red-400":"")}>{v}</div>
        </div>
      ))}
    </div>
  );
}

/* ----------------------------- job offers ------------------------------ */
function JobModal({G, commit, tShow, setTab, onClose, onRetire}){
  const sack = !!G.pendingSack;
  const offers = G.jobOffers||[];
  const accept = o => { takeJob(G, o.id); commit(G); setTab("hub"); tShow(`Appointed manager of ${G.clubs[o.id].name}`); };
  const decline = () => { G.jobOffers=null; commit(G); onClose(); };
  return (
    <div className="fixed inset-0 bg-black/70 z-[60] flex items-end sm:items-center justify-center p-4" onClick={sack?undefined:decline}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-2xl w-full max-w-md max-h-[85vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-4 border-b border-[#1d2940]">
          <div className="font-bold text-lg">{sack?"📉 You've been sacked":"📈 A bigger club wants you"}</div>
          <div className="text-sm text-slate-400 mt-1">{sack?"Pick your next job to continue your management career — or retire.":"You've earned an approach. Take the job, or stay and keep building."}</div>
        </div>
        <div className="p-4 space-y-2">
          {offers.map(o=>(
            <button key={o.id} onClick={()=>accept(o)} className="w-full text-left bg-[#0d1526] hover:bg-[#16213a] rounded-lg px-3 py-3 flex items-center gap-3">
              <div className="flex-1">
                <div className="font-semibold">{COUNTRIES[o.country].flag} {o.name}</div>
                <div className="text-xs text-slate-400">{divName(o.country,o.div)} · squad rating {o.str}</div>
              </div>
              <span className="text-emerald-400 text-sm font-semibold">Take job →</span>
            </button>
          ))}
          {!offers.length && <div className="text-slate-500 text-sm">No clubs are hiring right now.</div>}
        </div>
        <div className="p-4 border-t border-[#1d2940]">
          {sack
            ? <button onClick={onRetire} className="w-full px-3 py-2 rounded-lg bg-[#16213a] text-slate-300 text-sm">Retire from management (back to menu)</button>
            : <button onClick={decline} className="w-full px-3 py-2 rounded-lg bg-[#16213a] text-slate-300 text-sm">Stay at my current club</button>}
        </div>
      </div>
    </div>
  );
}

/* ----------------------------- settings -------------------------------- */
function SettingsModal({G, commit, tShow, onClose}){
  const [, force] = useState(0);
  G.settings = G.settings || {};
  const set = (k,v) => { G.settings[k]=v; commit(G); force(x=>x+1); };
  const Toggle = ({k, label, desc, def=true}) => {
    const on = G.settings[k]!==false && (G.settings[k]!=null?G.settings[k]:def);
    return (
      <label className="flex items-start justify-between gap-3">
        <span><span className="block">{label}</span>{desc&&<span className="block text-xs text-slate-500">{desc}</span>}</span>
        <input type="checkbox" className="mt-1" checked={!!on} onChange={e=>set(k,e.target.checked)} />
      </label>
    );
  };
  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-xl w-full max-w-sm max-h-[85vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-4 border-b border-[#1d2940] flex items-center justify-between sticky top-0 bg-[#101a30]"><div className="font-semibold">Settings</div><button onClick={onClose} className="text-slate-400">✕</button></div>
        <div className="p-4 space-y-4 text-sm">
          <Toggle k="injuries" label="Injuries" desc="Players can pick up knocks in matches." />
          <Toggle k="jobSecurity" label="Manager job security" desc="Board confidence, sackings and job offers." />
          <Toggle k="morale" label="Player morale & form" desc="Form streaks and happiness affect performance." />
          <Toggle k="internationals" label="International management" desc="Manage your nation between club seasons." />
          <Toggle k="watchMatches" label="Watch my matches" desc="Live match view with halftime subs (off = instant sim)." def={false} />
          <div className="text-xs text-slate-500 border-t border-[#1d2940] pt-3">Historical records are always saved regardless of these toggles. Save version {SAVE_VERSION}. Use Save File for backups.</div>
        </div>
      </div>
    </div>
  );
}

<script>
  // Transpile the JSX source with Babel standalone, then run it. (Same offline
  // approach as the rest of the bundle — no network needed.)
  (function(){
    try {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="color:#f87171;padding:16px;white-space:pre-wrap">App failed to start:\n' +
        (e && (e.message || e)) + '</pre>';
      console.error(e);
    }
  })();
</script>
<script>
  // PWA service worker: network-first for the app so a new push always wins,
  // and auto-reload once when a fresh version takes over.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        // Check for an update on every launch.
        reg.update();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              // A new version is ready — reload to use it.
              window.location.reload();
            }
          });
        });
      }).catch(function(e){ console.warn('SW registration failed', e); });
    });
  }
</script>
